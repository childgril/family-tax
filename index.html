    if (!s || !e) return { thisYear: 0, totalMonths: 0, durationMonths: 0 };
    const m = monthsInYear(s, e, year);
    const monthly = toNum(c.monthlyRent);
    const sJs = rocToDate(s), eJs = rocToDate(e);
    const totalMonths = (eJs.getFullYear() - sJs.getFullYear()) * 12 + (eJs.getMonth() - sJs.getMonth()) + 1;
    return {
      thisYear: m * monthly,
      thisYearMonths: m,
      totalMonths,
      totalRent: monthly * totalMonths,
    };
  };

  // 篩選 + 排序
  const filtered = (data.contracts || [])
    .filter(c => {
      if (filterProp !== "all" && c.propertyId !== filterProp) return false;
      const isPublic = c.contractType === "public" || c.isPublicLandlord;
      if (filterType === "general" && isPublic) return false;
      if (filterType === "public" && !isPublic) return false;
      if (filterTenant.trim()) {
        const q = filterTenant.trim().toLowerCase();
        const hit = (c.tenantName || "").toLowerCase().includes(q) ||
                    (c.tenantPhone || "").toLowerCase().includes(q);
        if (!hit) return false;
      }
      return true;
    })
    .sort((a, b) => {
      let av, bv;
      if (sortBy === "monthlyRent") {
        av = toNum(a.monthlyRent); bv = toNum(b.monthlyRent);
      } else if (sortBy === "thisYearRent") {
        const ca = computeForContract(a), cb = computeForContract(b);
        av = ca.thisYear; bv = cb.thisYear;
      } else if (sortBy === "endDate") {
        av = String(a.endDate || ""); bv = String(b.endDate || "");
      } else if (sortBy === "propertySerial") {
        const pa = data.properties.find(x => x.id === a.propertyId);
        const pb = data.properties.find(x => x.id === b.propertyId);
        av = String(pa?.serial || ""); bv = String(pb?.serial || "");
      } else if (sortBy === "tenant") {
        av = a.tenantName || ""; bv = b.tenantName || "";
      } else {
        av = String(a.startDate || ""); bv = String(b.startDate || "");
      }
      let cmp;
      if (typeof av === "number") cmp = av - bv;
      else cmp = av.localeCompare(bv, "zh-Hant", { numeric: true });
      return sortDir === "asc" ? cmp : -cmp;
    });

  // 排序切換
  const toggleSort = (col) => {
    if (sortBy === col) {
      setSortDir(d => d === "asc" ? "desc" : "asc");
    } else {
      setSortBy(col); setSortDir("desc");
    }
  };
  const sortIcon = (col) => sortBy === col ? (sortDir === "asc" ? " ↑" : " ↓") : "";
  const colTh = (col, label, extraClass = "") => (
    <th className={`text-xs font-medium cursor-pointer hover:underline ${extraClass}`}
      style={{ color: sortBy === col ? "var(--accent-deep)" : "var(--ink-mute)" }}
      onClick={() => toggleSort(col)}>{label}{sortIcon(col)}</th>
  );

  return (
    <div className="fade-in">
      <PageHeader
        ornament="§ LEASE CONTRACTS · 租賃合約"
        title="合約管理"
        subtitle={`系統會依「起迄日期 × 月租金」自動攤分到各年度,目前顯示 ${year} 年度試算結果`}
        right={
          <div className="space-x-2">
            <button className="btn-secondary text-sm" onClick={() => setImporting(!importing)}>
              ⛁ 匯入 / 匯出
            </button>
            <button className="btn-primary text-sm" disabled={data.members.length === 0}
              onClick={() => setEditing({ ...blank })}>+ 新增合約</button>
          </div>
        }
      />

      {/* 篩選列 */}
      {(data.contracts || []).length > 0 && (
        <div className="card p-3 mb-4 flex flex-wrap items-center gap-3" style={{ background: "#fdfcf7" }}>
          <span className="text-xs font-medium" style={{ color: "var(--ink-mute)" }}>FILTER ·</span>
          <div className="flex items-center gap-2">
            <label className="text-xs" style={{ color: "var(--ink-soft)" }}>物件</label>
            <select className="input-text-plain text-xs py-1" value={filterProp} onChange={e => setFilterProp(e.target.value)}>
              <option value="all">全部</option>
              {[...data.properties].sort((a,b) => String(a.serial||"").localeCompare(String(b.serial||""), "zh-Hant", {numeric:true}))
                .map(p => <option key={p.id} value={p.id}>{p.serial && `${p.serial} · `}{p.name}</option>)}
            </select>
          </div>
          <div className="flex items-center gap-2">
            <label className="text-xs" style={{ color: "var(--ink-soft)" }}>租客</label>
            <input className="input-text text-xs py-1 w-32" placeholder="姓名或電話"
              value={filterTenant} onChange={e => setFilterTenant(e.target.value)} />
          </div>
          <div className="flex items-center gap-2">
            <label className="text-xs" style={{ color: "var(--ink-soft)" }}>類型</label>
            <div className="flex gap-1">
              {[
                { v: "all", label: "全部" },
                { v: "general", label: "一般" },
                { v: "public", label: "公益" },
              ].map(opt => (
                <button key={opt.v}
                  className={`text-xs px-2 py-1 rounded ${filterType === opt.v ? "font-medium" : ""}`}
                  style={{
                    background: filterType === opt.v ? "var(--accent-soft)" : "white",
                    border: `1px solid ${filterType === opt.v ? "var(--accent)" : "var(--line)"}`,
                    color: filterType === opt.v ? "var(--accent-deep)" : "var(--ink-soft)"
                  }}
                  onClick={() => setFilterType(opt.v)}>{opt.label}</button>
              ))}
            </div>
          </div>
          <div className="flex-1"></div>
          <div className="text-xs" style={{ color: "var(--ink-mute)" }}>
            顯示 <b>{filtered.length}</b> / {(data.contracts || []).length} 份合約
          </div>
          {(filterProp !== "all" || filterTenant || filterType !== "all") && (
            <button className="btn-secondary text-xs"
              onClick={() => { setFilterProp("all"); setFilterTenant(""); setFilterType("all"); }}>
              清除篩選
            </button>
          )}
        </div>
      )}

      {/* 匯入工具區 */}
      {importing && (
        <div className="card mb-5 p-5" style={{ background: "#fdfcf7", borderColor: "var(--accent)" }}>
          <div className="ornament mb-3" style={{ color: "var(--accent-deep)" }}>BULK IMPORT · 批次匯入</div>
          <div className="grid grid-cols-2 gap-5">
            {/* 物件 CSV */}
            <div>
              <div className="font-medium text-sm mb-2">① 匯入出租物件</div>
              <div className="text-xs mb-3" style={{ color: "var(--ink-soft)" }}>
                CSV 欄位: <code className="num">序號, 屋主, 地址, 備註</code>
              </div>
              <div className="flex gap-2">
                <button className="btn-secondary text-xs"
                  onClick={() => downloadCSV("物件範本.csv", PROPERTIES_CSV_SAMPLE)}>
                  ↓ 下載範本
                </button>
                <input type="file" accept=".csv" ref={fileRefProperties}
                  onChange={importPropertiesCSV} className="hidden" />
                <button className="btn-primary text-xs"
                  onClick={() => fileRefProperties.current?.click()}
                  disabled={data.members.length === 0}>
                  ↑ 上傳 CSV
                </button>
              </div>
              <div className="text-[10px] mt-2" style={{ color: "var(--ink-mute)" }}>
                ⓘ「屋主」欄請填家庭成員的姓名 (例:陳大年);找不到時用第一個成員
              </div>
            </div>

            {/* 合約 CSV */}
            <div>
              <div className="font-medium text-sm mb-2">② 匯入租賃合約</div>
              <div className="text-xs mb-3" style={{ color: "var(--ink-soft)" }}>
                CSV 欄位: <code className="num text-[10px]">物件地址, 租客姓名, 電話, 租期起, 租期迄, 月租, 管理費, 押金, 負責出租人, 公益出租, 公益期間, 公益登記人, 備註</code>
              </div>
              <div className="flex gap-2">
                <button className="btn-secondary text-xs"
                  onClick={() => downloadCSV("合約範本.csv", CONTRACTS_CSV_SAMPLE)}>
                  ↓ 下載範本
                </button>
                <input type="file" accept=".csv" ref={fileRefContracts}
                  onChange={importContractsCSV} className="hidden" />
                <button className="btn-primary text-xs"
                  onClick={() => fileRefContracts.current?.click()}
                  disabled={data.members.length === 0}>
                  ↑ 上傳 CSV
                </button>
              </div>
              <div className="text-[10px] mt-2" style={{ color: "var(--ink-mute)" }}>
                ⓘ 公益出租欄填 <b>是 / Y / 1 / 公益</b> 都算是;空白為一般合約
              </div>
            </div>
          </div>

          <div className="mt-4 p-3 rounded text-xs" style={{ background: "white", border: "1px solid var(--line)", color: "var(--ink-soft)" }}>
            <div className="font-medium mb-1">📋 從 Excel 製作 CSV 的方法</div>
            <div className="space-y-1">
              <div>1. 在 Excel 開新檔,把資料貼進去,標題列照範本順序排好</div>
              <div>2. 檔案 → 另存新檔 → 選 <b>「CSV UTF-8 (逗號分隔)」</b>格式</div>
              <div>3. 回到本系統點「↑ 上傳 CSV」</div>
              <div className="mt-2" style={{ color: "var(--accent-deep)" }}>
                💡 <b>地址匹配規則</b>:CSV 裡「物件地址」會自動找已存在的物件;若沒找到,系統會自動建立新物件 (以該地址當名稱)。
              </div>
              <div style={{ color: "var(--accent-deep)" }}>
                💡 <b>日期格式</b>:支援 <code className="num">1140810</code> / <code className="num">114/8/10</code> / <code className="num">2025/8/10</code> 三種寫法。
              </div>
            </div>
          </div>

          {/* 匯出按鈕 */}
          <div className="mt-4 pt-3 flex gap-2" style={{ borderTop: "1px solid var(--line)" }}>
            <div className="text-xs flex-1" style={{ color: "var(--ink-soft)" }}>
              將現有資料匯出為 CSV,方便在 Excel 中編輯後再匯入:
            </div>
            <button className="btn-secondary text-xs"
              onClick={() => {
                if ((data.properties || []).length === 0) return alert("沒有物件可匯出");
                const rows = [PROPERTIES_CSV_HEADERS.join(",")];
                // 依序號排序匯出
                const sorted = [...data.properties].sort((a, b) =>
                  String(a.serial || "").localeCompare(String(b.serial || "")));
                sorted.forEach(p => {
                  const owner = data.members.find(m => m.id === p.ownerId);
                  rows.push([
                    JSON.stringify(p.serial || ""),
                    JSON.stringify(owner?.name || ""),
                    JSON.stringify(p.address || ""),
                    JSON.stringify(p.note || "")
                  ].join(","));
                });
                downloadCSV(`物件_${new Date().toISOString().slice(0,10)}.csv`, rows.join("\n"));
              }}>
              ↓ 匯出物件 CSV
            </button>
            <button className="btn-secondary text-xs"
              onClick={() => {
                if ((data.contracts || []).length === 0) return alert("沒有合約可匯出");
                const rows = [CONTRACTS_CSV_HEADERS.join(",")];
                // 依物件序號 → 類型 → 起日排序
                const sorted = [...data.contracts].sort((a, b) => {
                  const pa = data.properties.find(x => x.id === a.propertyId);
                  const pb = data.properties.find(x => x.id === b.propertyId);
                  const sa = String(pa?.serial || ""), sb = String(pb?.serial || "");
                  if (sa !== sb) return sa.localeCompare(sb);
                  return String(a.startDate || "").localeCompare(String(b.startDate || ""));
                });
                sorted.forEach(c => {
                  const p = data.properties.find(x => x.id === c.propertyId);
                  const typeLabel = (c.contractType === "public" || c.isPublicLandlord) ? "公益" : "一般";
                  rows.push([
                    JSON.stringify(p?.serial || ""),
                    JSON.stringify(typeLabel),
                    JSON.stringify(c.tenantName || ""),
                    JSON.stringify(c.tenantPhone || ""),
                    JSON.stringify(c.startDate || ""),
                    JSON.stringify(c.endDate || ""),
                    JSON.stringify(c.monthlyRent || 0),
                    JSON.stringify(c.managementFee || 0),
                    JSON.stringify(c.deposit || 0),
                    JSON.stringify(c.landlordOwner || ""),
                    JSON.stringify(c.note || "")
                  ].join(","));
                });
                downloadCSV(`合約_${new Date().toISOString().slice(0,10)}.csv`, rows.join("\n"));
              }}>
              ↓ 匯出合約 CSV
            </button>
          </div>
        </div>
      )}

      {(data.contracts || []).length === 0 ? (
        <div className="card p-12 text-center" style={{ color: "var(--ink-mute)" }}>
          <div className="text-4xl mb-3">▦</div>
          <div className="font-serif text-lg mb-1">尚無合約資料</div>
          <div className="text-sm">
            {data.members.length === 0 ? "請先建立家庭成員" : "點右上角「新增合約」或「匯入 / 匯出」批次上傳"}
          </div>
        </div>
      ) : (
        <div className="card overflow-hidden">
          <table className="w-full text-sm">
            <thead>
              <tr style={{ background: "#fafaf6", borderBottom: "1px solid var(--line)" }}>
                {colTh("propertySerial", "物件", "text-left px-3 py-2")}
                {colTh("tenant", "租客", "text-left px-3 py-2")}
                {colTh("startDate", "租期起", "text-left px-3 py-2")}
                {colTh("endDate", "租期迄", "text-left px-3 py-2")}
                {colTh("monthlyRent", "月租", "text-right px-3 py-2")}
                <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>管理費</th>
                <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>押金</th>
                <th className="text-center px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>類型</th>
                {colTh("thisYearRent", `${year}年度租金`, "text-right px-3 py-2")}
                <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>操作</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(c => {
                const prop = data.properties.find(p => p.id === c.propertyId);
                const calc = computeForContract(c);
                return (
                  <tr key={c.id} className="table-row">
                    <td className="px-3 py-2">
                      <div className="text-xs">
                        {prop?.serial && <span className="num font-medium mr-1">{prop.serial}</span>}
                        {prop?.name || "—"}
                      </div>
                    </td>
                    <td className="px-3 py-2">
                      <div className="text-xs font-medium">{c.tenantName || "—"}</div>
                      {c.tenantPhone && <div className="text-[10px]" style={{ color: "var(--ink-mute)" }}>{c.tenantPhone}</div>}
                    </td>
                    <td className="px-3 py-2 text-xs num">{c.startDate || "—"}</td>
                    <td className="px-3 py-2 text-xs num">
                      {c.endDate || "—"}
                      {calc.totalMonths > 0 && <div className="text-[10px]" style={{ color: "var(--ink-mute)" }}>共 {calc.totalMonths} 個月</div>}
                    </td>
                    <td className="px-3 py-2 text-right num">{fmt(c.monthlyRent)}</td>
                    <td className="px-3 py-2 text-right num text-xs" style={{ color: "var(--ink-mute)" }}>{fmt(c.managementFee)}</td>
                    <td className="px-3 py-2 text-right num text-xs" style={{ color: "var(--ink-mute)" }}>{fmt(c.deposit)}</td>
                    <td className="px-3 py-2 text-center">
                      {(c.contractType === "public" || c.isPublicLandlord) ?
                        <span className="chip chip-green text-[10px]">公益</span> :
                        <span className="chip chip-amber text-[10px]">一般</span>}
                    </td>
                    <td className="px-3 py-2 text-right num text-xs font-medium" style={{ color: calc.thisYear > 0 ? "var(--accent-deep)" : "var(--ink-mute)" }}>
                      {calc.thisYear > 0 ? (
                        <>
                          {fmt(calc.thisYear)}
                          <div className="text-[10px]" style={{ color: "var(--ink-mute)" }}>{calc.thisYearMonths} 個月</div>
                        </>
                      ) : "—"}
                    </td>
                    <td className="px-3 py-2 text-right space-x-1">
                      <button className="btn-secondary text-xs" onClick={() => setEditing(c)}>編輯</button>
                      <button className="btn-danger text-xs" onClick={() => remove(c.id)}>刪除</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      <div className="mt-5 p-4 rounded text-xs" style={{ background: "#fafaf6", color: "var(--ink-soft)", border: "1px solid var(--line)" }}>
        ⓘ <b>跨年合約如何攤分</b>:系統用「合約期間在該年度內的月數 × 月租金」自動計算。例:114/8/10~115/8/10 月租 5,500
        → 114 年計入 5 個月 (8-12月) = 27,500;115 年計入 8 個月 (1-8月) = 44,000。<br/>
        ⓘ <b>手動覆寫</b>:在「本年度試算 → ⑥ 租賃紀錄」可以手動覆寫某物件某年度的應稅金額。<br/>
        ⓘ <b>公益出租人</b>:勾選「公益出租」後,該合約適用「每月免稅 15,000,超出部分必要費用 60%」的優惠。
      </div>

      {editing && (
        <ContractModal
          contract={editing}
          properties={data.properties}
          members={data.members}
          onSave={save}
          onClose={() => setEditing(null)}
        />
      )}
    </div>
  );
}

function ContractModal({ contract, properties, members, onSave, onClose }) {
  // 初始化 contractType (向後相容: 舊資料的 isPublicLandlord=true → 設為 public)
  const initial = { ...contract };
  if (!initial.contractType) {
    initial.contractType = initial.isPublicLandlord ? "public" : "general";
  }
  const [c, setC] = useState(initial);

  // 預覽: 全合約總額 / 各年度攤分
  const preview = (() => {
    const s = parseRocDate(c.startDate);
    const e = parseRocDate(c.endDate);
    if (!s || !e) return null;
    const sJs = rocToDate(s), eJs = rocToDate(e);
    const totalMonths = (eJs.getFullYear() - sJs.getFullYear()) * 12 + (eJs.getMonth() - sJs.getMonth()) + 1;
    if (totalMonths <= 0) return null;
    const monthly = toNum(c.monthlyRent);
    const total = monthly * totalMonths;
    const years = [];
    for (let y = s.y; y <= e.y; y++) {
      const m = monthsInYear(s, e, y);
      if (m > 0) years.push({ year: y, months: m, rent: m * monthly });
    }
    return { totalMonths, total, years };
  })();

  const isPublic = c.contractType === "public";

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center" style={{ background: "rgba(26,29,35,0.4)" }} onClick={onClose}>
      <div className="card w-[680px] max-h-[90vh] overflow-y-auto p-6" onClick={e => e.stopPropagation()}>
        <div className="ornament mb-2">{c.id ? "EDIT CONTRACT" : "NEW CONTRACT"}</div>
        <h2 className="font-serif text-xl mb-4">{c.id ? "編輯合約" : "新增租賃合約"}</h2>

        <div className="space-y-3">
          {/* 合約類型: 一般 vs 公益 */}
          <Field label="合約類型" hint="同一物件可同時有「一般合約」+「公益出租」兩份合約獨立存在">
            <div className="grid grid-cols-2 gap-2">
              <label className={`p-3 rounded cursor-pointer border ${!isPublic ? "border-2" : ""}`}
                style={{ borderColor: !isPublic ? "var(--accent)" : "var(--line)", background: !isPublic ? "var(--accent-soft)" : "white" }}>
                <input type="radio" name="contractType" value="general"
                  checked={!isPublic} onChange={() => setC({ ...c, contractType: "general", isPublicLandlord: false })}
                  className="mr-2" />
                <span className="text-sm font-medium">一般出租合約</span>
                <div className="text-xs mt-1 ml-5" style={{ color: "var(--ink-mute)" }}>
                  43% 必要費用,計入應稅租金所得
                </div>
              </label>
              <label className={`p-3 rounded cursor-pointer border ${isPublic ? "border-2" : ""}`}
                style={{ borderColor: isPublic ? "var(--green)" : "var(--line)", background: isPublic ? "var(--green-soft)" : "white" }}>
                <input type="radio" name="contractType" value="public"
                  checked={isPublic} onChange={() => setC({ ...c, contractType: "public", isPublicLandlord: true })}
                  className="mr-2" />
                <span className="text-sm font-medium">公益出租合約</span>
                <div className="text-xs mt-1 ml-5" style={{ color: "var(--ink-mute)" }}>
                  每月免稅 15,000,超出部分費用率 60%
                </div>
              </label>
            </div>
          </Field>

          <div className="grid grid-cols-2 gap-3">
            <Field label="物件">
              <select className="input-text-plain w-full" value={c.propertyId} onChange={e => setC({...c, propertyId: e.target.value})}>
                {properties.map(p => <option key={p.id} value={p.id}>
                  {p.serial && `${p.serial} · `}{p.name} {p.address && `(${p.address})`}
                </option>)}
              </select>
            </Field>
            <Field label="負責出租人 (誰簽的)">
              <input className="input-text-plain w-full" value={c.landlordOwner} onChange={e => setC({...c, landlordOwner: e.target.value})} placeholder="如:湯三姐 / 公司" />
            </Field>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <Field label="租客姓名">
              <input className="input-text-plain w-full" value={c.tenantName} onChange={e => setC({...c, tenantName: e.target.value})} />
            </Field>
            <Field label="租客電話">
              <input className="input-text-plain w-full" value={c.tenantPhone} onChange={e => setC({...c, tenantPhone: e.target.value})} placeholder="0912-345678" />
            </Field>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <Field label={isPublic ? "公益期間起" : "租期起 (民國日期)"} hint="格式:1140810 或 114/08/10">
              <input className="input-text w-full" value={c.startDate} onChange={e => setC({...c, startDate: e.target.value})} placeholder="1140810" />
            </Field>
            <Field label={isPublic ? "公益期間迄" : "租期迄"} hint="同上格式">

              (每月免稅 {fmt(15000)},超出部分必要費用 60%)。如果你跟同一租客同期間另有「一般合約」金額,
              請另建一筆「一般合約」記錄實際收的金額(僅作為內部紀錄,稅務不重複計算)。

            if (!parseRocDate(c.startDate)) return alert("租期起日期格式不正確");
            if (!parseRocDate(c.endDate)) return alert("租期迄日期格式不正確");
            onSave(c);

    </div>
  );
}

// ============================================================
// 申報戶試算 (核心頁)
// ============================================================
function FilingPage({ data, setData, year, setPage }) {
  const yearFilings = data.filings.filter(f => f.year === year);
  const [selectedId, setSelectedId] = useState(yearFilings[0]?.id || null);
  const selected = yearFilings.find(f => f.id === selectedId);

  useEffect(() => {
    if (yearFilings.length > 0 && !yearFilings.find(f => f.id === selectedId)) {
      setSelectedId(yearFilings[0].id);
    }
  }, [year, data.filings]);

  const addFiling = () => {
    // 用第一位成員當預設主納稅人
    const taxpayer = data.members[0];
    const taxpayerName = taxpayer?.name || "";
    const newFiling = {
      id: uid(),
      year,
      name: taxpayerName ? `${year}年-${taxpayerName}` : `${year}年-新申報戶`,
      taxpayerId: taxpayer?.id || "",
      spouseId: "",
      dependentIds: [],
      memberIncome: {},
      itemizedDeductions: {
        donationGeneral: 0, donationUnlimited: 0,
        insurancePersonal: 0, insuranceHealth: 0,
        medical: 0, disaster: 0, mortgageInterest: 0,
      },
      rentSupportPaid: 0,
      deductionChoice: "auto", // auto / standard / itemized
      savingsOverride: false,
      savingsOverrideAmount: 0,
      dividendChoice: "combine", // combine (8.5%抵減) / separate (28%分開)
      taxMethod: "auto", // auto / combined / salarySepTaxpayer / salarySepSpouse / allSepTaxpayer / allSepSpouse
      taxCredits: {
        prepaidTax: 0,
        repurchaseCredit: 0,
        otherCredit: 0,
      },
      // 實際結算: 申報後實際繳/退稅金額 (跟系統試算可能差幾元)
      actualSettlement: {
        actualAmount: "",       // 實際繳/退金額 (正數 = 補繳, 負數 = 退稅, 空白 = 用系統試算值)
        actualDate: "",         // 實際繳費或收到退稅日期
        note: "",
      },
      // 事後調整 (補繳、罰金、利息、複查通知書等)
      adjustments: [],
      // 申報書筆數核對 (從申報書 PDF 抄入,系統自動跟逐筆明細比對)
      officialAudit: [],   // [{id, code, count, amount}]
    };
    setData({ ...data, filings: [...data.filings, newFiling] });
    setSelectedId(newFiling.id);
  };

  const updateFiling = (next) => {
    setData({ ...data, filings: data.filings.map(f => f.id === next.id ? next : f) });
  };

  const deleteFiling = (id) => {
    if (!confirm("確定刪除此申報戶?")) return;
    setData({ ...data, filings: data.filings.filter(f => f.id !== id) });
    if (selectedId === id) setSelectedId(null);
  };

  const cloneFromLastYear = () => {
    // 找上一年度同名申報戶
    const prevYear = year - 1;
    const candidates = data.filings.filter(f => f.year === prevYear);
    if (candidates.length === 0) return alert(`找不到 ${prevYear} 年度的申報戶可複製`);
    const src = candidates[0];
    const newFiling = { ...src, id: uid(), year, name: src.name.replace(`${prevYear}年`, `${year}年`) || `${year}年度` };
    setData({ ...data, filings: [...data.filings, newFiling] });
    setSelectedId(newFiling.id);
  };

  return (
    <div className="fade-in">
      <PageHeader
        ornament={`§ TAX FILING · ${year} 年度試算`}
        title="申報戶與稅額試算"
        subtitle="每個申報戶獨立試算 · 系統自動比較標準/列舉扣除額,選擇較划算者"
        right={
          <div className="space-x-2">
            <button className="btn-secondary text-sm" onClick={() => setPage("sources")}>? 不知道數字從哪來?</button>
            <button className="btn-secondary text-sm" onClick={cloneFromLastYear}>↻ 複製上年度</button>
            <button className="btn-primary text-sm" onClick={addFiling}
              disabled={data.members.length === 0}>+ 新增申報戶</button>
          </div>
        }
      />

      {yearFilings.length === 0 ? (
        <div className="card p-12 text-center" style={{ color: "var(--ink-mute)" }}>
          <div className="text-4xl mb-3">✎</div>
          <div className="font-serif text-lg mb-1">{year} 年度尚無申報戶</div>
          <div className="text-sm">
            {data.members.length === 0 ? "請先到「家庭成員」頁面建立成員" : "點右上角「新增申報戶」開始試算"}
          </div>
        </div>
      ) : (
        <div className="grid grid-cols-[260px_1fr] gap-5">
          {/* 申報戶清單 */}
          <div className="card overflow-hidden" style={{ alignSelf: "flex-start" }}>
            <div className="px-3 py-2 ornament" style={{ borderBottom: "1px solid var(--line)" }}>HOUSEHOLDS</div>
            {yearFilings.map(f => {
              const r = computeFilingWithData(f, data, year);
              return (
                <button key={f.id} onClick={() => setSelectedId(f.id)}
                  className={`w-full text-left px-3 py-3 border-b ${selectedId === f.id ? "" : "hover:bg-gray-50"}`}
                  style={{ borderColor: "var(--line-soft)", background: selectedId === f.id ? "#fafaf6" : "white",
                    borderLeft: selectedId === f.id ? "3px solid var(--accent)" : "3px solid transparent" }}>
                  {(() => {
                    const taxpayer = data.members.find(m => m.id === f.taxpayerId);
                    const spouse = data.members.find(m => m.id === f.spouseId);
                    const displayName = taxpayer
                      ? (spouse ? `${taxpayer.name} & ${spouse.name}` : taxpayer.name)
                      : (f.name || "(未指定納稅人)");
                    return (
                      <>
                        <div className="text-sm font-medium truncate flex items-center gap-1">
                          {f.locked && <span style={{ color: "var(--gold)" }}>🔒</span>}
                          {displayName}
                        </div>
                        {f.name && f.name !== displayName && (
                          <div className="text-[10px] truncate" style={{ color: "var(--ink-mute)" }}>{f.name}</div>
                        )}
                      </>
                    );
                  })()}
                  {r && (() => {
                    const sysFinalDue = r.finalDue || 0;
                    const actualAmt = f.actualSettlement?.actualAmount;
                    const hasActual = actualAmt !== undefined && actualAmt !== "" && actualAmt !== null;
                    const displayAmount = hasActual ? toNum(actualAmt) : sysFinalDue;
                    const label = displayAmount > 0 ? "應補繳" : displayAmount < 0 ? "可退稅" : "平衡";
                    const color = displayAmount > 0 ? "var(--ink)" : displayAmount < 0 ? "var(--green)" : "var(--ink-mute)";
                    return (
                      <div className="mt-1">
                        <div className="text-xs num flex items-center gap-1" style={{ color }}>
                          <span>{label}</span>
                          <span className="font-medium">{fmt(Math.abs(displayAmount))}</span>
                          {hasActual && <span className="chip chip-green text-[9px] ml-1">實際</span>}
                        </div>
                        {hasActual && (
                          <div className="text-[9px] num" style={{ color: "var(--ink-mute)" }}>
                            {Math.abs(toNum(actualAmt) - sysFinalDue) === 0
                              ? `✓ 系統算 ${sysFinalDue >= 0 ? fmt(sysFinalDue) : `-${fmt(-sysFinalDue)}`} (一致)`
                              : `(系統算 ${sysFinalDue >= 0 ? fmt(sysFinalDue) : `-${fmt(-sysFinalDue)}`})`}
                          </div>
                        )}
                        {/* 點擊編輯實際金額 */}
                        <button
                          className="text-[9px] mt-0.5 hover:underline"
                          style={{ color: "var(--ink-mute)" }}
                          onClick={(ev) => {
                            ev.stopPropagation();
                            const cur = hasActual ? actualAmt : sysFinalDue;
                            const input = prompt(
                              `輸入實際繳/退稅金額\n` +
                              `(正數=補繳,負數=退稅;留空=用系統試算 ${sysFinalDue >= 0 ? fmt(sysFinalDue) : `-${fmt(-sysFinalDue)}`})\n` +
                              `系統試算: ${sysFinalDue >= 0 ? `補繳 ${fmt(sysFinalDue)}` : `退稅 ${fmt(-sysFinalDue)}`}`,
                              hasActual ? String(cur) : ""
                            );
                            if (input === null) return;
                            const newFiling = { ...f };
                            if (!newFiling.actualSettlement) newFiling.actualSettlement = {};
                            newFiling.actualSettlement.actualAmount = input.trim();
                            updateFiling(newFiling);
                          }}
                        >
                          ✎ {hasActual ? "修改實際金額" : "輸入實際金額"}
                        </button>
                      </div>
                    );
                  })()}
                  <div className="flex gap-1 mt-1">
                    {r?.hasSpouse && <span className="chip text-[10px]">夫妻</span>}
                    {r?.useItemized && <span className="chip chip-green text-[10px]">列舉</span>}
                    {!r?.useItemized && <span className="chip chip-amber text-[10px]">標準</span>}
                  </div>
                </button>
              );
            })}
          </div>

          {/* 申報戶詳細 */}
          {selected && (
            <FilingDetail
              filing={selected}
              members={data.members}
              properties={data.properties}
              setProperties={(next) => setData({ ...data, properties: next })}
              rentalRecords={data.rentalRecords || []}
              setRentalRecords={(next) => setData({ ...data, rentalRecords: next })}
              contracts={data.contracts || []}
              setContracts={(next) => setData({ ...data, contracts: next })}
              payerDirectory={data.payerDirectory || {}}
              savePayer={(taxId, name) => {
                if (!taxId || !name) return;
                const dir = data.payerDirectory || {};
                if (dir[taxId] === name) return;  // 沒變化
                setData({ ...data, payerDirectory: { ...dir, [taxId]: name } });
              }}
              year={year}
              onChange={updateFiling}
              onDelete={() => deleteFiling(selected.id)}
            />
          )}
        </div>
      )}
    </div>
  );
}

function FilingDetail({ filing, members, properties, setProperties, rentalRecords, setRentalRecords, contracts, setContracts, payerDirectory, savePayer, year, onChange: rawOnChange, onDelete }) {
  // 鎖定時攔截所有 onChange,只允許「解鎖」操作通過 (locked: false)
  const onChange = (next) => {
    if (filing.locked && next.locked !== false) {
      // 鎖定中且不是解鎖動作 → 忽略
      return;
    }
    rawOnChange(next);
  };

  // 自動同步名字:依目前主納稅人 + 配偶生成「{year}年-{主納稅人}&{配偶}」格式
  // 規則:舊格式(N年度·XXX、N年度·新申報戶) → 自動覆蓋
  //       但如果使用者自己手動改了非標準名字,不動
  const taxpayerObj = members.find(m => m.id === filing.taxpayerId);
  const spouseObj = members.find(m => m.id === filing.spouseId);
  const expectedName = taxpayerObj
    ? (spouseObj ? `${filing.year}年-${taxpayerObj.name}&${spouseObj.name}` : `${filing.year}年-${taxpayerObj.name}`)
    : `${filing.year}年-新申報戶`;
  // 判斷是否「舊自動格式」(可被自動覆蓋)
  const isOldAutoName = filing.name && (
    /^\d+年度·新申報戶$/.test(filing.name) ||
    /^\d+年度·[^·]+$/.test(filing.name) ||
    /^\d+年-新申報戶$/.test(filing.name) ||
    // 新格式但 taxpayer/spouse 改了 → 也要同步
    (taxpayerObj && /^\d+年-/.test(filing.name) && filing.name !== expectedName)
  );
  React.useEffect(() => {
    if (filing.locked) return;
    if (isOldAutoName && filing.name !== expectedName) {
      rawOnChange({ ...filing, name: expectedName });
    }
  }, [filing.id, filing.name, expectedName]);

  const [newPropertyModal, setNewPropertyModal] = React.useState(null); // 新增物件 modal
  const [rentalExpandKey, setRentalExpandKey] = React.useState(0); // 強制 re-render 用
  const [rentalForceState, setRentalForceState] = React.useState(null); // null=用預設 / true=全展開 / false=全收合
  const [rentalSectionCollapsed, setRentalSectionCollapsed] = React.useState(true);
  // 把 properties 過濾出屬於這申報戶的人持有的
  const filerIds = [filing.taxpayerId, filing.spouseId, ...(filing.dependentIds || [])].filter(Boolean);
  const householdProperties = properties.filter(p => filerIds.includes(p.ownerId));
  // 把該年度的 rentalRecords/合約 帶入 filing 給計算用
  const filingForCompute = { ...filing, properties: householdProperties, rentalRecords, contracts, manualRentOverrides: filing.manualRentOverrides || {} };
  const result = computeTaxForFiling(filingForCompute, members, year);
  const params = TAX_PARAMS[year];

  // 物件 + 該年度紀錄 (含虛擬)
  const yearRecords = householdProperties.map(p => ({
    property: p,
    record: getRentalRecord(rentalRecords, p, year, contracts, filing.manualRentOverrides),
  }));

  // 更新某物件的該年度紀錄
  const upsertRecord = (propertyId, patch) => {
    const idx = rentalRecords.findIndex(r => r.propertyId === propertyId && r.year === year);
    if (idx >= 0) {
      // 既有紀錄
      const next = [...rentalRecords];
      next[idx] = { ...next[idx], ...patch };
      setRentalRecords(next);
    } else {
      // 新建紀錄
      const property = householdProperties.find(p => p.id === propertyId);
      const base = {
        id: uid(),
        propertyId,
        year,
        monthlyRent: property?.monthlyRent || 0,
        months: property?.months || 12,
        type: property?.type || "general",
        expenseRatio: property?.expenseRatio || 0.43,
        taxFreeReason: property?.taxFreeReason || "",
        note: "",
        includeInFiling: true,
        ...patch,
      };
      setRentalRecords([...rentalRecords, base]);
    }
  };

  // 從上一年複製到當前年
  const copyFromPrevYear = (propertyId) => {
    const prev = rentalRecords.find(r => r.propertyId === propertyId && r.year === year - 1);
    if (!prev) return alert(`找不到 ${year - 1} 年度的紀錄`);
    const { id, year: _y, ...rest } = prev;
    upsertRecord(propertyId, { ...rest });
  };

  // 從物件預設值建立
  const initFromProperty = (propertyId) => {
    upsertRecord(propertyId, {});
  };

  // 刪除當前年的紀錄
  const removeRecord = (propertyId) => {
    if (!confirm(`確定刪除此物件 ${year} 年度的紀錄?`)) return;
    setRentalRecords(rentalRecords.filter(r => !(r.propertyId === propertyId && r.year === year)));
  };

  // 手動覆寫合約攤分結果
  const updateRentOverride = (propertyId, patch) => {
    const key = `${propertyId}_${year}`;
    const current = (filing.manualRentOverrides || {})[key] || {};
    onChange({
      ...filing,
      manualRentOverrides: {
        ...(filing.manualRentOverrides || {}),
        [key]: { ...current, ...patch }
      }
    });
  };
  const clearRentOverride = (propertyId) => {
    const key = `${propertyId}_${year}`;
    const overrides = { ...(filing.manualRentOverrides || {}) };
    const current = overrides[key] || {};
    // 只清掉金額,保留 includeInFiling 等其他設定
    const cleaned = { ...current };
    delete cleaned.totalAnnualRent;
    delete cleaned.generalAnnualRent;
    delete cleaned.publicAnnualRent;
    delete cleaned.annualRent; // 舊版相容
    // 如果清完只剩預設值 (includeInFiling 不是 true),整個刪掉
    if (Object.keys(cleaned).length === 0 || (Object.keys(cleaned).length === 1 && cleaned.includeInFiling !== true)) {
      delete overrides[key];
    } else {
      overrides[key] = cleaned;
    }
    onChange({ ...filing, manualRentOverrides: overrides });
  };

  const taxpayer = members.find(m => m.id === filing.taxpayerId);
  const spouse = members.find(m => m.id === filing.spouseId);

  const updateField = (path, value) => {
    const next = { ...filing };
    const parts = path.split(".");
    let obj = next;
    for (let i = 0; i < parts.length - 1; i++) {
      obj[parts[i]] = { ...obj[parts[i]] };
      obj = obj[parts[i]];
    }
    obj[parts[parts.length - 1]] = value;
    onChange(next);
  };

  const updateIncome = (memberId, key, value) => {
    const next = {
      ...filing,
      memberIncome: {
        ...filing.memberIncome,
        [memberId]: { ...(filing.memberIncome?.[memberId] || {}), [key]: value }
      }
    };
    onChange(next);
  };

  // === 逐筆所得明細 (依官方申報書格式) ===
  const incomeEntries = filing.incomeEntries || [];
  const addEntry = (preset = {}) => {
    // 預設歸戶: 用最後一筆的 ownerId (使用者通常連續輸入同一人的所得);
    // 若還沒有任何 entry → 用納稅義務人
    const lastEntry = incomeEntries[incomeEntries.length - 1];
    const defaultOwnerId = lastEntry?.ownerId || filing.taxpayerId || "";
    const entry = {
      id: uid(),
      ownerId: defaultOwnerId,
      category: "salary",
      code: "50",
      source: "",
      taxId: "",
      gross: 0,
      expense: 0,
      withholding: 0,
      note: "",
      ...preset,
    };
    onChange({ ...filing, incomeEntries: [...incomeEntries, entry] });
  };
  const updateEntry = (id, patch) => {
    onChange({ ...filing, incomeEntries: incomeEntries.map(e => e.id === id ? { ...e, ...patch } : e) });
  };
  const removeEntry = (id) => {
    onChange({ ...filing, incomeEntries: incomeEntries.filter(e => e.id !== id) });
  };

  const toggleDependent = (id) => {
    const list = filing.dependentIds || [];
    const next = list.includes(id) ? list.filter(x => x !== id) : [...list, id];
    onChange({ ...filing, dependentIds: next });
  };

  if (!result) return null;

  return (
    <div className="space-y-5">
      {/* 標題列 */}
      <div className="card p-5" style={{
        background: filing.locked ? "#f5f3ec" : "white",
        borderColor: filing.locked ? "var(--gold)" : "var(--line)",
        borderWidth: filing.locked ? "2px" : "1px",
      }}>
        <div className="flex items-center gap-3 mb-3">
          {filing.locked && (
            <span className="chip text-xs" style={{ background: "var(--gold)", color: "white", padding: "4px 10px" }}>
              🔒 已鎖定
            </span>
          )}
          <input
            className="font-serif text-2xl flex-1 px-2 py-1 border-b-2"
            style={{
              borderColor: "var(--line)",
              background: "transparent",
              color: filing.locked ? "var(--ink-mute)" : "var(--ink)",
            }}
            value={filing.name}
            readOnly={filing.locked}
            onChange={e => filing.locked ? null : onChange({ ...filing, name: e.target.value })}
          />
          <button
            className="text-sm px-3 py-2 rounded"
            style={{
              background: filing.locked ? "white" : "var(--gold)",
              color: filing.locked ? "var(--gold)" : "white",
              border: `1px solid var(--gold)`,
              fontWeight: 600,
            }}
            onClick={() => {
              if (filing.locked) {
                if (window.confirm("⚠ 解鎖後可繼續編輯此申報戶資料。確定要解鎖嗎?")) {
                  onChange({ ...filing, locked: false });
                }
              } else {
                if (window.confirm("🔒 鎖定後此申報戶資料將無法編輯 (避免誤改)。確定要鎖定嗎?")) {
                  onChange({ ...filing, locked: true });
                }
              }
            }}
          >
            {filing.locked ? "🔓 解鎖" : "🔒 完成 · 鎖定"}
          </button>
          {!filing.locked && (
            <button className="btn-danger text-sm" onClick={onDelete}>刪除此申報戶</button>
          )}
        </div>

        {/* 申報戶成員選擇 */}
        <div className="grid grid-cols-3 gap-3">
          <Field label="主納稅義務人">
            <select className="input-text-plain w-full" value={filing.taxpayerId}
              onChange={e => {
                const newTaxpayerId = e.target.value;
                const taxpayer = members.find(m => m.id === newTaxpayerId);
                const spouse = members.find(m => m.id === filing.spouseId);
                const newName = taxpayer
                  ? (spouse ? `${filing.year}年-${taxpayer.name}&${spouse.name}` : `${filing.year}年-${taxpayer.name}`)
                  : filing.name;
                onChange({ ...filing, taxpayerId: newTaxpayerId, name: newName });
              }}>
              <option value="">— 請選擇 —</option>
              {members.map(m => {
                const r = RELATIONS[m.relation];
                return <option key={m.id} value={m.id}>{m.name} ({r?.label || m.relation})</option>;
              })}
            </select>
          </Field>
          <Field label="配偶 (合併申報)">
            <select className="input-text-plain w-full" value={filing.spouseId || ""}
              onChange={e => {
                const newSpouseId = e.target.value;
                const taxpayer = members.find(m => m.id === filing.taxpayerId);
                const spouse = members.find(m => m.id === newSpouseId);
                const newName = taxpayer
                  ? (spouse ? `${filing.year}年-${taxpayer.name}&${spouse.name}` : `${filing.year}年-${taxpayer.name}`)
                  : filing.name;
                onChange({ ...filing, spouseId: newSpouseId, name: newName });
              }}>
              <option value="">無 (單身申報)</option>
              {members.filter(m => m.id !== filing.taxpayerId).map(m => {
                const r = RELATIONS[m.relation];
                const isCandidate = r && r.canBeSpouse;
                return <option key={m.id} value={m.id}>
                  {isCandidate ? "★ " : ""}{m.name} ({r?.label || m.relation})
                </option>;
              })}
            </select>
          </Field>
          <Field label="扶養親屬數">
            <div className="input-text-plain w-full bg-gray-50">{(filing.dependentIds || []).length} 人</div>
          </Field>
        </div>

        {/* 扶養親屬勾選 */}
        <div className="mt-3">
          <div className="text-xs mb-2" style={{ color: "var(--ink-soft)" }}>勾選扶養親屬 (圓點顯示稅法限制):</div>
          <div className="flex flex-wrap gap-2">
            {members.filter(m => m.id !== filing.taxpayerId && m.id !== filing.spouseId).map(m => {
              const checked = (filing.dependentIds || []).includes(m.id);
              const r = RELATIONS[m.relation];
              const age = Number(m.age);
              // 判斷此人能否合法扶養
              let okHint = "✓";
              let okColor = "var(--green)";
              if (!r || !r.canBeDependent) { okHint = "✗"; okColor = "var(--red)"; }
              else if ((r.isChild || m.relation === "sibling") && age >= 20 && !m.isStudent && !m.isDisabled && !m.cannotSupportSelf) {
                okHint = "△"; okColor = "var(--gold)";
              } else if (r.isLinealAscendant && age < 60 && !m.cannotSupportSelf && !m.isDisabled) {
                okHint = "△"; okColor = "var(--gold)";
              } else if (m.relation === "other" && !m.coResident) {
                okHint = "△"; okColor = "var(--gold)";
              }
              return (
                <label key={m.id} className={`px-3 py-1.5 rounded cursor-pointer text-sm flex items-center gap-2 border`}
                  style={{ borderColor: checked ? "var(--accent)" : "var(--line)", background: checked ? "var(--accent-soft)" : "white" }}>
                  <input type="checkbox" checked={checked} onChange={() => toggleDependent(m.id)} />
                  <span style={{ color: okColor, fontWeight: 700 }}>{okHint}</span>
                  {m.name} <span className="text-xs" style={{ color: "var(--ink-mute)" }}>({r?.label})</span>
                </label>
              );
            })}
          </div>
        </div>
      </div>

      {/* 警告 / 提示面板 */}
      {result.warnings && result.warnings.length > 0 && (
        <div className="card p-4" style={{ background: "#fdfaf3", borderColor: "var(--gold)" }}>
          <div className="ornament mb-2" style={{ color: "#6b5418" }}>⚠ VALIDATION · 申報戶檢查</div>
          <div className="space-y-1.5 text-sm">
            {result.warnings.map((w, i) => (
              <div key={i} className="flex items-start gap-2">
                <span style={{
                  color: w.level === "error" ? "var(--red)" : (w.level === "warn" ? "var(--gold)" : "var(--ink-mute)"),
                  fontWeight: 700, minWidth: "1.5em"
                }}>
                  {w.level === "error" ? "✗" : (w.level === "warn" ? "⚠" : "ⓘ")}
                </span>
                <span style={{ color: "var(--ink-soft)" }}>{w.msg}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* 逐筆所得明細 (依官方申報書格式) */}
      <IncomeEntriesTable
        entries={incomeEntries}
        members={result.filers}
        onAdd={addEntry}
        onUpdate={updateEntry}
        onRemove={removeEntry}
        payerDirectory={payerDirectory}
        savePayer={savePayer}
      />

      {/* 本戶租賃 — 合約自動攤分,每物件可展開查看與手動覆寫 */}
      {householdProperties.length > 0 && (
        <div className="card">
          <div
            className="px-5 py-3 flex items-center justify-between cursor-pointer hover:bg-gray-50"
            style={{ borderBottom: rentalSectionCollapsed ? "none" : "1px solid var(--line)" }}
            onClick={() => setRentalSectionCollapsed(!rentalSectionCollapsed)}
          >
            <div className="flex items-center gap-2 flex-1">
              <span className="text-xs" style={{ color: "var(--ink-mute)", minWidth: "12px" }}>
                {rentalSectionCollapsed ? "▶" : "▼"}
              </span>
              <div>
                <div className="ornament" style={{ color: "var(--accent-deep)" }}>RENTAL RECORDS</div>
                <div className="font-serif text-base">🏠 {year} 年租賃紀錄輸入</div>
              </div>
            </div>
            <div className="text-right" onClick={e => e.stopPropagation()}>
              {(() => {
                // 計算每人 (本人/配偶/扶養親屬) 的申報租金 + 申報應稅總額
                const perMember = {};  // {memberId: {name, declaredRent, declaredTaxable}}
                const filerIds = [filing.taxpayerId, filing.spouseId, ...(filing.dependentIds || [])].filter(Boolean);
                filerIds.forEach(mid => {
                  const m = members.find(mm => mm.id === mid);
                  if (m) perMember[mid] = { name: m.name, declaredRent: 0, declaredTaxable: 0 };
                });
                householdProperties.forEach(p => {
                  const mid = p.ownerId;
                  if (!perMember[mid]) return;
                  const agg = aggregateContractsForYear(contracts, p.id, year, filing.manualRentOverrides);
                  const overrideKey = `${p.id}_${year}`;
                  const propOverride = (filing.manualRentOverrides || {})[overrideKey] || {};
                  const isIncluded = propOverride.includeInFiling === true;
                  if (!isIncluded) return;
                  const isLand = p.assetType === "land";
                  const calcTaxableFor = (annualValue, isPub) => {
                    const comp = {
                      type: isPub ? "public" : (isLand ? "land" : "general"),
                      monthlyRent: 0, months: 12,
                      annualRentDirect: annualValue,
                      landTax: toNum(p.landTax || 0),
                      expenseRatio: 0.43,
                    };
                    return computeRentalIncome([comp], params).breakdown[0]?.taxableIncome || 0;
                  };
                  const dtOverrides = filing.declaredTaxableOverrides || {};

                  if (agg.anyContractInYear && agg.contracts.length > 0) {
                    agg.contracts.filter(c => c.months > 0).forEach(c => {
                      const appliedAnnual = c.appliedRent !== undefined ? c.appliedRent : c.rent;
                      perMember[mid].declaredRent += appliedAnnual;
                      const auditKey = `c_${c.contractId}_${year}`;
                      const ov = dtOverrides[auditKey];
                      const taxable = (ov !== undefined && ov !== null && ov !== "")
                        ? toNum(ov)
                        : calcTaxableFor(appliedAnnual, c.isPublic);
                      perMember[mid].declaredTaxable += taxable;
                    });
                  } else {
                    // 沒合約看 declared override
                    const auditKey = `n_${p.id}_${year}`;
                    const ov = dtOverrides[auditKey];
                    if (ov !== undefined && ov !== null && ov !== "") {
                      perMember[mid].declaredTaxable += toNum(ov);
                    }
                  }
                });
                const list = Object.values(perMember).filter(p => p.declaredRent > 0 || p.declaredTaxable > 0);
                if (list.length === 0) {
                  return <span className="text-xs" style={{ color: "var(--ink-mute)" }}>尚未勾選計入</span>;
                }
                return (
                  <>
                    <div className="text-[10px] mb-0.5" style={{ color: "var(--ink-mute)" }}>
                      申報租金:{list.map(p => `${p.name} ${fmt(p.declaredRent)}`).join(" · ")}
                    </div>
                    <div className="text-[10px]" style={{ color: "var(--accent-deep)" }}>
                      申報應稅:{list.map(p => `${p.name} ${fmt(p.declaredTaxable)}`).join(" · ")}
                    </div>
                  </>
                );
              })()}
            </div>
          </div>

          {!rentalSectionCollapsed && (<>
          {/* 申報書對照明細表 (跟申報書同欄位:地址 / 申報租金 / 所得總額) */}
          <div className="px-5 py-3" style={{ borderBottom: "1px solid var(--line)", background: "#fafaf6" }}>
            <div className="flex items-center justify-between mb-2">
              <div className="text-xs font-medium" style={{ color: "var(--ink-soft)" }}>
                📋 申報書對照明細表 ({year} 年度)
                <span className="ml-2 font-normal" style={{ color: "var(--ink-mute)" }}>
                  · 跟申報書欄位一致,方便核對
                </span>
              </div>
              {Object.keys(filing.rentalAuditChecked || {}).length > 0 && (
                <button
                  className="text-[10px] px-2 py-1 rounded hover:bg-gray-100"
                  style={{ border: "1px solid var(--line)", color: "var(--ink-mute)" }}
                  onClick={() => onChange({ ...filing, rentalAuditChecked: {} })}
                  title="清除所有核對勾選">
                  ✕ 清除核對 ({Object.keys(filing.rentalAuditChecked || {}).length})
                </button>
              )}
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-xs" style={{ minWidth: "820px" }}>
                <thead>
                  <tr style={{ background: "white", borderBottom: "2px solid var(--ink-soft)" }}>
                    <th className="text-center px-2 py-1.5 font-medium w-12" style={{ color: "var(--ink-mute)" }}>核對</th>
                    <th className="text-center px-2 py-1.5 font-medium" style={{ color: "var(--ink-mute)" }}>歸戶</th>
                    <th className="text-left px-2 py-1.5 font-medium" style={{ color: "var(--ink-mute)" }}>地址</th>
                    <th className="text-center px-2 py-1.5 font-medium" style={{ color: "var(--ink-mute)" }}>類型</th>
                    <th className="text-right px-2 py-1.5 font-medium" style={{ color: "var(--ink-mute)", minWidth: "90px" }}>實際租金<br/><span className="text-[9px]">(合約原值)</span></th>
                    <th className="text-right px-2 py-1.5 font-medium" style={{ color: "var(--ink-mute)", minWidth: "90px" }}>申報租金<br/><span className="text-[9px]">(實際採用)</span></th>
                    <th className="text-right px-2 py-1.5 font-medium" style={{ color: "var(--ink-mute)", minWidth: "90px" }}>實際應稅<br/><span className="text-[9px]">/地價稅</span></th>
                    <th className="text-right px-2 py-1.5 font-medium" style={{ color: "var(--ink-mute)", minWidth: "90px", background: "#f5fbef" }}>申報應稅<br/><span className="text-[9px]">(計入綜所)</span></th>
                  </tr>
                </thead>
                <tbody>
                  {(() => {
                    // 列出全部物件 (不限是否勾選),依規則顯示三組數字
                    const rows = [];
                    householdProperties.forEach(p => {
                      const agg = aggregateContractsForYear(contracts, p.id, year, filing.manualRentOverrides);
                      const owner = members.find(m => m.id === p.ownerId);
                      const ownerName = owner ? owner.name : "—";
                      const isLand = p.assetType === "land";

                      const overrideKey = `${p.id}_${year}`;
                      const override = (filing.manualRentOverrides || {})[overrideKey];
                      const isIncluded = override?.includeInFiling === true;

                      // 計算「實際應稅」用的 helper (用合約原值 c.rent)
                      const calcTaxable = (annualValue, isPub) => {
                        const comp = {
                          type: isPub ? "public" : (isLand ? "land" : "general"),
                          monthlyRent: 0, months: 12,
                          annualRentDirect: annualValue,
                          landTax: toNum(p.landTax || 0),
                          expenseRatio: 0.43,
                        };
                        return computeRentalIncome([comp], params).breakdown[0]?.taxableIncome || 0;
                      };

                      if (agg.anyContractInYear && agg.contracts.length > 0) {
                        agg.contracts.filter(c => c.months > 0).forEach(c => {
                          const actualAnnual = c.rent;  // 合約原值 (沒手動調整)
                          const appliedAnnual = c.appliedRent !== undefined ? c.appliedRent : c.rent;  // 採用值 (可能被手動調整)
                          const actualTaxable = calcTaxable(actualAnnual, c.isPublic);  // 用實際租金算
                          const appliedTaxable = calcTaxable(appliedAnnual, c.isPublic);  // 用申報租金算

                          // 規則:
                          // 未勾選 → 申報租金=0, 申報應稅=0;實際租金/實際應稅照算
                          // 已勾選 → 申報租金=appliedAnnual, 申報應稅=appliedTaxable
                          const declaredRent = isIncluded ? appliedAnnual : 0;
                          const declaredTaxable = isIncluded ? appliedTaxable : 0;

                          rows.push({
                            auditKey: `c_${c.contractId}_${year}`,
                            address: p.address || p.name || "",
                            tenant: c.tenantName,
                            period: c.period,
                            ownerName,
                            typeLabel: c.isPublic ? "公益" : (isLand ? "土地" : "一般"),
                            typeColor: c.isPublic ? "var(--green)" : (isLand ? "var(--gold)" : "var(--ink-soft)"),
                            isIncluded,
                            isAdjusted: c.isAdjusted,
                            actualAnnual, declaredRent,
                            actualTaxable, declaredTaxable,
                          });
                        });
                      } else {
                        // 沒合約 → 只有勾選且有 rentalRecords/手動補列才顯示
                        const computables = getComputablesForProperty(p, year, contracts, rentalRecords, filing.manualRentOverrides);
                        if (computables.length > 0) {
                          computables.forEach((comp, idx) => {
                            const annual = comp.annualRentDirect || (comp.monthlyRent * comp.months) || 0;
                            if (annual === 0) return;
                            const taxable = computeRentalIncome([comp], params).breakdown[0]?.taxableIncome || 0;
                            rows.push({
                              auditKey: `m_${p.id}_${year}_${idx}`,
                              address: p.address || p.name || "",
                              tenant: comp.note || "手動輸入",
                              period: `${comp.months} 個月`,
                              ownerName,
                              typeLabel: comp.type === "public" ? "公益" : (comp.type === "land" ? "土地" : "一般"),
                              typeColor: comp.type === "public" ? "var(--green)" : (comp.type === "land" ? "var(--gold)" : "var(--ink-soft)"),
                              isIncluded,
                              isAdjusted: false,
                              actualAnnual: annual, declaredRent: isIncluded ? annual : 0,
                              actualTaxable: taxable, declaredTaxable: isIncluded ? taxable : 0,
                              isManualOnly: true,
                            });
                          });
                        } else {
                          // 完全沒合約沒手動 → 仍列出空行,讓使用者知道這個物件存在
                          rows.push({
                            auditKey: `n_${p.id}_${year}`,
                            address: p.address || p.name || "",
                            tenant: "—",
                            period: "本年度無合約",
                            ownerName,
                            typeLabel: isLand ? "土地" : "—",
                            typeColor: "var(--ink-mute)",
                            isIncluded,
                            isAdjusted: false,
                            actualAnnual: 0, declaredRent: 0,
                            actualTaxable: 0, declaredTaxable: 0,
                            isManualOnly: false,
                          });
                        }
                      }
                    });

                    if (rows.length === 0) {
                      return (
                        <tr>
                          <td colSpan={8} className="text-center py-4 text-xs" style={{ color: "var(--ink-mute)" }}>
                            本年度尚無租賃物件
                          </td>
                        </tr>
                      );
                    }

                    const totalActualAnnual = rows.reduce((s, r) => s + r.actualAnnual, 0);
                    const totalDeclaredRent = rows.reduce((s, r) => s + r.declaredRent, 0);
                    const totalActualTaxable = rows.reduce((s, r) => s + r.actualTaxable, 0);
                    // 申報應稅總計:採用 override 值
                    const dtOverrides = filing.declaredTaxableOverrides || {};
                    const totalDeclaredTaxable = rows.reduce((s, r) => {
                      const o = dtOverrides[r.auditKey];
                      const v = (o !== undefined && o !== null && o !== "") ? toNum(o) : r.declaredTaxable;
                      return s + v;
                    }, 0);

                    return (
                      <>
                        {rows.map((r, i) => {
                          const auditChecked = !!(filing.rentalAuditChecked || {})[r.auditKey];
                          return (
                          <tr key={i} style={{
                            borderBottom: "1px solid var(--line-soft)",
                            background: auditChecked ? "#f5fbef" : "transparent",
                            opacity: r.isIncluded ? 1 : 0.55,
                          }}>
                            <td className="text-center px-2 py-1.5">
                              <input type="checkbox"
                                checked={auditChecked}
                                onChange={e => {
                                  const next = { ...(filing.rentalAuditChecked || {}) };
                                  if (e.target.checked) next[r.auditKey] = true;
                                  else delete next[r.auditKey];
                                  onChange({ ...filing, rentalAuditChecked: next });
                                }}
                                title="核對後勾選 (僅標記,不影響計算)" />
                            </td>
                            <td className="text-center px-2 py-1.5 text-[11px]" style={{ color: "var(--ink-soft)" }}>
                              {r.ownerName}
                            </td>
                            <td className="px-2 py-1.5">
                              <div className="text-xs">
                                {r.isIncluded && <span style={{ color: "var(--green)" }}>✓ </span>}
                                {r.address}
                              </div>
                              <div className="text-[9px]" style={{ color: "var(--ink-mute)" }}>
                                {r.tenant} · {r.period}
                                {r.isAdjusted && <span className="ml-1" style={{ color: "var(--gold)" }}>(手動)</span>}
                                {r.isManualOnly && <span className="ml-1" style={{ color: "var(--gold)" }}>(無合約)</span>}
                              </div>
                            </td>
                            <td className="text-center px-2 py-1.5">
                              <span className="text-[10px]" style={{ color: r.typeColor }}>{r.typeLabel}</span>
                            </td>
                            <td className="text-right px-2 py-1.5 num">{fmt(r.actualAnnual)}</td>
                            <td className="text-right px-2 py-1.5 num" style={{
                              color: r.isIncluded ? "inherit" : "var(--ink-mute)",
                            }}>
                              {fmt(r.declaredRent)}
                            </td>
                            <td className="text-right px-2 py-1.5 num text-[11px]" style={{ color: "var(--ink-mute)" }}>
                              {fmt(r.actualTaxable)}
                            </td>
                            <td className="text-right px-2 py-1.5 num" style={{
                              background: auditChecked ? "#e8f3dc" : "#f5fbef",
                            }}>
                              {(() => {
                                const overrides = filing.declaredTaxableOverrides || {};
                                const hasOverride = overrides[r.auditKey] !== undefined && overrides[r.auditKey] !== null && overrides[r.auditKey] !== "";
                                const displayVal = hasOverride ? toNum(overrides[r.auditKey]) : r.declaredTaxable;
                                return (
                                  <div className="flex items-center justify-end gap-1">
                                    <input type="text" inputMode="numeric"
                                      className="text-right text-xs num font-medium w-20 px-1 py-0.5 rounded"
                                      style={{
                                        background: "transparent",
                                        border: hasOverride ? "1px dashed var(--gold)" : "1px dashed transparent",
                                        color: r.isIncluded ? "var(--accent-deep)" : "var(--ink-mute)",
                                      }}
                                      value={hasOverride ? overrides[r.auditKey] : (r.isIncluded ? String(r.declaredTaxable) : "0")}
                                      placeholder={String(r.declaredTaxable)}
                                      onChange={e => {
                                        const v = e.target.value.replace(/[^\d-]/g, "");
                                        const next = { ...(filing.declaredTaxableOverrides || {}) };
                                        // 若跟自動值相同,清掉 override
                                        if (v === "" || toNum(v) === r.declaredTaxable) {
                                          delete next[r.auditKey];
                                        } else {
                                          next[r.auditKey] = v;
                                        }
                                        onChange({ ...filing, declaredTaxableOverrides: next });
                                      }}
                                      title={hasOverride ? `自動值 ${fmt(r.declaredTaxable)} → 已覆寫` : "點擊修改"}
                                    />
                                    {hasOverride && (
                                      <button
                                        className="text-[9px] hover:underline"
                                        style={{ color: "var(--ink-mute)" }}
                                        onClick={() => {
                                          const next = { ...(filing.declaredTaxableOverrides || {}) };
                                          delete next[r.auditKey];
                                          onChange({ ...filing, declaredTaxableOverrides: next });
                                        }}
                                        title="還原為自動值"
                                      >↻</button>
                                    )}
                                  </div>
                                );
                              })()}
                            </td>
                          </tr>
                          );
                        })}
                        {/* 合計列 */}
                        <tr style={{ background: "#f0ede2", borderTop: "2px solid var(--ink)" }}>
                          <td colSpan={4} className="text-right px-2 py-2 font-medium text-xs">
                            合計({rows.length} 筆 · 計入 {rows.filter(r => r.isIncluded).length} 筆 · 已核對 {rows.filter(r => (filing.rentalAuditChecked || {})[r.auditKey]).length} 筆)
                          </td>

            </div>
            <div className="mt-2 text-[10px]" style={{ color: "var(--ink-mute)" }}>
              ⓘ <b>所得總額</b> 會自動計入 ① 各成員所得 → 綜合所得總額。對照申報書的「租賃所得」明細表,合計數應一致。
              若不一致,請檢查:1) 合約租期是否完全落在 {year} 年度 2) 月租金是否正確 3) 是否漏建合約。

          <div className="p-3 space-y-2">
            {(() => {
              if (householdProperties.length === 0) {
