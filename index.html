<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

// ============================================================
// 稅務參數資料 (依年度)
// ============================================================
const TAX_PARAMS = {
  114: {
    label: "114年度 (115年5月申報)",
    exemption: 97000,           // 一般免稅額
    exemptionElder: 145500,     // 70歲以上
    standardSingle: 131000,     // 標準扣除額(單身)
    standardCouple: 262000,     // 標準扣除額(有配偶)
    salaryDeduction: 218000,    // 薪資所得特別扣除額
    disabilityDeduction: 218000,// 身心障礙特別扣除額
    educationDeduction: 25000,  // 教育學費扣除額(每人)
    preschoolFirst: 150000,     // 幼兒學前扣除額(第一名,5歲以下)
    preschoolOther: 225000,     // 幼兒學前扣除額(第二名以上)
    longTermCare: 120000,       // 長期照顧扣除額
    savingsDeduction: 270000,   // 儲蓄投資扣除額上限
    rentDeduction: 180000,      // 房屋租金支出特別扣除額上限
    basicLivingExp: 213000,     // 基本生活費(每人)
    insuranceLimit: 24000,      // 人身保險費上限(每人,健保不限)
    mortgageLimit: 300000,      // 自用住宅購屋借款利息上限
    rentExpenseRatio: 0.43,     // 租賃所得必要費用率
    publicLandlordExempt: 15000,// 公益出租人每月免稅額
    publicLandlordExpense: 0.60,// 公益出租人必要費用率(超出免稅額部分)
    brackets: [
      { upTo: 590000, rate: 0.05, deduct: 0 },
      { upTo: 1330000, rate: 0.12, deduct: 41300 },
      { upTo: 2660000, rate: 0.20, deduct: 147700 },
      { upTo: 4980000, rate: 0.30, deduct: 413700 },
      { upTo: Infinity, rate: 0.40, deduct: 911700 },
    ],
  },
  113: {
    label: "113年度 (114年5月申報)",
    exemption: 97000,
    exemptionElder: 145500,
    standardSingle: 131000,
    standardCouple: 262000,
    salaryDeduction: 218000,
    disabilityDeduction: 218000,
    educationDeduction: 25000,
    preschoolFirst: 150000,
    preschoolOther: 225000,
    longTermCare: 120000,
    savingsDeduction: 270000,
    rentDeduction: 180000,
    basicLivingExp: 210000,
    insuranceLimit: 24000,
    mortgageLimit: 300000,
    rentExpenseRatio: 0.43,
    publicLandlordExempt: 15000,
    publicLandlordExpense: 0.60,
    brackets: [
      { upTo: 590000, rate: 0.05, deduct: 0 },
      { upTo: 1330000, rate: 0.12, deduct: 41300 },
      { upTo: 2660000, rate: 0.20, deduct: 147700 },
      { upTo: 4980000, rate: 0.30, deduct: 413700 },
      { upTo: Infinity, rate: 0.40, deduct: 911700 },
    ],
  },
  112: {
    label: "112年度 (113年5月申報)",
    exemption: 92000,
    exemptionElder: 138000,
    standardSingle: 124000,
    standardCouple: 248000,
    salaryDeduction: 207000,
    disabilityDeduction: 207000,
    educationDeduction: 25000,
    preschoolFirst: 120000,
    preschoolOther: 120000,
    longTermCare: 120000,
    savingsDeduction: 270000,
    rentDeduction: 120000, // 112年仍為列舉扣除額
    basicLivingExp: 202000,
    insuranceLimit: 24000,
    mortgageLimit: 300000,
    rentExpenseRatio: 0.43,
    publicLandlordExempt: 15000,
    publicLandlordExpense: 0.60,
    brackets: [
      { upTo: 560000, rate: 0.05, deduct: 0 },
      { upTo: 1260000, rate: 0.12, deduct: 39200 },
      { upTo: 2520000, rate: 0.20, deduct: 140000 },
      { upTo: 4720000, rate: 0.30, deduct: 392000 },
      { upTo: Infinity, rate: 0.40, deduct: 864000 },
    ],
  },
};
const DEFAULT_YEAR = 114;
const AVAILABLE_YEARS = [114, 113, 112];

// ============================================================
// 親屬關係分類 (依所得稅法第 17 條)
// ============================================================
// isLinealAscendant: 直系尊親屬 (享有 70 歲免稅額優惠 145,500)
// isChild: 子女 (享教育學費扣除 / 幼兒學前扣除)
// isCollateral: 旁系 (兄弟姊妹等,扶養條件較嚴)
// ============================================================
const RELATIONS = {
  self:        { label: "本人",       isLinealAscendant: false, isChild: false, isCollateral: false, canBeDependent: false, canBeSpouse: false },
  spouse:      { label: "配偶",       isLinealAscendant: false, isChild: false, isCollateral: false, canBeDependent: false, canBeSpouse: true  },
  child:       { label: "子女",       isLinealAscendant: false, isChild: true,  isCollateral: false, canBeDependent: true,  canBeSpouse: false },
  grandchild:  { label: "孫子女",     isLinealAscendant: false, isChild: true,  isCollateral: false, canBeDependent: true,  canBeSpouse: false },
  parent:      { label: "父母",       isLinealAscendant: true,  isChild: false, isCollateral: false, canBeDependent: true,  canBeSpouse: false },
  grandparent: { label: "祖父母",     isLinealAscendant: true,  isChild: false, isCollateral: false, canBeDependent: true,  canBeSpouse: false },
  parentInLaw: { label: "配偶父母",   isLinealAscendant: true,  isChild: false, isCollateral: false, canBeDependent: true,  canBeSpouse: false },
  sibling:     { label: "兄弟姊妹",   isLinealAscendant: false, isChild: false, isCollateral: true,  canBeDependent: true,  canBeSpouse: false },
  other:       { label: "其他親屬",   isLinealAscendant: false, isChild: false, isCollateral: true,  canBeDependent: true,  canBeSpouse: false },
};

// 判斷某成員是否能享 70 歲提高免稅額
// 規定: 本人、配偶、直系尊親屬 (parent/grandparent/parentInLaw) 滿 70 歲適用
function canUseElderExemption(member, role) {
  if (!member || member.age === "" || Number(member.age) < 70) return false;
  if (role === "taxpayer" || role === "spouse") return true;
  const r = RELATIONS[member.relation];
  return r && r.isLinealAscendant;
}

// 檢查申報戶合法性 (回傳警告訊息陣列)
function validateFiling(filing, members) {
  const warnings = [];
  const taxpayer = members.find(m => m.id === filing.taxpayerId);
  const spouse = filing.spouseId ? members.find(m => m.id === filing.spouseId) : null;
  const dependents = (filing.dependentIds || []).map(id => members.find(m => m.id === id)).filter(Boolean);

  if (!taxpayer) {
    warnings.push({ level: "error", msg: "尚未指定主納稅義務人" });
    return warnings;
  }

  // 配偶關係檢查
  if (spouse) {
    if (spouse.id === taxpayer.id) {
      warnings.push({ level: "error", msg: "配偶不能與主納稅人是同一人" });
    }
    const sr = RELATIONS[spouse.relation];
    if (sr && !sr.canBeSpouse && spouse.relation !== "self") {
      warnings.push({ level: "warn", msg: `「${spouse.name}」關係標記為「${sr.label}」,不符合配偶身分,建議改成「配偶」` });
    }
  }

  // 扶養親屬條件檢查
  dependents.forEach(d => {
    const r = RELATIONS[d.relation];
    if (!r) return;
    if (!r.canBeDependent) {
      warnings.push({ level: "error", msg: `「${d.name}」(${r.label}) 不能列為扶養親屬` });
      return;
    }
    if (d.id === taxpayer.id || d.id === filing.spouseId) {
      warnings.push({ level: "error", msg: `「${d.name}」已是本人或配偶,不可重複列為扶養` });
      return;
    }
    const age = Number(d.age);

    // 子女、孫子女、兄弟姊妹: 未成年 OR 成年但在學/身障/無謀生能力
    if (r.isChild || d.relation === "sibling") {
      if (age >= 20 && !d.isStudent && !d.isDisabled && !d.cannotSupportSelf) {
        warnings.push({ level: "warn", msg: `「${d.name}」(${r.label}) 已成年,需「在學」、「身心障礙」或「無謀生能力」才可列為扶養` });
      }
    }

    // 直系尊親屬: 60 歲以上 OR 無謀生能力
    if (r.isLinealAscendant) {
      if (age < 60 && !d.cannotSupportSelf && !d.isDisabled) {
        warnings.push({ level: "warn", msg: `「${d.name}」(${r.label}) 未滿 60 歲,需「無謀生能力」或「身心障礙」才可列為扶養` });
      }
    }

    // 其他親屬: 必須勾選共同居住
    if (d.relation === "other" && !d.coResident) {
      warnings.push({ level: "info", msg: `「${d.name}」(其他親屬) 須與納稅人共同居住且確受扶養,請確認並在成員資料勾選「共同居住」` });
    }
  });

  return warnings;
}

// ============================================================
// 工具函式
// ============================================================
const fmt = (n) => {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return Math.round(Number(n)).toLocaleString("zh-TW");
};
const fmtSign = (n) => {
  if (n === null || n === undefined || isNaN(n)) return "—";
  const v = Math.round(Number(n));
  if (v > 0) return "+" + v.toLocaleString("zh-TW");
  return v.toLocaleString("zh-TW");
};
const toNum = (v) => {
  if (v === "" || v === null || v === undefined) return 0;
  const n = Number(String(v).replace(/,/g, ""));
  return isNaN(n) ? 0 : n;
};
const uid = () => Math.random().toString(36).slice(2, 10);

// ============================================================
// 核心稅務計算
// ============================================================
function computeRentalIncome(properties, params) {
  // 回傳: { taxable: 應稅租金所得, exempted: 免稅金額, breakdown: [...] }
  let taxable = 0, exempted = 0;
  const breakdown = [];
  properties.forEach(p => {
    const monthly = toNum(p.monthlyRent);
    const months = toNum(p.months || 12);
    const gross = monthly * months;
    let income = 0, exempt = 0;
    let note = "";
    if (p.type === "general") {
      // 一般出租: 43%必要費用
      const expenseRatio = p.expenseRatio !== undefined && p.expenseRatio !== "" ? Number(p.expenseRatio) : params.rentExpenseRatio;
      income = gross * (1 - expenseRatio);
      note = `必要費用 ${(expenseRatio * 100).toFixed(0)}%`;
    } else if (p.type === "public") {
      // 公益出租人: 每月免稅 15,000,超出部分必要費用 60%
      const exemptMonthly = Math.min(monthly, params.publicLandlordExempt);
      const overMonthly = Math.max(0, monthly - params.publicLandlordExempt);
      exempt = exemptMonthly * months;
      const overGross = overMonthly * months;
      income = overGross * (1 - params.publicLandlordExpense);
      note = `每月免稅 ${fmt(params.publicLandlordExempt)},超出部分費用率 60%`;
    } else if (p.type === "subletAgent") {
      // 包租代管: 每月免稅 15,000,超出部分必要費用 60% (與公益出租人類似的優惠)
      const exemptMonthly = Math.min(monthly, params.publicLandlordExempt);
      const overMonthly = Math.max(0, monthly - params.publicLandlordExempt);
      exempt = exemptMonthly * months;
      const overGross = overMonthly * months;
      income = overGross * (1 - params.publicLandlordExpense);
      note = `包租代管,每月免稅 ${fmt(params.publicLandlordExempt)},超出部分費用率 60%`;
    } else if (p.type === "taxFree") {
      // 免稅紀錄: 不報稅
      income = 0;
      exempt = gross;
      note = "免稅租金紀錄,不計入所得";
    } else {
      income = gross * (1 - params.rentExpenseRatio);
      note = "預設 43% 費用率";
    }
    taxable += income;
    exempted += exempt;
    breakdown.push({
      ...p,
      gross,
      taxableIncome: Math.round(income),
      exemptAmount: Math.round(exempt),
      note,
    });
  });
  return { taxable: Math.round(taxable), exempted: Math.round(exempted), breakdown };
}

function applyBrackets(netIncome, params) {
  if (netIncome <= 0) return { tax: 0, rate: 0, deduct: 0 };
  for (const b of params.brackets) {
    if (netIncome <= b.upTo) {
      return { tax: Math.max(0, Math.round(netIncome * b.rate - b.deduct)), rate: b.rate, deduct: b.deduct };
    }
  }
  const last = params.brackets[params.brackets.length - 1];
  return { tax: Math.max(0, Math.round(netIncome * last.rate - last.deduct)), rate: last.rate, deduct: last.deduct };
}

function computeTaxForFiling(filing, members, year) {
  const params = TAX_PARAMS[year];
  if (!params) return null;

  // 收集申報戶的成員 (主納稅人 + 配偶 + 扶養親屬)
  const filerIds = [filing.taxpayerId, filing.spouseId, ...(filing.dependentIds || [])].filter(Boolean);
  const filers = filerIds.map(id => members.find(m => m.id === id)).filter(Boolean);
  const hasSpouse = !!filing.spouseId;

  // === 1. 各項所得 ===
  let salaryGross = 0, salaryDeductible = 0;
  let interest = 0, dividend = 0, rentalTaxable = 0, otherIncome = 0;
  const rentalDetail = [];
  let disabilityCount = 0, elderCount = 0, studentCount = 0;
  let preschoolCount = 0;
  let longTermCareCount = 0;

  filers.forEach(m => {
    const income = filing.memberIncome?.[m.id] || {};
    const sal = toNum(income.salary);
    salaryGross += sal;
    // 薪資扣除額: 每人扣 218,000,但若薪資 < 218,000,只能扣實際薪資
    salaryDeductible += Math.min(sal, params.salaryDeduction);
    interest += toNum(income.interest);
    dividend += toNum(income.dividend);
    otherIncome += toNum(income.other);

    // 租金 (從 properties 找出此人擁有的)
    const myProps = (filing.properties || []).filter(p => p.ownerId === m.id);
    const r = computeRentalIncome(myProps, params);
    rentalTaxable += r.taxable;
    rentalDetail.push({ memberId: m.id, ...r });

    // 判斷身分標記用的「角色」
    let role = "dependent";
    if (m.id === filing.taxpayerId) role = "taxpayer";
    else if (m.id === filing.spouseId) role = "spouse";

    if (m.isDisabled) disabilityCount++;
    if (m.age >= 70) elderCount++;
    // 教育學費: 限子女、孫子女 (財政部解釋以子女為限,孫子女實務上認可)
    const rel = RELATIONS[m.relation];
    if (m.isStudent && rel && rel.isChild) studentCount++;
    // 幼兒學前: 限子女、孫子女且 < 6 歲
    if (m.age !== undefined && m.age !== "" && Number(m.age) < 6 && rel && rel.isChild) preschoolCount++;
    if (m.needsLongTermCare) longTermCareCount++;
  });

  const grossIncome = salaryGross + interest + dividend + rentalTaxable + otherIncome;

  // === 2. 免稅額 (按關係判定) ===
  // 規定: 本人、配偶、直系尊親屬 70 歲以上適用 145,500;其他親屬即使 70 歲仍用 97,000
  const exemption = filers.reduce((sum, m) => {
    let role = "dependent";
    if (m.id === filing.taxpayerId) role = "taxpayer";
    else if (m.id === filing.spouseId) role = "spouse";
    return sum + (canUseElderExemption(m, role) ? params.exemptionElder : params.exemption);
  }, 0);

  // === 3. 一般扣除額: 標準 vs 列舉 ===
  const standardDeduction = hasSpouse ? params.standardCouple : params.standardSingle;

  const itemized = filing.itemizedDeductions || {};
  const donationGeneral = toNum(itemized.donationGeneral);     // 一般捐贈(限20%)
  const donationUnlimited = toNum(itemized.donationUnlimited); // 不限額捐贈(政府/國防/勞軍等)
  const insurancePersonal = toNum(itemized.insurancePersonal); // 人身保險費(每人上限24,000)
  const insuranceHealth = toNum(itemized.insuranceHealth);     // 健保費(不限額)
  const medical = toNum(itemized.medical);                     // 醫藥及生育費(不限額)
  const disaster = toNum(itemized.disaster);                   // 災害損失
  const mortgageInterest = toNum(itemized.mortgageInterest);   // 自用住宅購屋借款利息

  // 捐贈上限: 一般捐贈不得超過綜合所得總額 20%
  const donationGeneralCapped = Math.min(donationGeneral, grossIncome * 0.20);
  // 保險費上限: 每人 24,000 (申報戶成員人數)
  const insurancePersonalCapped = Math.min(insurancePersonal, filers.length * params.insuranceLimit);
  // 自用住宅購屋借款利息: 實際利息 - 儲蓄投資扣除後餘額,上限 30 萬

  const itemizedTotal =
    donationGeneralCapped + donationUnlimited +
    insurancePersonalCapped + insuranceHealth +
    medical + disaster + mortgageInterest;

  const useItemized = filing.deductionChoice === "itemized" ||
    (filing.deductionChoice === "auto" && itemizedTotal > standardDeduction);

  const generalDeduction = useItemized ? itemizedTotal : standardDeduction;

  // === 4. 特別扣除額 ===
  // 儲蓄投資扣除額: 預設 = min(全戶利息, 270,000)
  // 但若使用者勾選「手動覆寫」(例如部分利息為公債/公司債不適用),則用使用者填的金額
  const savingsAuto = Math.min(interest, params.savingsDeduction);
  const savings = filing.savingsOverride
    ? Math.min(Math.max(0, toNum(filing.savingsOverrideAmount)), params.savingsDeduction)
    : savingsAuto;
  const disabilityDed = disabilityCount * params.disabilityDeduction;
  const educationDed = Math.min(studentCount, filers.length) * params.educationDeduction;
  // 幼兒學前: 第一名定額,第二名以上提高 (依 114 年制度)
  let preschoolDed = 0;
  if (preschoolCount > 0) {
    preschoolDed = params.preschoolFirst + Math.max(0, preschoolCount - 1) * params.preschoolOther;
  }
  const longTermCareDed = longTermCareCount * params.longTermCare;

  // 薪資扣除額
  const salarySD = salaryDeductible;

  // 房租支出特別扣除額 (114 起為特別扣除額,上限 18 萬;但稅率 20% 以上不得扣)
  const rentSupport = toNum(filing.rentSupportPaid);
  // 先試算,真正能扣需看稅率,稍後處理
  const rentSupportCapped = Math.min(rentSupport, params.rentDeduction);

  // 自用住宅購屋借款利息: 真實扣除額 = max(0, 利息 - 儲蓄投資扣除額)
  // 但因為儲蓄投資已在特扣處理,這裡列舉時要扣除
  // (簡化處理: 若選列舉且利息支出 > savings,實際可列 = 利息 - savings,上限30萬)
  let actualMortgage = 0;
  if (useItemized && mortgageInterest > 0) {
    actualMortgage = Math.min(Math.max(0, mortgageInterest - savings), params.mortgageLimit);
  }
  // 重算列舉合計 (扣除儲蓄投資後的房貸利息)
  const itemizedTotalActual = useItemized ?
    (donationGeneralCapped + donationUnlimited + insurancePersonalCapped + insuranceHealth + medical + disaster + actualMortgage)
    : 0;
  const generalDeductionActual = useItemized ? itemizedTotalActual : standardDeduction;

  const specialBeforeRent = salarySD + savings + disabilityDed + educationDed + preschoolDed + longTermCareDed;

  // === 5. 試算淨所得 (不含房租特扣) ===
  const netBeforeRent = Math.max(0, grossIncome - exemption - generalDeductionActual - specialBeforeRent);
  const taxResultBefore = applyBrackets(netBeforeRent, params);

  // 房租支出特扣: 若稅率 < 20% 才可扣
  let rentDeductActual = 0;
  if (year >= 114 && rentSupportCapped > 0 && taxResultBefore.rate < 0.20) {
    rentDeductActual = rentSupportCapped;
  }

  const specialTotal = specialBeforeRent + rentDeductActual;

  // === 6. 基本生活費差額 ===
  // 比較基準: 免稅額 + 一般扣除額 + 儲蓄+身障+教育+幼兒+長照+房租
  const blcompare = exemption + generalDeductionActual + savings + disabilityDed + educationDed + preschoolDed + longTermCareDed + rentDeductActual;
  const blTotal = filers.length * params.basicLivingExp;
  const blDiff = Math.max(0, blTotal - blcompare);

  // === 7. 淨所得 & 稅 ===
  const netIncome = Math.max(0, grossIncome - exemption - generalDeductionActual - specialTotal - blDiff);
  const taxResult = applyBrackets(netIncome, params);

  // === 7.5 股利可抵減稅額 ===
  // 規則 (所得稅法第 15 條第 4 項):
  //   合併計稅: 股利全額併入綜所,但可用「股利 × 8.5%」抵減稅額,每戶上限 80,000
  //   分開計稅: 股利不併入綜所,單獨用 28% 課稅 (適用高所得者,本系統暫不支援自動切換)
  // 預設採用「合併計稅,享 8.5% 抵減」
  const dividendChoice = filing.dividendChoice || "combine"; // combine | separate
  let dividendCredit = 0;
  let dividendSeparateTax = 0;
  if (dividendChoice === "combine") {
    dividendCredit = Math.min(Math.round(dividend * 0.085), 80000);
  } else if (dividendChoice === "separate") {
    // 分開計稅: 股利不併入 (但目前 grossIncome 已含股利,要回退)
    // 簡化: dividend 已在 grossIncome 內,分開算需從 netIncome 減去股利再算稅,加上股利*28%
    // 但這牽涉到誰算淨額誰算分離,複雜度高,先以最簡化處理
    dividendSeparateTax = Math.round(dividend * 0.28);
  }

  // === 7.6 已扣繳稅額 / 重購自用住宅退稅 / 其他可扣抵 ===
  const taxCredits = filing.taxCredits || {};
  const prepaidTax = toNum(taxCredits.prepaidTax);            // 已預扣繳稅額 (薪資、利息、租賃...)
  const repurchaseCredit = toNum(taxCredits.repurchaseCredit);// 重購自用住宅退稅
  const otherCredit = toNum(taxCredits.otherCredit);          // 其他抵減 (含投資抵減、自用住宅買賣退稅等)

  // === 7.7 應自繳稅額計算 ===
  // 法定步驟:
  //   (1) 綜所稅 = 淨額 × 稅率 − 累進差額
  //   (2) 減「投資抵減 / 大陸地區所得已納稅額 / 重購退稅 / 股利抵減」(但股利抵減上限 8 萬)
  //   (3) 減「已預扣繳稅額」= 應自繳/退稅
  const totalCreditsBeforePrepaid = dividendCredit + repurchaseCredit + otherCredit;
  const taxAfterCredits = Math.max(0, taxResult.tax + dividendSeparateTax - totalCreditsBeforePrepaid);
  const finalDue = taxAfterCredits - prepaidTax; // 正數 = 應補繳;負數 = 可退稅

  // === 8. 標準 vs 列舉比較 (給使用者參考) ===
  const altDeduction = useItemized ? standardDeduction : itemizedTotalActual;
  const altGeneral = altDeduction;
  const altNet = Math.max(0, grossIncome - exemption - altGeneral - specialTotal - blDiff);
  const altTaxRaw = applyBrackets(altNet, params).tax;
  // alt 也要扣抵
  const altTaxAfterCredits = Math.max(0, altTaxRaw + dividendSeparateTax - totalCreditsBeforePrepaid);
  const altTax = altTaxAfterCredits - prepaidTax;
  const saving = altTax - finalDue; // 比較最終實繳

  // 申報戶合法性檢查
  const warnings = validateFiling(filing, members);

  return {
    year,
    params,
    filers,
    hasSpouse,
    warnings,
    // 所得
    salaryGross, interest, dividend, rentalTaxable, otherIncome, grossIncome,
    rentalDetail,
    // 扣除
    exemption,
    standardDeduction,
    itemizedTotal: itemizedTotalActual,
    useItemized,
    generalDeduction: generalDeductionActual,
    itemizedDetail: {
      donationGeneral: donationGeneralCapped,
      donationUnlimited,
      insurancePersonal: insurancePersonalCapped,
      insuranceHealth, medical, disaster,
      mortgageInterest: actualMortgage,
    },
    // 特扣
    salarySD, savings, savingsAuto, disabilityDed, educationDed, preschoolDed, longTermCareDed, rentDeductActual,
    specialTotal,
    // 基本生活費
    blTotal, blcompare, blDiff,
    // 稅
    netIncome,
    taxRate: taxResult.rate,
    taxDeductValue: taxResult.deduct,
    tax: taxResult.tax,
    // 抵減
    dividendChoice,
    dividendCredit,
    dividendSeparateTax,
    repurchaseCredit,
    otherCredit,
    totalCreditsBeforePrepaid,
    taxAfterCredits,
    prepaidTax,
    finalDue, // 正數 = 補繳;負數 = 退稅
    // 比較
    altDeduction: useItemized ? "standard" : "itemized",
    altTax,
    saving,
  };
}

const SAMPLE_DATA = {
  members: [],
  filings: [],
  properties: [],
  meta: { lastSavedAt: null, version: 1 },
};

// ============================================================
// 持久化 (localStorage)
// ============================================================
const STORAGE_KEY = "tw_tax_app_v1";
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return SAMPLE_DATA;
    const parsed = JSON.parse(raw);
    return { ...SAMPLE_DATA, ...parsed };
  } catch (e) { return SAMPLE_DATA; }
}
function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...data, meta: { ...data.meta, lastSavedAt: new Date().toISOString() } }));
  } catch (e) { console.error("save fail", e); }
}

function Dashboard({ data, year, setPage }) {
  const yearFilings = data.filings.filter(f => f.year === year);
  const results = yearFilings.map(f => computeTaxForFiling(f, data.members, year));
  const totalTax = results.reduce((s, r) => s + (r?.tax || 0), 0);
  const totalIncome = results.reduce((s, r) => s + (r?.grossIncome || 0), 0);
  const totalSaving = results.reduce((s, r) => s + Math.max(0, r?.saving || 0), 0);

  // 歷年比較
  const yearTotals = AVAILABLE_YEARS.map(y => {
    const fs = data.filings.filter(f => f.year === y);
    const rs = fs.map(f => computeTaxForFiling(f, data.members, y));
    return {
      year: y,
      tax: rs.reduce((s, r) => s + (r?.tax || 0), 0),
      income: rs.reduce((s, r) => s + (r?.grossIncome || 0), 0),
      count: fs.length,
    };
  }).reverse();

  return (
    <div className="fade-in">
      <PageHeader
        ornament={`§ DASHBOARD · ${year} 年度`}
        title="家族稅務總覽"

            <div>最後更新</div>

          </div>
        }

      <div className="grid grid-cols-4 gap-4 mb-8">
        <div className="card p-5">
          <div className="ornament">TOTAL GROSS INCOME</div>
          <div className="font-serif text-3xl num mt-2" style={{ color: "var(--ink)" }}>{fmt(totalIncome)}</div>
          <div className="text-xs mt-1" style={{ color: "var(--ink-mute)" }}>全戶綜合所得總額 (TWD)</div>
        </div>
        <div className="card p-5" style={{ borderColor: "var(--accent)" }}>
          <div className="ornament" style={{ color: "var(--accent-deep)" }}>TAX PAYABLE</div>

          <div className="ornament">EFFECTIVE RATE</div>

          <div className="ornament" style={{ color: "#3d5235" }}>SAVINGS vs ALT</div>

            </tr>

                <td className="px-3 py-3 text-right num">{y.count}</td>
                <td className="px-3 py-3 text-right num">{fmt(y.income)}</td>
                <td className="px-5 py-3 text-right num font-serif">{fmt(y.tax)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function MembersPage({ data, setData }) {
  const [editing, setEditing] = useState(null);
  const blank = {
    id: "", name: "", relation: "self", age: "",
    isDisabled: false, isStudent: false, needsLongTermCare: false,
    cannotSupportSelf: false, coResident: false,
    idNumber: "", note: ""
  };

  const save = (m) => {
    let next;
    if (editing && editing.id) {
      next = data.members.map(x => x.id === m.id ? m : x);
    } else {
      next = [...data.members, { ...m, id: uid() }];
    }
    setData({ ...data, members: next });
    setEditing(null);
  };

  const remove = (id) => {
    if (!confirm("確定刪除此成員?所有相關申報資料中對該成員的引用也會失效。")) return;
    setData({ ...data, members: data.members.filter(m => m.id !== id) });
  };

  return (
    <div className="fade-in">
      <PageHeader
        ornament="§ FAMILY MEMBERS · 家庭成員"
        title="成員名冊"
        subtitle="關係會影響扣除額與扶養條件,請正確設定"
        right={<button className="btn-primary text-sm" onClick={() => setEditing({ ...blank })}>+ 新增成員</button>}
      />

      {data.members.length === 0 ? (

function MemberModal({ member, onSave, onClose }) {
  const [m, setM] = useState({ ...member });
  const currentRel = RELATIONS[m.relation];

  // 給每個關係的扶養條件提示
  const relHint = (() => {
    if (!currentRel || m.relation === "self" || m.relation === "spouse") return null;
    const age = Number(m.age);
    if (currentRel.isLinealAscendant) {
      return `直系尊親屬:60 歲以上 OR 無謀生能力可列扶養;滿 70 歲可用提高免稅額 145,500`;
    }
    if (currentRel.isChild) {
      return `子女/孫子女:未成年 OR 成年但在學/身障/無謀生能力可列扶養;在學可扣教育學費,未滿 6 歲可扣幼兒學前`;
    }
    if (m.relation === "sibling") {
      return `兄弟姊妹:未成年 OR 成年但在學/身障/無謀生能力可列扶養 (但不適用教育學費扣除額)`;
    }
    if (m.relation === "other") {
      return `其他親屬:需與納稅人「共同居住」且確受扶養 (民法第1114條第4款)`;
    }
    return null;
  })();

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center" style={{ background: "rgba(26,29,35,0.4)" }} onClick={onClose}>
      <div className="card w-[520px] max-h-[90vh] overflow-y-auto p-6" onClick={e => e.stopPropagation()}>
        <div className="ornament mb-2">{m.id ? "EDIT MEMBER" : "NEW MEMBER"}</div>
        <h2 className="font-serif text-xl mb-4">{m.id ? "編輯成員" : "新增成員"}</h2>

        <div className="space-y-3">
          <Field label="姓名">
            <input className="input-text-plain w-full" value={m.name} onChange={e => setM({...m, name: e.target.value})} />
          </Field>
          <Field label="身分證末四碼 (識別用,選填)">
            <input className="input-text w-full" value={m.idNumber} maxLength={4} onChange={e => setM({...m, idNumber: e.target.value})} />
          </Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="關係 (影響稅務計算!)">
              <select className="input-text-plain w-full" value={m.relation} onChange={e => setM({...m, relation: e.target.value})}>
                {Object.entries(RELATIONS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
              </select>
            </Field>
            <Field label="年齡">
              <input type="number" className="input-text w-full" value={m.age} onChange={e => setM({...m, age: e.target.value === "" ? "" : Number(e.target.value)})} />
            </Field>
          </div>
          {relHint && (
            <div className="text-xs p-2 rounded" style={{ background: "#fafaf6", color: "var(--ink-soft)", border: "1px solid var(--line)" }}>
              ⓘ {relHint}
            </div>
          )}
          <Field label="備註">
            <input className="input-text-plain w-full" value={m.note} onChange={e => setM({...m, note: e.target.value})} />
          </Field>

          <div className="pt-2">
            <div className="text-xs mb-2 ornament">SPECIAL STATUS · 特殊身分</div>
            <div className="grid grid-cols-2 gap-2">
              <Toggle label="身心障礙" value={m.isDisabled} onChange={v => setM({...m, isDisabled: v})} hint="特扣 218,000" />
              <Toggle label="在學中" value={m.isStudent} onChange={v => setM({...m, isStudent: v})} hint="子女/孫子女才適用教育學費扣除" />
              <Toggle label="需長期照顧" value={m.needsLongTermCare} onChange={v => setM({...m, needsLongTermCare: v})} hint="特扣 120,000" />
              <Toggle label="無謀生能力" value={m.cannotSupportSelf} onChange={v => setM({...m, cannotSupportSelf: v})} hint="作為扶養條件" />
              {m.relation === "other" && (
                <Toggle label="與納稅人共同居住" value={m.coResident} onChange={v => setM({...m, coResident: v})} hint="其他親屬扶養必要條件" />
              )}
            </div>
          </div>
        </div>

        <div className="flex gap-2 justify-end mt-6">
          <button className="btn-secondary" onClick={onClose}>取消</button>
          <button className="btn-primary" onClick={() => { if (!m.name) return alert("請輸入姓名"); onSave(m); }}>儲存</button>
        </div>
      </div>
    </div>
  );
}

function Field({ label, hint, children }) {
  return (
    <div>
      <label className="block text-xs mb-1" style={{ color: "var(--ink-soft)" }}>{label}</label>
      {children}
      {hint && <div className="text-xs mt-1" style={{ color: "var(--ink-mute)" }}>{hint}</div>}
    </div>
  );
}

function Toggle({ label, value, onChange, hint }) {
  return (
    <label className="flex items-start gap-2 cursor-pointer p-2 rounded hover:bg-gray-50">
      <input type="checkbox" checked={value} onChange={e => onChange(e.target.checked)} className="mt-0.5" />
      <div>
        <div className="text-sm">{label}</div>
        {hint && <div className="text-xs" style={{ color: "var(--ink-mute)" }}>{hint}</div>}
      </div>
    </label>
  );
}

function FilingPage({ data, setData, year, setPage }) {
  const yearFilings = data.filings.filter(f => f.year === year);
  const [selectedId, setSelectedId] = useState(yearFilings[0]?.id || null);
  const selected = yearFilings.find(f => f.id === selectedId);

  useEffect(() => {
    if (yearFilings.length > 0 && !yearFilings.find(f => f.id === selectedId)) {
      setSelectedId(yearFilings[0].id);
    }
  }, [year, data.filings]);

  const addFiling = () => {
    const newFiling = {
      id: uid(),
      year,
      name: `${year}年度·新申報戶`,
      taxpayerId: data.members[0]?.id || "",
      spouseId: "",
      dependentIds: [],
      memberIncome: {},
      properties: data.properties.map(p => p.id), // 預設套用所有物件 (使用 id 即可)
      // 但其實我們直接用 data.properties 內容來算 (要看哪個 owner 在這申報戶中)
      itemizedDeductions: {
        donationGeneral: 0, donationUnlimited: 0,
        insurancePersonal: 0, insuranceHealth: 0,
        medical: 0, disaster: 0, mortgageInterest: 0,
      },
      rentSupportPaid: 0,
      deductionChoice: "auto", // auto / standard / itemized
      savingsOverride: false,
      savingsOverrideAmount: 0,
      dividendChoice: "combine", // combine (8.5%抵減) / separate (28%分開)
      taxCredits: {
        prepaidTax: 0,
        repurchaseCredit: 0,
        otherCredit: 0,
      },
    };
    setData({ ...data, filings: [...data.filings, newFiling] });
    setSelectedId(newFiling.id);
  };

  const updateFiling = (next) => {
    setData({ ...data, filings: data.filings.map(f => f.id === next.id ? next : f) });
  };

  const deleteFiling = (id) => {
    if (!confirm("確定刪除此申報戶?")) return;
    setData({ ...data, filings: data.filings.filter(f => f.id !== id) });
    if (selectedId === id) setSelectedId(null);
  };

  const cloneFromLastYear = () => {
    // 找上一年度同名申報戶
    const prevYear = year - 1;
    const candidates = data.filings.filter(f => f.year === prevYear);
    if (candidates.length === 0) return alert(`找不到 ${prevYear} 年度的申報戶可複製`);
    const src = candidates[0];
    const newFiling = { ...src, id: uid(), year, name: src.name.replace(`${prevYear}年`, `${year}年`) || `${year}年度` };
    setData({ ...data, filings: [...data.filings, newFiling] });
    setSelectedId(newFiling.id);
  };

  return (
    <div className="fade-in">
      <PageHeader
        ornament={`§ TAX FILING · ${year} 年度試算`}
        title="申報戶與稅額試算"
        subtitle="每個申報戶獨立試算 · 系統自動比較標準/列舉扣除額,選擇較划算者"
        right={
          <div className="space-x-2">
            <button className="btn-secondary text-sm" onClick={cloneFromLastYear}>↻ 複製上年度</button>
            <button className="btn-primary text-sm" onClick={addFiling}
              disabled={data.members.length === 0}>+ 新增申報戶</button>
          </div>
        }
      />

      {yearFilings.length === 0 ? (
        <div className="card p-12 text-center" style={{ color: "var(--ink-mute)" }}>
          <div className="text-4xl mb-3">✎</div>
          <div className="font-serif text-lg mb-1">{year} 年度尚無申報戶</div>
          <div className="text-sm">
            {data.members.length === 0 ? "請先到「家庭成員」頁面建立成員" : "點右上角「新增申報戶」開始試算"}
          </div>
        </div>
      ) : (
        <div className="grid grid-cols-[260px_1fr] gap-5">
          {/* 申報戶清單 */}
          <div className="card overflow-hidden" style={{ alignSelf: "flex-start" }}>
            <div className="px-3 py-2 ornament" style={{ borderBottom: "1px solid var(--line)" }}>HOUSEHOLDS</div>
            {yearFilings.map(f => {
              const r = computeTaxForFiling(f, data.members, year);
              return (
                <button key={f.id} onClick={() => setSelectedId(f.id)}
                  className={`w-full text-left px-3 py-3 border-b ${selectedId === f.id ? "" : "hover:bg-gray-50"}`}
                  style={{ borderColor: "var(--line-soft)", background: selectedId === f.id ? "#fafaf6" : "white",
                    borderLeft: selectedId === f.id ? "3px solid var(--accent)" : "3px solid transparent" }}>
                  <div className="text-sm font-medium truncate">{f.name}</div>
                  <div className="text-xs num mt-1" style={{ color: "var(--ink-mute)" }}>應納 {fmt(r?.tax || 0)}</div>
                  <div className="flex gap-1 mt-1">
                    {r?.hasSpouse && <span className="chip text-[10px]">夫妻</span>}
                    {r?.useItemized && <span className="chip chip-green text-[10px]">列舉</span>}
                    {!r?.useItemized && <span className="chip chip-amber text-[10px]">標準</span>}
                  </div>
                </button>
              );
            })}
          </div>

          {/* 申報戶詳細 */}
          {selected && (
            <FilingDetail
              filing={selected}
              members={data.members}
              properties={data.properties}
              year={year}
              onChange={updateFiling}
              onDelete={() => deleteFiling(selected.id)}
            />
          )}
        </div>
      )}
    </div>
  );
}

function FilingDetail({ filing, members, properties, year, onChange, onDelete }) {
  // 把 properties 過濾出屬於這申報戶的人持有的
  const filerIds = [filing.taxpayerId, filing.spouseId, ...(filing.dependentIds || [])].filter(Boolean);
  const householdProperties = properties.filter(p => filerIds.includes(p.ownerId));
  const filingForCompute = { ...filing, properties: householdProperties };
  const result = computeTaxForFiling(filingForCompute, members, year);
  const params = TAX_PARAMS[year];

  const taxpayer = members.find(m => m.id === filing.taxpayerId);
  const spouse = members.find(m => m.id === filing.spouseId);

  const updateField = (path, value) => {
    const next = { ...filing };
    const parts = path.split(".");
    let obj = next;
    for (let i = 0; i < parts.length - 1; i++) {
      obj[parts[i]] = { ...obj[parts[i]] };
      obj = obj[parts[i]];
    }
    obj[parts[parts.length - 1]] = value;
    onChange(next);
  };

  const updateIncome = (memberId, key, value) => {
    const next = {
      ...filing,
      memberIncome: {
        ...filing.memberIncome,
        [memberId]: { ...(filing.memberIncome?.[memberId] || {}), [key]: value }
      }
    };
    onChange(next);
  };

  const toggleDependent = (id) => {
    const list = filing.dependentIds || [];
    const next = list.includes(id) ? list.filter(x => x !== id) : [...list, id];
    onChange({ ...filing, dependentIds: next });
  };

  if (!result) return null;

  return (
    <div className="space-y-5">
      {/* 標題列 */}
      <div className="card p-5">
        <div className="flex items-center gap-3 mb-3">
          <input
            className="font-serif text-2xl flex-1 px-2 py-1 border-b-2"
            style={{ borderColor: "var(--line)", background: "transparent" }}
            value={filing.name}
            onChange={e => onChange({ ...filing, name: e.target.value })}
          />
          <button className="btn-danger text-sm" onClick={onDelete}>刪除此申報戶</button>
        </div>

        {/* 申報戶成員選擇 */}
        <div className="grid grid-cols-3 gap-3">
          <Field label="主納稅義務人">
            <select className="input-text-plain w-full" value={filing.taxpayerId}
              onChange={e => onChange({ ...filing, taxpayerId: e.target.value })}>
              <option value="">— 請選擇 —</option>
              {members.map(m => {
                const r = RELATIONS[m.relation];
                return <option key={m.id} value={m.id}>{m.name} ({r?.label || m.relation})</option>;
              })}
            </select>
          </Field>
          <Field label="配偶 (合併申報)">
            <select className="input-text-plain w-full" value={filing.spouseId || ""}
              onChange={e => onChange({ ...filing, spouseId: e.target.value })}>
              <option value="">無 (單身申報)</option>
              {members.filter(m => m.id !== filing.taxpayerId).map(m => {
                const r = RELATIONS[m.relation];
                const isCandidate = r && r.canBeSpouse;
                return <option key={m.id} value={m.id}>
                  {isCandidate ? "★ " : ""}{m.name} ({r?.label || m.relation})
                </option>;
              })}
            </select>
          </Field>
          <Field label="扶養親屬數">
            <div className="input-text-plain w-full bg-gray-50">{(filing.dependentIds || []).length} 人</div>
          </Field>
        </div>

        {/* 扶養親屬勾選 */}
        <div className="mt-3">
          <div className="text-xs mb-2" style={{ color: "var(--ink-soft)" }}>勾選扶養親屬 (圓點顯示稅法限制):</div>
          <div className="flex flex-wrap gap-2">
            {members.filter(m => m.id !== filing.taxpayerId && m.id !== filing.spouseId).map(m => {
              const checked = (filing.dependentIds || []).includes(m.id);
              const r = RELATIONS[m.relation];
              const age = Number(m.age);
              // 判斷此人能否合法扶養
              let okHint = "✓";
              let okColor = "var(--green)";
              if (!r || !r.canBeDependent) { okHint = "✗"; okColor = "var(--red)"; }
              else if ((r.isChild || m.relation === "sibling") && age >= 20 && !m.isStudent && !m.isDisabled && !m.cannotSupportSelf) {
                okHint = "△"; okColor = "var(--gold)";
              } else if (r.isLinealAscendant && age < 60 && !m.cannotSupportSelf && !m.isDisabled) {
                okHint = "△"; okColor = "var(--gold)";
              } else if (m.relation === "other" && !m.coResident) {
                okHint = "△"; okColor = "var(--gold)";
              }
              return (
                <label key={m.id} className={`px-3 py-1.5 rounded cursor-pointer text-sm flex items-center gap-2 border`}
                  style={{ borderColor: checked ? "var(--accent)" : "var(--line)", background: checked ? "var(--accent-soft)" : "white" }}>
                  <input type="checkbox" checked={checked} onChange={() => toggleDependent(m.id)} />
                  <span style={{ color: okColor, fontWeight: 700 }}>{okHint}</span>
                  {m.name} <span className="text-xs" style={{ color: "var(--ink-mute)" }}>({r?.label})</span>
                </label>
              );
            })}
          </div>
        </div>
      </div>

      {/* 警告 / 提示面板 */}
      {result.warnings && result.warnings.length > 0 && (
        <div className="card p-4" style={{ background: "#fdfaf3", borderColor: "var(--gold)" }}>
          <div className="ornament mb-2" style={{ color: "#6b5418" }}>⚠ VALIDATION · 申報戶檢查</div>
          <div className="space-y-1.5 text-sm">
            {result.warnings.map((w, i) => (
              <div key={i} className="flex items-start gap-2">
                <span style={{
                  color: w.level === "error" ? "var(--red)" : (w.level === "warn" ? "var(--gold)" : "var(--ink-mute)"),
                  fontWeight: 700, minWidth: "1.5em"
                }}>
                  {w.level === "error" ? "✗" : (w.level === "warn" ? "⚠" : "ⓘ")}
                </span>
                <span style={{ color: "var(--ink-soft)" }}>{w.msg}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* 各成員所得輸入 */}
      <div className="card">
        <div className="px-5 py-3 ornament" style={{ borderBottom: "1px solid var(--line)" }}>
          ① INCOME · 各成員所得
        </div>
        <div className="p-5">
          <table className="w-full text-sm">
            <thead>
              <tr style={{ borderBottom: "1px solid var(--line)" }}>
                <th className="text-left py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>成員</th>
                <th className="text-right py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>薪資</th>
                <th className="text-right py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>利息</th>
                <th className="text-right py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>股利</th>
                <th className="text-right py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>租金 (自動)</th>
                <th className="text-right py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>其他</th>
              </tr>
            </thead>
            <tbody>
              {result.filers.map(m => {
                const income = filing.memberIncome?.[m.id] || {};
                const myProps = householdProperties.filter(p => p.ownerId === m.id);
                const myRental = computeRentalIncome(myProps, params);
                return (
                  <tr key={m.id} className="table-row">
                    <td className="py-2 font-medium">
                      {m.name}
                      <div className="text-xs" style={{ color: "var(--ink-mute)" }}>
                        {m.id === filing.taxpayerId ? "本人" : (m.id === filing.spouseId ? "配偶" : "扶養")}
                      </div>
                    </td>
                    <td className="py-2 text-right">
                      <input type="number" className="input-text w-28 text-right"
                        value={income.salary || ""} onChange={e => updateIncome(m.id, "salary", e.target.value)} />
                    </td>
                    <td className="py-2 text-right">
                      <input type="number" className="input-text w-24 text-right"
                        value={income.interest || ""} onChange={e => updateIncome(m.id, "interest", e.target.value)} />
                    </td>
                    <td className="py-2 text-right">
                      <input type="number" className="input-text w-24 text-right"
                        value={income.dividend || ""} onChange={e => updateIncome(m.id, "dividend", e.target.value)} />
                    </td>
                    <td className="py-2 text-right num text-xs" title={myProps.map(p => p.name).join(", ")}>
                      {fmt(myRental.taxable)}
                      {myProps.length > 0 && <div className="text-[10px]" style={{ color: "var(--ink-mute)" }}>{myProps.length} 物件</div>}
                    </td>
                    <td className="py-2 text-right">
                      <input type="number" className="input-text w-24 text-right"
                        value={income.other || ""} onChange={e => updateIncome(m.id, "other", e.target.value)} />
                    </td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              <tr className="divider-double" style={{ background: "#fafaf6" }}>
                <td className="py-3 font-medium">總計</td>
                <td className="py-3 text-right num font-medium">{fmt(result.salaryGross)}</td>
                <td className="py-3 text-right num font-medium">{fmt(result.interest)}</td>
                <td className="py-3 text-right num font-medium">{fmt(result.dividend)}</td>
                <td className="py-3 text-right num font-medium">{fmt(result.rentalTaxable)}</td>
                <td className="py-3 text-right num font-medium">{fmt(result.otherIncome)}</td>
              </tr>
            </tfoot>
          </table>

          {/* 儲蓄投資特別扣除額提示 */}
          <div className="mt-4 p-3 rounded" style={{ background: "#fafaf6", border: "1px solid var(--line)" }}>
            <div className="flex items-start justify-between gap-3">
              <div className="flex-1">
                <div className="text-xs font-medium mb-1" style={{ color: "var(--ink-soft)" }}>
                  ⓘ 儲蓄投資特別扣除額 (從利息自動計算)
                </div>
                <div className="text-xs" style={{ color: "var(--ink-mute)" }}>
                  系統自動套用 = min(全戶利息, {fmt(params.savingsDeduction)})。
                  <br />
                  ⚠ 若你的利息包含郵局存簿、公債、公司債、金融債券、短期票券等<b>不適用</b>項目,請勾選下方覆寫。
                </div>
                {filing.savingsOverride ? (
                  <div className="flex items-center gap-2 mt-2">
                    <span className="text-xs">手動指定金額:</span>
                    <input type="number" className="input-text w-32 text-right"
                      value={filing.savingsOverrideAmount || 0}
                      onChange={e => onChange({ ...filing, savingsOverrideAmount: Number(e.target.value) || 0 })} />
                    <span className="text-xs" style={{ color: "var(--ink-mute)" }}>
                      上限 {fmt(params.savingsDeduction)}
                    </span>
                  </div>
                ) : null}
              </div>
              <div className="text-right">
                <div className="text-xs" style={{ color: "var(--ink-mute)" }}>實際採用</div>
                <div className="font-serif text-2xl num" style={{ color: "var(--accent-deep)" }}>
                  {fmt(result.savings)}
                </div>
                {filing.savingsOverride && result.savings !== result.savingsAuto && (
                  <div className="text-xs" style={{ color: "var(--gold)" }}>
                    (覆寫,自動值 {fmt(result.savingsAuto)})
                  </div>
                )}
              </div>
            </div>
            <label className="flex items-center gap-2 mt-3 cursor-pointer text-xs">
              <input type="checkbox"
                checked={!!filing.savingsOverride}
                onChange={e => onChange({ ...filing, savingsOverride: e.target.checked })} />
              <span>手動覆寫儲蓄投資扣除額 (排除不適用利息)</span>
            </label>
          </div>
        </div>
      </div>

      {/* 列舉扣除額輸入 */}
      <div className="card">
        <div className="px-5 py-3 flex items-center justify-between" style={{ borderBottom: "1px solid var(--line)" }}>
          <div className="ornament">② DEDUCTIONS · 一般扣除額</div>
          <div className="flex gap-1">
            {["auto", "standard", "itemized"].map(c => (
              <button key={c} onClick={() => onChange({ ...filing, deductionChoice: c })}
                className={`px-3 py-1 text-xs rounded border ${filing.deductionChoice === c ? "" : ""}`}
                style={{
                  background: filing.deductionChoice === c ? "var(--ink)" : "white",
                  color: filing.deductionChoice === c ? "white" : "var(--ink-soft)",
                  borderColor: filing.deductionChoice === c ? "var(--ink)" : "var(--line)",
                }}>
                {c === "auto" ? "自動選最划算" : c === "standard" ? "強制標準" : "強制列舉"}
              </button>
            ))}
          </div>
        </div>
        <div className="p-5">
          <div className="grid grid-cols-2 gap-4 mb-4">
            <DeductionInput
              label="一般捐贈" hint={`上限 = 綜合所得 20% = ${fmt(result.grossIncome * 0.2)}`}
              value={filing.itemizedDeductions.donationGeneral}
              onChange={v => updateField("itemizedDeductions.donationGeneral", v)} />
            <DeductionInput
              label="不限額捐贈" hint="政府/國防/勞軍/古蹟修復等,不限額"
              value={filing.itemizedDeductions.donationUnlimited}
              onChange={v => updateField("itemizedDeductions.donationUnlimited", v)} />
            <DeductionInput
              label="人身保險費" hint={`每人上限 24,000 × ${result.filers.length}人 = ${fmt(params.insuranceLimit * result.filers.length)}`}
              value={filing.itemizedDeductions.insurancePersonal}
              onChange={v => updateField("itemizedDeductions.insurancePersonal", v)} />
            <DeductionInput
              label="全民健保費" hint="不限額 (含補充保費)"
              value={filing.itemizedDeductions.insuranceHealth}
              onChange={v => updateField("itemizedDeductions.insuranceHealth", v)} />
            <DeductionInput
              label="醫藥及生育費" hint="不限額,須附醫療院所收據"
              value={filing.itemizedDeductions.medical}
              onChange={v => updateField("itemizedDeductions.medical", v)} />
            <DeductionInput
              label="災害損失" hint="不可抗力災害,需 30 日內報國稅局"
              value={filing.itemizedDeductions.disaster}
              onChange={v => updateField("itemizedDeductions.disaster", v)} />
            <DeductionInput
              label="自用住宅購屋借款利息"
              hint={`一屋為限,實際扣除 = 利息 − 儲蓄利息 (上限 ${fmt(params.mortgageLimit)})`}
              value={filing.itemizedDeductions.mortgageInterest}
              onChange={v => updateField("itemizedDeductions.mortgageInterest", v)} />
            <DeductionInput
              label="自住房屋租金支出"
              hint={`特扣 (114起改特扣,上限 ${fmt(params.rentDeduction)}),稅率20%以上不得扣`}
              value={filing.rentSupportPaid}
              onChange={v => onChange({ ...filing, rentSupportPaid: v })} />
          </div>

          {/* 標準 vs 列舉即時對比 */}
          <div className="grid grid-cols-2 gap-3 mt-4">
            <div className="p-3 rounded" style={{
              background: result.useItemized ? "white" : "var(--green-soft)",
              border: result.useItemized ? "1px solid var(--line)" : "2px solid var(--green)"
            }}>
              <div className="text-xs font-medium mb-1">標準扣除額 {!result.useItemized && "✓ 採用"}</div>
              <div className="num font-serif text-xl">{fmt(result.standardDeduction)}</div>
              <div className="text-xs" style={{ color: "var(--ink-mute)" }}>
                {result.hasSpouse ? "夫妻合併 262,000" : "單身 131,000"}
              </div>
            </div>
            <div className="p-3 rounded" style={{
              background: result.useItemized ? "var(--green-soft)" : "white",
              border: result.useItemized ? "2px solid var(--green)" : "1px solid var(--line)"
            }}>
              <div className="text-xs font-medium mb-1">列舉扣除額 {result.useItemized && "✓ 採用"}</div>
              <div className="num font-serif text-xl">{fmt(result.itemizedTotal)}</div>
              <div className="text-xs" style={{ color: "var(--ink-mute)" }}>
                {result.itemizedTotal > result.standardDeduction
                  ? `比標準多 ${fmt(result.itemizedTotal - result.standardDeduction)}`
                  : `比標準少 ${fmt(result.standardDeduction - result.itemizedTotal)}`}
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* ③ 抵減與已扣繳 */}
      <div className="card">
        <div className="px-5 py-3 ornament" style={{ borderBottom: "1px solid var(--line)" }}>
          ③ CREDITS · 稅額抵減與已扣繳
        </div>
        <div className="p-5 space-y-4">
          {/* 股利課稅方式 */}
          <div>
            <div className="text-xs font-medium mb-2" style={{ color: "var(--ink-soft)" }}>股利所得課稅方式 (二擇一)</div>
            <div className="grid grid-cols-2 gap-3">
              <label className={`p-3 rounded cursor-pointer border ${(filing.dividendChoice || "combine") === "combine" ? "border-2" : ""}`}
                style={{ borderColor: (filing.dividendChoice || "combine") === "combine" ? "var(--accent)" : "var(--line)", background: (filing.dividendChoice || "combine") === "combine" ? "#fafaf6" : "white" }}>
                <input type="radio" name="divChoice" value="combine"
                  checked={(filing.dividendChoice || "combine") === "combine"}
                  onChange={() => onChange({ ...filing, dividendChoice: "combine" })} className="mr-2"/>
                <span className="text-sm font-medium">合併計稅,可抵減</span>
                <div className="text-xs mt-1 ml-5" style={{ color: "var(--ink-mute)" }}>
                  股利併入綜所;可用「股利 × 8.5%」抵減稅額,上限 80,000 / 戶
                </div>
                <div className="text-xs ml-5 mt-1 num" style={{ color: "var(--accent-deep)" }}>
                  本戶可抵減: {fmt(Math.min(Math.round(result.dividend * 0.085), 80000))}
                </div>
              </label>
              <label className={`p-3 rounded cursor-pointer border ${filing.dividendChoice === "separate" ? "border-2" : ""}`}
                style={{ borderColor: filing.dividendChoice === "separate" ? "var(--accent)" : "var(--line)", background: filing.dividendChoice === "separate" ? "#fafaf6" : "white" }}>
                <input type="radio" name="divChoice" value="separate"
                  checked={filing.dividendChoice === "separate"}
                  onChange={() => onChange({ ...filing, dividendChoice: "separate" })} className="mr-2"/>
                <span className="text-sm font-medium">分開計稅 28%</span>
                <div className="text-xs mt-1 ml-5" style={{ color: "var(--ink-mute)" }}>
                  股利單獨用 28% 課稅 (適用高所得者,稅率 30%+ 時)
                </div>
                <div className="text-xs ml-5 mt-1 num" style={{ color: "var(--ink-mute)" }}>
                  分離稅額: {fmt(Math.round(result.dividend * 0.28))}
                </div>
              </label>
            </div>
          </div>

          {/* 其他抵減 */}
          <div className="grid grid-cols-3 gap-3">
            <div>
              <label className="block text-xs mb-1" style={{ color: "var(--ink-soft)" }}>已預扣繳稅額</label>
              <input type="number" className="input-text w-full text-right"
                value={filing.taxCredits?.prepaidTax || ""}
                onChange={e => onChange({ ...filing, taxCredits: { ...filing.taxCredits, prepaidTax: Number(e.target.value) || 0 } })} />
              <div className="text-xs mt-1" style={{ color: "var(--ink-mute)" }}>
                薪資/利息/租賃等扣繳憑單上的「扣繳稅額」合計
              </div>
            </div>
            <div>
              <label className="block text-xs mb-1" style={{ color: "var(--ink-soft)" }}>重購自用住宅退稅</label>
              <input type="number" className="input-text w-full text-right"
                value={filing.taxCredits?.repurchaseCredit || ""}
                onChange={e => onChange({ ...filing, taxCredits: { ...filing.taxCredits, repurchaseCredit: Number(e.target.value) || 0 } })} />
              <div className="text-xs mt-1" style={{ color: "var(--ink-mute)" }}>
                2 年內重購自宅可申請的退稅
              </div>
            </div>
            <div>
              <label className="block text-xs mb-1" style={{ color: "var(--ink-soft)" }}>其他扣抵</label>
              <input type="number" className="input-text w-full text-right"
                value={filing.taxCredits?.otherCredit || ""}
                onChange={e => onChange({ ...filing, taxCredits: { ...filing.taxCredits, otherCredit: Number(e.target.value) || 0 } })} />
              <div className="text-xs mt-1" style={{ color: "var(--ink-mute)" }}>
                投資抵減、大陸地區已納稅額等
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* 試算結果 */}
      <ResultPanel result={result} year={year} />

      {/* 物件列表 (參考) */}
      {householdProperties.length > 0 && (
        <div className="card">
          <div className="px-5 py-3 ornament" style={{ borderBottom: "1px solid var(--line)" }}>
            ⑤ RENTAL PROPERTIES IN HOUSEHOLD · 本戶租賃所得明細
          </div>
          <table className="w-full text-sm">
            <thead style={{ background: "#fafaf6", borderBottom: "1px solid var(--line)" }}>
              <tr>
                <th className="text-left px-5 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>物件</th>
                <th className="text-left px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>屋主</th>
                <th className="text-left px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>類型</th>
                <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>年收入</th>
                <th className="text-right px-5 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>應稅所得</th>
              </tr>
            </thead>
            <tbody>
              {householdProperties.map(p => {
                const owner = members.find(m => m.id === p.ownerId);
                const r = computeRentalIncome([p], params).breakdown[0];
                return (
                  <tr key={p.id} className="table-row">
                    <td className="px-5 py-2">{p.name}</td>
                    <td className="px-3 py-2">{owner?.name}</td>
                    <td className="px-3 py-2 text-xs">{r.note}</td>
                    <td className="px-3 py-2 text-right num">{fmt(r.gross)}</td>
                    <td className="px-5 py-2 text-right num font-medium">{fmt(r.taxableIncome)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function DeductionInput({ label, hint, value, onChange }) {

function ResultPanel({ result, year }) {
  if (!result) return null;
  return (
    <div className="card" style={{ background: "#fdfcf7", borderColor: "var(--accent)" }}>
      <div className="px-5 py-3 ornament" style={{ borderBottom: "1px solid var(--line)", color: "var(--accent-deep)" }}>
        ④ RESULT · 稅額試算結果
      </div>
      <div className="p-5">
        <div className="grid grid-cols-2 gap-6">
          {/* 計算明細 */}
          <div className="space-y-1 text-sm">
            <Row label="薪資所得" v={result.salaryGross} />
            <Row label="利息所得" v={result.interest} />
            <Row label="股利所得" v={result.dividend} />
            <Row label="租賃所得 (應稅)" v={result.rentalTaxable} />
            <Row label="其他所得" v={result.otherIncome} />
            <Row label="綜合所得總額" v={result.grossIncome} bold border />
            <Row label="− 免稅額" v={-result.exemption} muted />
            <Row label={`− 一般扣除額 (${result.useItemized ? "列舉" : "標準"})`} v={-result.generalDeduction} muted />
            <Row label="− 薪資特扣" v={-result.salarySD} muted />
            <Row label={`− 儲蓄投資特扣${result.savings !== result.savingsAuto ? " (手動)" : ""}`} v={-result.savings} muted />
            {result.disabilityDed > 0 && <Row label="− 身心障礙特扣" v={-result.disabilityDed} muted />}
            {result.educationDed > 0 && <Row label="− 教育學費特扣" v={-result.educationDed} muted />}
            {result.preschoolDed > 0 && <Row label="− 幼兒學前特扣" v={-result.preschoolDed} muted />}
            {result.longTermCareDed > 0 && <Row label="− 長期照顧特扣" v={-result.longTermCareDed} muted />}
            {result.rentDeductActual > 0 && <Row label="− 房租支出特扣" v={-result.rentDeductActual} muted />}
            {result.blDiff > 0 && <Row label="− 基本生活費差額" v={-result.blDiff} muted />}
            <Row label="綜合所得淨額" v={result.netIncome} bold border />
            <Row label={`適用稅率 ${(result.taxRate * 100).toFixed(0)}%`} v={Math.round(result.netIncome * result.taxRate)} muted />
            <Row label="− 累進差額" v={-result.taxDeductValue} muted />
            <Row label="綜合所得稅額" v={result.tax} bold border />
            {result.dividendSeparateTax > 0 && <Row label={`+ 股利分開計稅 28%`} v={result.dividendSeparateTax} muted />}
            {result.dividendCredit > 0 && <Row label="− 股利可抵減稅額 (8.5%)" v={-result.dividendCredit} muted />}
            {result.repurchaseCredit > 0 && <Row label="− 重購自用住宅退稅" v={-result.repurchaseCredit} muted />}
            {result.otherCredit > 0 && <Row label="− 其他抵減稅額" v={-result.otherCredit} muted />}
            {(result.dividendCredit > 0 || result.repurchaseCredit > 0 || result.otherCredit > 0 || result.dividendSeparateTax > 0) &&
              <Row label="抵減後稅額" v={result.taxAfterCredits} bold border />}
            {result.prepaidTax > 0 && <Row label="− 已預扣繳稅額" v={-result.prepaidTax} muted />}
          </div>

          {/* 主數字 */}
          <div className="flex flex-col justify-between">
            <div>
              <div className="text-center p-6 rounded mb-4" style={{
                background: result.finalDue >= 0 ? "var(--ink)" : "var(--green)",
                color: "white"
              }}>
                <div className="ornament" style={{ color: "#a8a293" }}>
                  YEAR {year} {result.finalDue >= 0 ? "TAX TO PAY" : "TAX REFUND"}
                </div>
                <div className="font-serif text-5xl num mt-2">{fmt(Math.abs(result.finalDue))}</div>
                <div className="text-xs mt-2" style={{ color: "#a8a293" }}>
                  {result.finalDue >= 0 ? "應補繳稅額" : "可退稅"} (新臺幣 元)
                </div>
              </div>

              {/* 稅額構成展開 */}
              <div className="p-3 rounded mb-3" style={{ background: "#fafaf6", border: "1px solid var(--line)" }}>
                <div className="ornament mb-2">TAX BREAKDOWN · 稅額構成</div>
                <div className="space-y-1 text-xs">
                  <div className="flex justify-between"><span>綜所稅額</span><span className="num">{fmt(result.tax)}</span></div>
                  {result.totalCreditsBeforePrepaid > 0 && (
                    <div className="flex justify-between" style={{ color: "var(--green)" }}>
                      <span>− 抵減合計</span><span className="num">{fmt(result.totalCreditsBeforePrepaid)}</span>
                    </div>
                  )}
                  {result.prepaidTax > 0 && (
                    <div className="flex justify-between" style={{ color: "var(--green)" }}>
                      <span>− 已預扣繳</span><span className="num">{fmt(result.prepaidTax)}</span>
                    </div>
                  )}
                  <div className="flex justify-between border-t pt-1 mt-1 font-medium" style={{ borderColor: "var(--line)" }}>
                    <span>{result.finalDue >= 0 ? "應補繳" : "應退稅"}</span>
                    <span className="num">{fmt(Math.abs(result.finalDue))}</span>
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div className="p-3 rounded text-center" style={{ background: "white", border: "1px solid var(--line)" }}>
                  <div className="text-xs" style={{ color: "var(--ink-mute)" }}>實際稅率</div>
                  <div className="font-serif text-xl num">
                    {result.grossIncome > 0 ? (result.tax / result.grossIncome * 100).toFixed(2) : "0.00"}%
                  </div>
                </div>
                <div className="p-3 rounded text-center" style={{ background: "white", border: "1px solid var(--line)" }}>
                  <div className="text-xs" style={{ color: "var(--ink-mute)" }}>邊際稅率</div>
                  <div className="font-serif text-xl num">{(result.taxRate * 100).toFixed(0)}%</div>
                </div>
              </div>
            </div>

            {/* 標準 vs 列舉節省 */}
            {result.saving > 0 && (
              <div className="mt-4 p-3 rounded" style={{ background: "var(--green-soft)", border: "1px solid var(--green)" }}>
                <div className="text-xs font-medium" style={{ color: "#3d5235" }}>
                  ✓ 採用「{result.useItemized ? "列舉" : "標準"}扣除額」比另一選項省了
                </div>
                <div className="num font-serif text-2xl" style={{ color: "#3d5235" }}>{fmt(result.saving)}</div>
              </div>
            )}
            {result.saving === 0 && (
              <div className="mt-4 p-3 rounded text-xs text-center" style={{ background: "#fafaf6", color: "var(--ink-mute)" }}>
                標準扣除額與列舉扣除額試算結果相同
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function Row({ label, v, bold, muted, border }) {
  return (
    <div className={`flex justify-between py-1 ${border ? "border-t pt-2" : ""}`}
      style={{ borderColor: "var(--line)", fontWeight: bold ? 600 : 400, color: muted ? "var(--ink-soft)" : "var(--ink)" }}>
      <span className="text-xs">{label}</span>
      <span className="num">{fmt(v)}</span>
    </div>
  );
}

            <thead>

                <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>綜合所得</th>
                <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>標準</th>
                <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>列舉</th>
                <th className="text-center px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>推薦</th>
                <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>採推薦稅額</th>
                <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>採另一稅額</th>
                <th className="text-right px-5 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>節省</th>
              </tr>
            </thead>
            <tbody>
              {yearFilings.map(f => {
                const filerIds = [f.taxpayerId, f.spouseId, ...(f.dependentIds || [])].filter(Boolean);
                const householdProps = data.properties.filter(p => filerIds.includes(p.ownerId));
                const filingForCompute = { ...f, properties: householdProps };
                const result = computeTaxForFiling(filingForCompute, data.members, year);
                if (!result) return null;
                const recommended = result.itemizedTotal > result.standardDeduction ? "itemized" : "standard";
                return (
                  <tr key={f.id} className="table-row">
                    <td className="px-5 py-3 font-medium">{f.name}</td>
                    <td className="px-3 py-3 text-right num">{fmt(result.grossIncome)}</td>
                    <td className="px-3 py-3 text-right num">{fmt(result.standardDeduction)}</td>
                    <td className="px-3 py-3 text-right num">{fmt(result.itemizedTotal)}</td>
                    <td className="px-3 py-3 text-center">
                      <span className={`chip ${recommended === "itemized" ? "chip-green" : "chip-amber"}`}>
                        {recommended === "itemized" ? "列舉" : "標準"}
                      </span>
                    </td>
                    <td className="px-3 py-3 text-right num font-medium">{fmt(Math.min(result.tax, result.altTax))}</td>
                    <td className="px-3 py-3 text-right num" style={{ color: "var(--ink-mute)" }}>{fmt(Math.max(result.tax, result.altTax))}</td>
                    <td className="px-5 py-3 text-right num font-medium" style={{ color: "var(--green)" }}>
                      {fmt(Math.abs(result.tax - result.altTax))}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function HistoryPage({ data }) {
  // 以成員為主軸,看每個人歷年參與的申報戶與稅額分攤
  const memberHistory = data.members.map(m => {
    const records = [];
    AVAILABLE_YEARS.forEach(y => {
      const filings = data.filings.filter(f =>
        f.year === y &&
        (f.taxpayerId === m.id || f.spouseId === m.id || (f.dependentIds || []).includes(m.id))
      );
      filings.forEach(f => {
        const filerIds = [f.taxpayerId, f.spouseId, ...(f.dependentIds || [])].filter(Boolean);
        const householdProps = data.properties.filter(p => filerIds.includes(p.ownerId));
        const result = computeTaxForFiling({ ...f, properties: householdProps }, data.members, y);
        if (!result) return;
        const income = f.memberIncome?.[m.id] || {};
        const role = f.taxpayerId === m.id ? "本人" : (f.spouseId === m.id ? "配偶" : "扶養");
        records.push({
          year: y, role, filingName: f.name,
          salary: toNum(income.salary), interest: toNum(income.interest),
          dividend: toNum(income.dividend), other: toNum(income.other),
          householdTax: result.tax,
        });
      });
    });
    return { member: m, records };
  });

  return (
    <div className="fade-in">
      <PageHeader
        ornament="§ HISTORICAL RECORDS · 歷年紀錄"
        title="每位成員的歷史申報"
        subtitle="按成員整理,可看出個人歷年所得變化與所屬申報戶稅額"
      />

      {memberHistory.filter(h => h.records.length > 0).length === 0 && (
        <div className="card p-12 text-center" style={{ color: "var(--ink-mute)" }}>尚無歷史紀錄</div>
      )}

      {memberHistory.map(({ member, records }) => {
        if (records.length === 0) return null;
        return (
          <div key={member.id} className="card mb-5">
            <div className="px-5 py-3 flex items-center justify-between" style={{ borderBottom: "1px solid var(--line)" }}>
              <div>
                <div className="font-serif text-lg">{member.name}</div>
                <div className="text-xs" style={{ color: "var(--ink-mute)" }}>共 {records.length} 筆紀錄</div>
              </div>
              <div className="text-right text-xs" style={{ color: "var(--ink-mute)" }}>
                <div>累計薪資</div>
                <div className="num font-serif text-base" style={{ color: "var(--ink)" }}>
                  {fmt(records.reduce((s, r) => s + r.salary, 0))}
                </div>
              </div>
            </div>
            <table className="w-full text-sm">
              <thead>
                <tr style={{ background: "#fafaf6", borderBottom: "1px solid var(--line)" }}>
                  <th className="text-left px-5 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>年度</th>
                  <th className="text-left px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>申報戶</th>
                  <th className="text-left px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>身分</th>
                  <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>薪資</th>
                  <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>利息</th>
                  <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>股利</th>
                  <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>其他</th>
                  <th className="text-right px-5 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>戶總稅額</th>
                </tr>
              </thead>
              <tbody>
                {records.map((r, i) => (
                  <tr key={i} className="table-row">
                    <td className="px-5 py-2 font-serif">{r.year}</td>
                    <td className="px-3 py-2">{r.filingName}</td>
                    <td className="px-3 py-2"><span className="chip">{r.role}</span></td>
                    <td className="px-3 py-2 text-right num">{fmt(r.salary)}</td>
                    <td className="px-3 py-2 text-right num">{fmt(r.interest)}</td>
                    <td className="px-3 py-2 text-right num">{fmt(r.dividend)}</td>
                    <td className="px-3 py-2 text-right num">{fmt(r.other)}</td>
                    <td className="px-5 py-2 text-right num font-medium">{fmt(r.householdTax)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      })}
    </div>
  );
}

// ============================================================
// 資料管理 (匯入/匯出)
// ============================================================
function DataPage({ data, setData }) {
  const fileRef = useRef(null);

  const exportJson = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `家庭綜所稅備份_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const importJson = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const obj = JSON.parse(ev.target.result);
        if (!obj.members || !obj.filings) throw new Error("檔案格式不正確");
        if (!confirm(`確定要匯入此檔案?\n成員: ${obj.members.length}, 申報戶: ${obj.filings.length}, 物件: ${obj.properties?.length || 0}\n\n這會覆蓋現有所有資料。`)) return;
        setData({ ...SAMPLE_DATA, ...obj });
        alert("匯入成功!");
      } catch (err) {
        alert("匯入失敗: " + err.message);
      }
    };
    reader.readAsText(file);
  };

  const clearAll = () => {
    if (!confirm("確定清空所有資料?無法復原!")) return;
    if (!confirm("再次確認:這會刪除所有成員、物件、申報資料")) return;
    setData(SAMPLE_DATA);
  };

  const loadSample = () => {
    if (data.members.length > 0 && !confirm("這會覆蓋現有資料,確定?")) return;
    setData(SAMPLE_FAMILY);
  };

  return (
    <div className="fade-in">
      <PageHeader
        ornament="§ DATA MANAGEMENT · 資料管理"
        title="備份、還原與匯出"
        subtitle="所有資料儲存在你的瀏覽器本機,匯出 JSON 檔可備份或跨裝置使用"
      />

      <div className="grid grid-cols-2 gap-5">
        <div className="card p-5">
          <div className="ornament mb-2">EXPORT · 匯出備份</div>
          <h3 className="font-serif text-lg mb-3">下載 JSON 備份檔</h3>
          <p className="text-sm mb-4" style={{ color: "var(--ink-soft)" }}>
            將所有家庭成員、租賃物件、歷年申報資料匯出為單一 JSON 檔。建議每次更新後備份一次。
          </p>
          <button className="btn-primary w-full" onClick={exportJson}>↓ 匯出所有資料</button>
          <div className="text-xs mt-3 num" style={{ color: "var(--ink-mute)" }}>
            最後儲存: {data.meta.lastSavedAt ? new Date(data.meta.lastSavedAt).toLocaleString("zh-TW") : "—"}
          </div>
        </div>

        <div className="card p-5">
          <div className="ornament mb-2">IMPORT · 匯入備份</div>
          <h3 className="font-serif text-lg mb-3">從 JSON 檔還原</h3>
          <p className="text-sm mb-4" style={{ color: "var(--ink-soft)" }}>
            上傳先前匯出的 JSON 備份檔。<span style={{ color: "var(--red)" }}>注意:會覆蓋現有所有資料。</span>
          </p>
          <input type="file" accept=".json" ref={fileRef} onChange={importJson} className="hidden" />
          <button className="btn-secondary w-full" onClick={() => fileRef.current?.click()}>↑ 選擇 JSON 檔匯入</button>
        </div>

        <div className="card p-5">
          <div className="ornament mb-2">SAMPLE · 範例資料</div>
          <h3 className="font-serif text-lg mb-3">載入範例家庭</h3>
          <p className="text-sm mb-4" style={{ color: "var(--ink-soft)" }}>
            載入一個七人家庭範例 (夫妻+子女+祖父母+單身手足),含多種租賃情境,快速體驗系統。
          </p>
          <button className="btn-secondary w-full" onClick={loadSample}>★ 載入範例家庭</button>

// ============================================================
// 主 App
// ============================================================
function App() {
  const [page, setPage] = useState("dashboard");
  const [year, setYear] = useState(DEFAULT_YEAR);
  const [data, setData] = useState(() => loadData());

  useEffect(() => { saveData(data); }, [data]);

  const props = { data, setData, year, setPage };

  return (
    <div className="flex min-h-screen">
      <Sidebar current={page} onNav={setPage} year={year} onYearChange={setYear} data={data} />
      <main className="flex-1 overflow-y-auto" style={{ background: "var(--bg)" }}>
        <div className="p-8 max-w-[1400px] mx-auto">
          {page === "dashboard" && <Dashboard {...props} />}
          {page === "members" && <MembersPage {...props} />}
          {page === "properties" && <PropertiesPage {...props} />}
          {page === "filing" && <FilingPage {...props} />}
          {page === "compare" && <ComparePage {...props} />}
          {page === "history" && <HistoryPage {...props} />}
          {page === "data" && <DataPage {...props} />}
          {page === "help" && <HelpPage {...props} />}
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
