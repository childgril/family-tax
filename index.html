              // 顯示全部物件,按「有合約優先,沒合約在下」+ 序號排序
              const sortedProps = [...householdProperties].sort((a, b) => {
                const aggA = aggregateContractsForYear(contracts, a.id, year, filing.manualRentOverrides);
                const aggB = aggregateContractsForYear(contracts, b.id, year, filing.manualRentOverrides);
                if (aggA.anyContractInYear !== aggB.anyContractInYear) {
                  return aggA.anyContractInYear ? -1 : 1;
                }
                return String(a.serial || "").localeCompare(String(b.serial || ""), "zh-Hant", { numeric: true });
              });

              return sortedProps.map(p => {
              const owner = members.find(m => m.id === p.ownerId);
              const agg = aggregateContractsForYear(contracts, p.id, year, filing.manualRentOverrides);
              const computables = getComputablesForProperty(p, year, contracts, rentalRecords, filing.manualRentOverrides);
              const taxableTotal = computeRentalIncome(computables, params).taxable;
              const overrideKey = `${p.id}_${year}`;
              const override = (filing.manualRentOverrides || {})[overrideKey];
              const isIncluded = override?.includeInFiling === true;  // 預設 false,需主動勾選
              const hasContracts = agg.anyContractInYear;

              // 「採用中」: 有合約計入 OR 沒合約但 taxableTotal > 0 (手動覆寫的)
              const hasManualWithoutContract = !hasContracts && taxableTotal > 0;
              const isActive = (hasContracts && isIncluded) || hasManualWithoutContract;

              // 預設展開:採用中就展開;但若使用者按了「全部收合/展開」則 force
              const defaultOpen = isActive;
              const isOpen = rentalForceState === null ? defaultOpen : rentalForceState;

              // 算去年同物件的應稅租金 (作參考) — 直接用合約自動算,不參考去年的手動覆寫
              const lastYear = year - 1;
              const lastYearComputables = getComputablesForProperty(p, lastYear, contracts, rentalRecords, {});
              const lastYearTaxable = computeRentalIncome(lastYearComputables, params).taxable;
              const lastYearAgg = aggregateContractsForYear(contracts, p.id, lastYear, {});

              return (
                <details key={`${p.id}_${rentalExpandKey}`} className="rounded" open={isOpen} style={{ background: isActive ? "white" : "#fafaf6", border: "1px solid var(--line)" }}>
                  <summary className="px-3 py-2 flex items-center gap-3 cursor-pointer rounded-t" style={{
                    background: isActive ? "var(--green-soft, #f5fbef)" : "transparent",
                    borderBottom: isActive ? "1px solid var(--green)" : "none",
                  }}>
                    <span className="chevron text-xs" style={{ color: "var(--ink-mute)" }}>▸</span>
                    <input type="checkbox" checked={isIncluded}
                      onChange={e => {
                        e.stopPropagation();
                        updateRentOverride(p.id, { includeInFiling: e.target.checked });
                      }}
                      onClick={e => e.stopPropagation()}
                      title={hasContracts ? "勾選 = 此物件計入本年度申報" : "勾選 = 此物件計入本年度申報 (即使沒合約,可在展開後手動補列租金)"}
                    />
                    <div className="flex-1">
                      <div className="flex items-baseline gap-2">
                        <span className="font-serif text-base font-medium">{p.address || p.name}</span>
                        {p.assetType === "land" && (
                          <span className="chip text-[10px]" style={{ background: "#e8e2d5", color: "var(--ink)" }}>🌳 土地</span>
                        )}
                      </div>
                      <div className="text-xs mt-0.5" style={{ color: "var(--ink-mute)" }}>
                        {owner?.name}{p.name && p.name !== p.address ? ` · ${p.name}` : ""}
                        {p.assetType === "land" && toNum(p.landTax || 0) > 0 && ` · 地價稅 ${fmt(toNum(p.landTax))}`}
                        {!hasContracts && " · 本年度無合約"}
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      {agg.hasMixedType && <span className="chip chip-amber text-[10px]">公益+一般</span>}
                      {override && <span className="chip chip-accent text-[10px]">手動覆寫</span>}
                    </div>
                    {/* 去年同物件參考 */}
                    {lastYearAgg.anyContractInYear && (
                      <div className="text-right pr-3" style={{ borderRight: "1px solid var(--line-soft)" }}>
                        <div className="text-[10px]" style={{ color: "var(--ink-mute)" }}>{lastYear} 年應稅</div>
                        <div className="font-serif num text-sm" style={{ color: "var(--ink-soft)" }}>
                          {fmt(lastYearTaxable)}
                        </div>
                      </div>
                    )}
                    <div className="text-right">
                      <div className="text-xs" style={{ color: "var(--ink-mute)" }}>{year} 年應稅</div>
                      <div className="font-serif num text-base">
                        {isIncluded ? fmt(taxableTotal) : <span style={{ color: "var(--ink-mute)" }}>不計入</span>}
                      </div>
                      {lastYearAgg.anyContractInYear && isIncluded && (
                        <div className="text-[10px]" style={{
                          color: taxableTotal > lastYearTaxable ? "var(--accent-deep)" :
                                 taxableTotal < lastYearTaxable ? "var(--green)" : "var(--ink-mute)"
                        }}>
                          {taxableTotal === lastYearTaxable ? "持平" :
                           taxableTotal > lastYearTaxable ? `↑ +${fmt(taxableTotal - lastYearTaxable)}` :
                           `↓ -${fmt(lastYearTaxable - taxableTotal)}`}
                        </div>
                      )}
                    </div>
                  </summary>

                  <div className="px-3 pb-3 pt-2" style={{ borderTop: "1px solid var(--line-soft)" }}>
                    {!hasContracts ? (
                      <div className="space-y-2">
                        <div className="text-xs" style={{ color: "var(--ink-soft)" }}>
                          此物件在 {year} 年度沒有合約紀錄。可以手動補金額(適用土地租金、停車位、其他無合約租賃):
                        </div>
                        <div className="p-3 rounded text-xs" style={{ background: "#fafaf6", border: "1px solid var(--line)" }}>
                          <label className="flex items-center gap-2 cursor-pointer mb-2">
                            <input type="checkbox" checked={override?.totalAnnualRent !== undefined}
                              onChange={e => {
                                if (e.target.checked) {
                                  updateRentOverride(p.id, { totalAnnualRent: 0, manualType: "general" });
                                } else {
                                  updateRentOverride(p.id, {
                                    totalAnnualRent: undefined,
                                    annualRent: undefined,
                                    generalAnnualRent: undefined,
                                    publicAnnualRent: undefined,
                                    manualType: undefined,
                                  });
                                }
                              }} />
                            <span className="font-medium">手動補列當年度租金</span>
                          </label>

                          {override?.totalAnnualRent !== undefined && (
                            <div className="ml-5 space-y-2">
                              {p.assetType === "land" ? (
                                <div className="flex items-center gap-2">
                                  <span style={{ minWidth: "85px" }}>類型:</span>
                                  <span className="chip text-[10px]" style={{ background: "#e8e2d5", color: "var(--ink)" }}>🌳 土地</span>
                                  <span className="text-[10px]" style={{ color: "var(--ink-mute)" }}>
                                    (不適用 43% 費用率,只能扣地價稅)
                                  </span>
                                </div>
                              ) : (
                                <div className="flex items-center gap-2">
                                  <span style={{ minWidth: "85px" }}>類型:</span>
                                  <div className="flex gap-1">
                                    <label className={`px-2 py-1 rounded cursor-pointer text-xs border ${(override.manualType || "general") === "general" ? "border-2 font-medium" : ""}`}
                                      style={{
                                        borderColor: (override.manualType || "general") === "general" ? "var(--gold)" : "var(--line)",
                                        background: (override.manualType || "general") === "general" ? "#fef9ec" : "white"
                                      }}>
                                      <input type="radio" name={`mtype_${p.id}`} className="mr-1"
                                        checked={(override.manualType || "general") === "general"}
                                        onChange={() => updateRentOverride(p.id, { manualType: "general" })} />
                                      一般 (43% 費用率)
                                    </label>
                                    <label className={`px-2 py-1 rounded cursor-pointer text-xs border ${override.manualType === "public" ? "border-2 font-medium" : ""}`}
                                      style={{
                                        borderColor: override.manualType === "public" ? "var(--green)" : "var(--line)",
                                        background: override.manualType === "public" ? "var(--green-soft)" : "white"
                                      }}>
                                      <input type="radio" name={`mtype_${p.id}`} className="mr-1"
                                        checked={override.manualType === "public"}
                                        onChange={() => updateRentOverride(p.id, { manualType: "public" })} />
                                      公益 (15k/月免稅+60%)
                                    </label>
                                  </div>
                                </div>
                              )}
                              <div className="flex items-center gap-2">
                                <span style={{ minWidth: "85px" }}>全年總租金:</span>
                                <div className="w-40">
                                  <SumInput value={override.totalAnnualRent}
                                    onChange={v => updateRentOverride(p.id, { totalAnnualRent: v })} />
                                </div>
                                <button className="btn-secondary text-[10px] ml-auto" onClick={() => clearRentOverride(p.id)}>↻ 清除</button>
                              </div>
                              {p.assetType === "land" && (
                                <div className="flex items-center gap-2">
                                  <span style={{ minWidth: "85px" }}>當年地價稅:</span>
                                  <div className="w-40">
                                    <SumInput value={p.landTax || 0}
                                      onChange={v => {
                                        // 直接更新該 property 的 landTax (需要 setProperties)
                                        if (setProperties) {
                                          setProperties(properties.map(pp => pp.id === p.id ? { ...pp, landTax: v } : pp));
                                        }
                                      }} />
                                  </div>
                                  <span className="text-[10px]" style={{ color: "var(--ink-mute)" }}>
                                    應稅 = 全年租金 − 地價稅
                                  </span>
                                </div>
                              )}
                              <div className="text-[10px]" style={{ color: "var(--ink-mute)" }}>
                                ⓘ {p.assetType === "land"
                                  ? "土地出租:稅法規定只能扣「該地當年繳納的地價稅」,不可使用 43% 費用率"
                                  : "適用情境:停車位、未簽紙本合約的口頭租賃等"}
                              </div>
                              {/* 應稅顯示 */}
                              {override.totalAnnualRent > 0 && (
                                <div className="p-2 rounded" style={{ background: "#f5f5f0", border: "1px solid var(--line)" }}>
                                  <div className="flex justify-between">
                                    <span>本物件本年度應稅</span>
                                    <span className="num font-medium">{fmt(taxableTotal)}</span>
                                  </div>
                                </div>
                              )}
                            </div>
                          )}
                        </div>
                      </div>
                    ) : (
                      <>
                        {/* 合約攤分明細 (整合手動調整 + 原應稅 + 調整後應稅) */}
                        <div className="text-xs font-medium mb-2" style={{ color: "var(--ink-soft)" }}>
                          合約攤分明細 ({agg.contracts.length} 份) · <span style={{ color: "var(--ink-mute)" }}>手動調整欄留空 = 用原合約算</span>
                        </div>
                        <div className="overflow-x-auto">
                        <table className="w-full text-xs" style={{ minWidth: "950px" }}>
                          <thead>
                            <tr style={{ background: "#fafaf6", borderBottom: "1px solid var(--line)" }}>
                              <th className="text-center px-2 py-1 font-medium" style={{ width: "40px" }}>計入</th>
                              <th className="text-left px-2 py-1 font-medium">租客</th>
                              <th className="text-left px-2 py-1 font-medium">租期</th>
                              <th className="text-center px-2 py-1 font-medium">月數</th>
                              <th className="text-right px-2 py-1 font-medium">月租</th>
                              <th className="text-right px-2 py-1 font-medium">當年度租金</th>
                              <th className="text-right px-2 py-1 font-medium" style={{ minWidth: "110px", background: "#fef9ec" }}>手動調整租金</th>
                              <th className="text-right px-2 py-1 font-medium" style={{ minWidth: "100px" }}>原應稅</th>
                              <th className="text-right px-2 py-1 font-medium" style={{ minWidth: "100px", background: "#f5fbef" }}>調整後應稅</th>
                              <th className="text-center px-2 py-1 font-medium">類型</th>
                            </tr>
                          </thead>
                          <tbody>
                            {agg.contracts.filter(c => c.months > 0).map(c => {
                              // 原應稅: 用 rent 算
                              const origComputable = {
                                type: c.isPublic ? "public" : (p.assetType === "land" ? "land" : "general"),
                                monthlyRent: c.monthly,
                                months: c.months,
                                annualRentDirect: c.rent,
                                landTax: toNum(p.landTax || 0),
                                expenseRatio: 0.43,
                              };
                              const origTax = computeRentalIncome([origComputable], params).breakdown[0]?.taxableIncome || 0;
                              // 調整後應稅: 用 appliedRent 算 (若有調整)
                              const adjustedComputable = {
                                ...origComputable,
                                annualRentDirect: c.appliedRent !== undefined ? c.appliedRent : c.rent,
                              };
                              const adjustedTax = c.isAdjusted
                                ? computeRentalIncome([adjustedComputable], params).breakdown[0]?.taxableIncome || 0
                                : origTax;

                              return (
                                <tr key={c.contractId} style={{
                                  borderBottom: "1px solid var(--line-soft)",
                                  opacity: c.isExcluded ? 0.5 : 1,
                                }}>
                                  <td className="px-2 py-1 text-center">
                                    <input type="checkbox"
                                      checked={!c.isExcluded}
                                      onChange={ev => {
                                        const cur = (filing.manualRentOverrides?.[`${p.id}_${year}`]?.excludedContracts) || {};
                                        const next = { ...cur };
                                        if (ev.target.checked) {
                                          delete next[c.contractId];
                                        } else {
                                          next[c.contractId] = true;
                                        }
                                        updateRentOverride(p.id, { excludedContracts: next });
                                      }}
                                      title={c.isExcluded ? "✗ 未計入此合約" : "✓ 計入此合約"}
                                    />
                                  </td>
                                  <td className="px-2 py-1">
                                    {c.tenantName}
                                    {c.hasOverlapWithPublic && <span className="ml-1 text-[9px]" style={{ color: "var(--gold)" }}>(部分被公益覆蓋)</span>}
                                    {c.isExcluded && <span className="ml-1 text-[9px]" style={{ color: "var(--gold)" }}>(不計入)</span>}
                                  </td>
                                  <td className="px-2 py-1 num text-[10px]">{c.period}</td>
                                  <td className="px-2 py-1 text-center num">{
                                    Number.isInteger(c.months) ? c.months : c.months.toFixed(2)
                                  }</td>
                                  <td className="px-2 py-1 text-right num">{fmt(c.monthly)}</td>
                                  <td className="px-2 py-1 text-right num">{fmt(c.rent)}</td>
                                  <td className="px-2 py-1 text-right" style={{ background: "#fef9ec" }}>
                                    <input
                                      type="text"
                                      inputMode="numeric"
                                      className="input-text-plain text-xs w-20 text-right placeholder:text-[9px] placeholder:text-gray-400"
                                      value={c.manualRent !== null && c.manualRent !== undefined ? c.manualRent : ""}
                                      placeholder="原值"
                                      title="留空 = 採用合約原值;填數字 = 改用此數字"
                                      onChange={e => {
                                        // 只允許數字 + 負號
                                        const val = e.target.value.replace(/[^\d-]/g, "");
                                        const cur = (filing.manualRentOverrides?.[`${p.id}_${year}`]?.byContract) || {};
                                        let newByContract;
                                        if (val === "" || val === null) {
                                          // 清除該合約調整
                                          newByContract = { ...cur };
                                          delete newByContract[c.contractId];
                                        } else {
                                          newByContract = { ...cur, [c.contractId]: Number(val) || 0 };
                                        }
                                        updateRentOverride(p.id, { byContract: newByContract });
                                      }}
                                    />
                                  </td>
                                  <td className="px-2 py-1 text-right num" style={{ color: c.isAdjusted ? "var(--ink-mute)" : "var(--accent-deep)", textDecoration: c.isAdjusted ? "line-through" : "none" }}>
                                    {fmt(origTax)}
                                  </td>
                                  <td className="px-2 py-1 text-right num font-medium" style={{ background: "#f5fbef", color: c.isAdjusted ? "var(--green)" : "var(--accent-deep)" }}>
                                    {fmt(adjustedTax)}
                                  </td>
                                  <td className="px-2 py-1 text-center">
                                    {c.isPublic ? <span className="chip chip-green text-[10px]">公益</span> : <span className="chip chip-amber text-[10px]">一般</span>}
                                  </td>
                                </tr>
                              );
                            })}

                            {/* 合計列 */}
                            <tr style={{ background: "#f0ede2", borderTop: "2px solid var(--ink)" }}>
                              <td colSpan={5} className="px-2 py-2 text-right font-medium">合計</td>
                              <td className="px-2 py-2 text-right num font-medium">{fmt(agg.computedAnnualRent)}</td>
                              <td className="px-2 py-2 text-right num font-medium" style={{ background: "#fef9ec" }}>
                                {agg.hasPerContractAdjust ? fmt(agg.appliedAnnualRent) : <span style={{ color: "var(--ink-mute)" }}>—</span>}
                              </td>
                              <td className="px-2 py-2 text-right num" style={{ color: "var(--ink-mute)" }}>
                                {/* 全部原應稅合計 */}
                                {(() => {
                                  const total = agg.contracts.filter(c => c.months > 0).reduce((s, c) => {
                                    const oc = {
                                      type: c.isPublic ? "public" : (p.assetType === "land" ? "land" : "general"),
                                      monthlyRent: c.monthly, months: c.months,
                                      annualRentDirect: c.rent, landTax: toNum(p.landTax || 0), expenseRatio: 0.43,
                                    };
                                    return s + (computeRentalIncome([oc], params).breakdown[0]?.taxableIncome || 0);
                                  }, 0);
                                  return fmt(total);
                                })()}
                              </td>
                              <td className="px-2 py-2 text-right num font-medium" style={{ background: "#f5fbef", color: "var(--green)", fontSize: "13px" }}>
                                {fmt(taxableTotal)}
                              </td>
                              <td></td>
                            </tr>
                          </tbody>
                        </table>
                        </div>

                        {/* 月份覆蓋條 */}
                        {(() => {
                          // 用原始合約 (不去重) 算 coverage
                          const propContracts = (contracts || []).filter(c => c.propertyId === p.id);
                          const cov = new Array(12).fill("none");
                          propContracts.forEach(c => {
                            const s = parseRocDate(c.startDate), e = parseRocDate(c.endDate);
                            if (!s || !e) return;
                            const days = monthDaysInYear(s, e, year);
                            const isPub = c.contractType === "public" || c.isPublicLandlord;
                            days.forEach((d, i) => {
                              if (d === 0) return;
                              const cur = cov[i];
                              const newType = isPub ? "public" : "general";
                              if (cur === "none") cov[i] = newType;
                              else if (cur !== newType && cur !== "overlap") cov[i] = "overlap";
                            });
                          });
                          const missing = cov.map((c, i) => c === "none" ? i + 1 : null).filter(Boolean);
                          const overlap = cov.map((c, i) => c === "overlap" ? i + 1 : null).filter(Boolean);
                          return (
                            <div className="mt-2 p-2 rounded" style={{ background: "white", border: "1px solid var(--line-soft)" }}>

function DonationSimulator({ filing, result, params, onApplyDonation }) {
  const [addAmount, setAddAmount] = React.useState(0);
  // 計算: 現在的列舉合計 vs 加 X 後的列舉合計
  // 注意: 一般捐贈上限 = 綜所 20%,超過部分不能扣;不限額捐贈無上限
  const currentDonation = toNum(filing.itemizedDeductions.donationGeneral);
  const donationCap = (result.grossIncomeForDonation || result.grossIncome) * 0.2;
  const currentDonationEffective = Math.min(currentDonation, donationCap);
  const newDonation = currentDonation + addAmount;
  const newDonationEffective = Math.min(newDonation, donationCap);
  const effectiveDelta = newDonationEffective - currentDonationEffective;

  // 現在的應納稅額 (用既有 result)
  const currentNetIncome = result.netIncome;       // 綜合所得淨額 (扣除已扣除完)
  const currentMarginalRate = (() => {
    // 取現在的邊際稅率
    if (currentNetIncome <= 590000) return 0.05;
    if (currentNetIncome <= 1330000) return 0.12;
    if (currentNetIncome <= 2660000) return 0.20;
    if (currentNetIncome <= 4980000) return 0.30;
    return 0.40;
  })();

  // 如果增加 effectiveDelta 列舉扣除,淨所得變少了
  // 但要注意:列舉是否會超過標準?如果原本沒用列舉,要先彌補到等於標準才開始省
  // 簡化: 假設仍採用列舉 (因為加捐贈通常會更多)
  const newItemizedTotal = result.itemizedTotal + effectiveDelta;
  const finalDeduction = Math.max(result.standardDeduction, newItemizedTotal);
  const currentDeduction = Math.max(result.standardDeduction, result.itemizedTotal);
  const deductionDelta = finalDeduction - currentDeduction;

  // 估算節稅 (用邊際稅率簡化)
  const estimatedSavings = Math.round(deductionDelta * currentMarginalRate);

  if (result.grossIncome === 0) return null; // 沒所得不顯示

  return (
    <div className="mt-4 p-4 rounded" style={{ background: "#fdfcf7", border: "1px solid var(--accent)" }}>
      <div className="ornament mb-2" style={{ color: "var(--accent-deep)" }}>DONATION SIMULATOR · 捐贈節稅試算</div>
      <div className="text-xs mb-3" style={{ color: "var(--ink-soft)" }}>
        想再多捐多少?系統估算能多省多少稅(以目前的邊際稅率 <b className="num">{(currentMarginalRate * 100).toFixed(0)}%</b> 試算)
      </div>
      <div className="grid grid-cols-3 gap-3 items-end">
        <div>
          <label className="block text-xs mb-1" style={{ color: "var(--ink-soft)" }}>增加捐贈金額</label>
          <SumInput value={addAmount} onChange={setAddAmount} />
          <div className="text-[10px] mt-1" style={{ color: "var(--ink-mute)" }}>
            可填算式,如 5000+3000
          </div>
        </div>
        <div className="p-2 rounded text-xs" style={{ background: "white", border: "1px solid var(--line)" }}>
          <div style={{ color: "var(--ink-mute)" }}>實際生效金額</div>
          <div className="num font-medium">{fmt(effectiveDelta)}</div>
          {newDonation > donationCap && (
            <div className="text-[10px] mt-0.5" style={{ color: "var(--gold)" }}>
              ⚠ 超過綜所 20% 上限,僅生效到 {fmt(donationCap)}
            </div>
          )}
        </div>
        <div className="p-2 rounded text-xs" style={{ background: "var(--green-soft)", border: "1px solid var(--green)" }}>
          <div style={{ color: "var(--ink-mute)" }}>預估節稅</div>
          <div className="num font-serif text-lg" style={{ color: "var(--green)" }}>
            {fmt(estimatedSavings)}
          </div>
          <div className="text-[10px] mt-0.5" style={{ color: "var(--ink-mute)" }}>
            邊際稅率 {(currentMarginalRate * 100).toFixed(0)}%
          </div>
        </div>
      </div>

      {/* 對比 */}
      {addAmount > 0 && (
        <div className="mt-3 p-3 rounded text-xs" style={{ background: "white", border: "1px solid var(--line-soft)" }}>
          <div className="grid grid-cols-3 gap-2">
            <div>
              <div style={{ color: "var(--ink-mute)" }}>目前一般捐贈</div>
              <div className="num font-medium">{fmt(currentDonation)}</div>
            </div>
            <div>
              <div style={{ color: "var(--ink-mute)" }}>加總後一般捐贈</div>
              <div className="num font-medium">{fmt(newDonation)}</div>
              <div className="text-[10px]" style={{ color: "var(--ink-mute)" }}>
                上限 {fmt(donationCap)}
              </div>
            </div>
            <div>
              <div style={{ color: "var(--ink-mute)" }}>淨成本 (出 ${fmt(addAmount)} − 退稅)</div>
              <div className="num font-medium" style={{ color: "var(--accent-deep)" }}>
                {fmt(addAmount - estimatedSavings)}
              </div>
            </div>
          </div>
          {deductionDelta < effectiveDelta && (
            <div className="mt-2 text-[10px]" style={{ color: "var(--gold)" }}>
              ⓘ 加捐贈後若列舉仍 ≤ 標準扣除額,只節稅到「彌補到標準」那一段,後續才開始實際省稅
            </div>
          )}
        </div>
      )}

      {addAmount > 0 && (
        <div className="mt-3 flex justify-end gap-2">
          <button className="btn-secondary text-xs" onClick={() => setAddAmount(0)}>清除試算</button>
          <button className="btn-primary text-xs"
            onClick={() => {
              if (confirm(`確定要把 ${fmt(addAmount)} 加到「一般捐贈」欄位?`)) {
                onApplyDonation(addAmount);
                setAddAmount(0);
              }
            }}>
            ✓ 加到一般捐贈
          </button>
        </div>
      )}
    </div>
  );
}

function OfficialAuditPanel({ filing, entries, onChange }) {
  const audits = filing.officialAudit || [];
  const [collapsed, setCollapsed] = React.useState(true);

  const updateAudits = (next) => onChange({ ...filing, officialAudit: next });
  const addAudit = () => updateAudits([...audits, { id: uid(), code: "", count: "", amount: "" }]);
  const updateAudit = (id, patch) => updateAudits(audits.map(a => a.id === id ? { ...a, ...patch } : a));
  const removeAudit = (id) => updateAudits(audits.filter(a => a.id !== id));

  // 依代號統計系統的逐筆明細 (code -> {count, amount})
  const systemByCode = {};
  entries.forEach(e => {
    const code = (e.code || "").toUpperCase().trim();
    if (!code) return;
    if (!systemByCode[code]) systemByCode[code] = { count: 0, amount: 0 };
    systemByCode[code].count += 1;
    systemByCode[code].amount += toNum(e.netAmount);  // 所得總額 (扣完費用)
  });

  // 找出系統有,但 audit 沒對的代號 (給「智慧建議」用)
  const missingCodes = Object.keys(systemByCode).filter(code => !audits.some(a => (a.code || "").toUpperCase().trim() === code));

  // 合計
  const totalAuditCount = audits.reduce((s, a) => s + toNum(a.count), 0);
  const totalAuditAmount = audits.reduce((s, a) => s + toNum(a.amount), 0);
  const totalSysCount = audits.reduce((s, a) => {
    const code = (a.code || "").toUpperCase().trim();
    return s + (systemByCode[code]?.count || 0);
  }, 0);
  const totalSysAmount = audits.reduce((s, a) => {
    const code = (a.code || "").toUpperCase().trim();
    return s + (systemByCode[code]?.amount || 0);
  }, 0);

  return (
    <div className="card" style={{ borderColor: "#c08040" }}>
      <div
        className="px-5 py-3 flex items-center justify-between cursor-pointer hover:bg-orange-50"
        style={{ borderBottom: collapsed ? "none" : "1px solid var(--line)", background: "#fef5eb" }}
        onClick={() => setCollapsed(!collapsed)}

          <span className="text-xs" style={{ color: "#c08040", minWidth: "12px" }}>
            {collapsed ? "▶" : "▼"}
          </span>
          <div>
            <div className="ornament" style={{ color: "#c08040" }}>OFFICIAL AUDIT</div>
            <div className="font-serif text-base">📋 申報書筆數核對 <span className="text-xs ml-2" style={{ color: "var(--ink-mute)" }}>(從申報書 PDF 逐項抄入,自動跟下方逐筆明細比對)</span></div>
          </div>
        </div>
        {audits.length > 0 && !collapsed && (
          <div className="text-xs" style={{ color: "var(--ink-soft)" }}>

                    const codeInfo = INCOME_CODES[code];

                      statusColor = Math.abs(amountDiff) > 100 ? "#c53030" : "var(--gold)";
                    } else if (countDiff !== 0) {
                      status = "count";
                      statusText = `⚠ 筆數差 ${countDiff > 0 ? "+" : ""}${countDiff}`;
                      statusColor = "var(--gold)";
                    } else if (amountDiff !== 0) {
                      status = "amount";
                      statusText = `⚠ 金額差 ${amountDiff > 0 ? "+" : ""}${fmt(amountDiff)}`;
                      statusColor = Math.abs(amountDiff) > 100 ? "#c53030" : "var(--gold)";
                    }

                    return (
                      <tr key={a.id} style={{ borderBottom: "1px solid var(--line-soft)" }}>
                        <td className="px-2 py-1.5">
                          <input type="text"
                            className="input-text-plain text-xs w-full num"
                            placeholder="如 5A"
                            value={a.code || ""}
                            onChange={e => updateAudit(a.id, { code: e.target.value.toUpperCase() })} />
                        </td>
                        <td className="px-2 py-1.5 text-[10px]" style={{ color: "var(--ink-mute)" }}>
                          {label}
                        </td>
                        <td className="px-2 py-1.5">
                          <input type="text" inputMode="numeric"
                            className="input-text-plain text-xs w-full text-right num"
                            placeholder="0"
                            value={a.count || ""}
                            onChange={e => updateAudit(a.id, { count: e.target.value.replace(/[^\d]/g, "") })} />
                        </td>
                        <td className="px-2 py-1.5">
                          <input type="text" inputMode="numeric"
                            className="input-text-plain text-xs w-full text-right num"
                            placeholder="0"
                            value={a.amount || ""}
                            onChange={e => updateAudit(a.id, { amount: e.target.value.replace(/[^\d-]/g, "") })} />
                        </td>
                        <td className="px-2 py-1.5 text-right num text-xs" style={{ background: "#f5fbef" }}>
                          {sys.count}
                        </td>
                        <td className="px-2 py-1.5 text-right num text-xs" style={{ background: "#f5fbef" }}>
                          {fmt(sys.amount)}
                        </td>
                        <td className="px-2 py-1.5 text-[10px]" style={{ color: statusColor }}>
                          {statusText}
                        </td>
                        <td className="px-1 py-1.5 text-center">
                          <button className="text-red-600 text-xs hover:underline"
                            onClick={() => removeAudit(a.id)}>×</button>
                        </td>
                      </tr>
                    );
                  })}

                  {/* 合計列 */}
                  <tr style={{ background: "#f0ede2", borderTop: "2px solid var(--ink)" }}>
                    <td colSpan={2} className="text-right px-2 py-2 font-medium text-xs">合計</td>
                    <td className="text-right px-2 py-2 num font-medium">{totalAuditCount}</td>
                    <td className="text-right px-2 py-2 num font-medium">{fmt(totalAuditAmount)}</td>
                    <td className="text-right px-2 py-2 num font-medium" style={{ background: "#f5fbef" }}>{totalSysCount}</td>
                    <td className="text-right px-2 py-2 num font-medium" style={{ background: "#f5fbef" }}>{fmt(totalSysAmount)}</td>
                    <td className="px-2 py-2 text-[11px]" style={{
                      color: (totalAuditCount === totalSysCount && totalAuditAmount === totalSysAmount) ? "var(--green)" : "#c53030",
                    }}>
                      {totalAuditCount === totalSysCount && totalAuditAmount === totalSysAmount
                        ? "✓ 全部對上"
                        : `差 ${totalAuditCount - totalSysCount} 筆 / ${fmt(totalAuditAmount - totalSysAmount)}`}
                    </td>
                    <td></td>
                  </tr>
                </tbody>
              </table>

              <div className="mt-3 flex items-center justify-between">
                <button className="text-xs px-3 py-1.5 rounded hover:bg-gray-100"
                  style={{ border: "1px dashed var(--accent)", color: "var(--accent-deep)" }}
                  onClick={addAudit}>
                  + 新增類別
                </button>

                {/* 智慧建議:系統有但 audit 沒列的代號 */}
                {missingCodes.length > 0 && (
                  <div className="text-[10px]" style={{ color: "var(--ink-mute)" }}>
                    💡 系統還有這些代號未核對:
                    {missingCodes.map(code => (
                      <button key={code} className="ml-1 px-1.5 py-0.5 rounded hover:bg-orange-100"
                        style={{ border: "1px solid var(--line)", color: "var(--accent-deep)" }}
                        onClick={() => updateAudits([...audits, { id: uid(), code, count: "", amount: "" }])}>
                        + {code}
                      </button>
                    ))}
                  </div>
                )}
              </div>
            </>
          )}

          <div className="mt-3 text-[10px]" style={{ color: "var(--ink-mute)" }}>
            ⓘ 從申報書 PDF「所得明細」頁逐類抄入(類別 / 筆數 / 該類所得總額)。
            系統會自動跟下方「逐筆所得明細」按代號比對:
            <ul className="list-disc list-inside ml-2 mt-1 space-y-0.5">
              <li><b>筆數不對</b> → 表示有漏輸入或多輸入</li>
              <li><b>金額差距大</b> → 表示某筆所得金額打錯</li>
              <li><b>差異 1~5 元</b> → 通常是四捨五入,可忽略</li>
            </ul>
          </div>
        </div>
      )}
    </div>
  );
}

function SettlementPanel({ filing, onChange, systemFinalDue }) {
  const settlement = filing.actualSettlement || {};
  const adjustments = filing.adjustments || [];
  const ADJ_TYPES = {
    "supplement": { label: "補繳稅額", chip: "chip-amber", desc: "國稅局查到漏報或補正,需補繳" },
    "refund_received": { label: "實收退稅", chip: "chip-green", desc: "實際收到的退稅金額" },
    "penalty": { label: "罰鍰", chip: "chip-red", desc: "漏報罰" },
    "interest": { label: "利息", chip: "chip-amber", desc: "滯納利息" },
    "other": { label: "其他", chip: "chip", desc: "" },
  };
  const updateSettlement = (patch) => {
    onChange({ ...filing, actualSettlement: { ...settlement, ...patch } });
  };
  const addAdjustment = (preset = {}) => {
    const adj = {
      id: uid(),
      date: "",
      type: preset.type || "supplement",
      amount: 0,
      reason: "",
      docNo: "",
      docUrl: "",       // 國稅局電子公文連結
      station: "",      // 承辦站號/分局/承辦人
      note: "",
      ...preset,
    };
    onChange({ ...filing, adjustments: [...adjustments, adj] });
  };
  const updateAdjustment = (id, patch) => {
    onChange({ ...filing, adjustments: adjustments.map(a => a.id === id ? { ...a, ...patch } : a) });
  };
  const removeAdjustment = (id) => {
    onChange({ ...filing, adjustments: adjustments.filter(a => a.id !== id) });
  };

  // 系統試算 vs 實際的差異
  const sysFinal = systemFinalDue || 0;
  const actualNum = settlement.actualAmount !== "" && settlement.actualAmount !== undefined && settlement.actualAmount !== null
    ? toNum(settlement.actualAmount)
    : null;
  const hasActual = actualNum !== null;
  // 後續調整加總
  const adjTotal = adjustments.reduce((s, a) => {
    const v = toNum(a.amount);
    // supplement / penalty / interest 是「再繳」(+);refund_received 是「再收」(−)
    if (a.type === "refund_received") return s - v;
    return s + v;
  }, 0);

  const [collapsed, setCollapsed] = React.useState(false);

  return (
    <div className="card">
      <div
        className="px-5 py-3 flex items-center justify-between cursor-pointer hover:bg-gray-50"
        style={{ borderBottom: collapsed ? "none" : "1px solid var(--line)" }}
        onClick={() => setCollapsed(!collapsed)}
      >
        <div className="flex items-center gap-2 flex-1">
          <span className="text-xs" style={{ color: "var(--ink-mute)", minWidth: "12px" }}>
            {collapsed ? "▶" : "▼"}
          </span>
          <div className="ornament">⑦ SETTLEMENT · 實際結算與後續調整</div>
        </div>
        <div className="text-xs" style={{ color: "var(--ink-mute)" }}>
          記錄實際繳/退金額(可能與系統試算差幾元四捨五入)+ 後續補繳/罰金
        </div>
      </div>
      {!collapsed && (
      <div className="p-5 space-y-4">

        {/* 實際結算 */}
        <div className="p-3 rounded" style={{ background: "#fafaf6", border: "1px solid var(--line)" }}>
          <div className="text-xs font-medium mb-2" style={{ color: "var(--ink-soft)" }}>
            ✓ 實際繳/退稅金額(政府寄來的繳款書或實收退稅)
          </div>
          <div className="grid grid-cols-3 gap-3">
            <div>
              <label className="block text-[10px] mb-1" style={{ color: "var(--ink-mute)" }}>
                實際金額(正 = 補繳,負 = 退稅)
              </label>
              <input type="number"
                className="input-text w-full text-right"
                placeholder={`系統試算: ${sysFinal >= 0 ? fmt(sysFinal) : `-${fmt(-sysFinal)}`}`}
                value={settlement.actualAmount || ""}
                onChange={e => updateSettlement({ actualAmount: e.target.value })} />
              {hasActual && (
                <div className="text-[10px] mt-1 num" style={{ color: Math.abs(actualNum - sysFinal) < 5 ? "var(--green)" : "var(--gold)" }}>
                  {Math.abs(actualNum - sysFinal) < 5
                    ? `✓ 與系統試算僅差 ${fmt(actualNum - sysFinal)} 元 (四捨五入)`
                    : `⚠ 與系統試算差 ${fmt(actualNum - sysFinal)} 元 (請檢查)`}
                </div>
              )}
            </div>
            <div>
              <label className="block text-[10px] mb-1" style={{ color: "var(--ink-mute)" }}>實際日期</label>
              <input type="text"
                className="input-text w-full"
                placeholder="例: 112/5/30"
                value={settlement.actualDate || ""}
                onChange={e => updateSettlement({ actualDate: e.target.value })} />
            </div>
            <div>
              <label className="block text-[10px] mb-1" style={{ color: "var(--ink-mute)" }}>備註</label>
              <input type="text"
                className="input-text w-full"
                placeholder="例: 從信用卡分6期"
                value={settlement.note || ""}
                onChange={e => updateSettlement({ note: e.target.value })} />
            </div>
          </div>
        </div>

        {/* 後續調整(補繳、退稅、罰鍰、利息) */}
        <div>
          <div className="flex items-center justify-between mb-2">
            <div className="text-xs font-medium" style={{ color: "var(--ink-soft)" }}>
              後續調整紀錄({adjustments.length} 筆)
              {adjustments.length > 0 && (
                <span className="ml-2 num" style={{ color: adjTotal > 0 ? "var(--accent-deep)" : "var(--green)" }}>
                  · 合計 {adjTotal >= 0 ? "+" : ""}{fmt(adjTotal)} 元
                </span>
              )}
            </div>
            <div className="flex gap-1">
              <button className="btn-secondary text-[10px]" onClick={() => addAdjustment({ type: "supplement" })}>
                + 補繳
              </button>
              <button className="btn-secondary text-[10px]" onClick={() => addAdjustment({ type: "refund_received" })}>
                + 實收退稅
              </button>
              <button className="btn-secondary text-[10px]" onClick={() => addAdjustment({ type: "penalty" })}>
                + 罰鍰
              </button>
              <button className="btn-secondary text-[10px]" onClick={() => addAdjustment({ type: "interest" })}>
                + 利息
              </button>
            </div>
          </div>

          {adjustments.length === 0 ? (
            <div className="text-xs p-3 rounded text-center" style={{ background: "#fafaf6", color: "var(--ink-mute)" }}>
              尚無調整紀錄。若申報後收到國稅局補繳通知、退稅單,可在上方按鈕新增。
            </div>
          ) : (
            <div className="space-y-2">
              {adjustments.map(a => {
                const t = ADJ_TYPES[a.type] || ADJ_TYPES.other;
                const amtColor = a.type === "refund_received" ? "var(--green)" : "var(--accent-deep)";
                return (
                  <div key={a.id} className="p-3 rounded" style={{ background: "#fafaf6", border: "1px solid var(--line)" }}>
                    {/* 第一列: 類型 / 日期 / 金額 / 刪除 */}
                    <div className="flex items-center gap-2 mb-2">
                      <select className="input-text-plain text-xs"
                        style={{ minWidth: "100px" }}
                        value={a.type}
                        onChange={e => updateAdjustment(a.id, { type: e.target.value })}>
                        {Object.entries(ADJ_TYPES).map(([k, v]) => (
                          <option key={k} value={k}>{v.label}</option>
                        ))}
                      </select>
                      <span className="text-[10px]" style={{ color: "var(--ink-mute)" }}>日期:</span>
                      <input type="text"
                        className="input-text-plain text-xs"
                        style={{ width: "100px" }}
                        placeholder="例: 112/8/15"
                        value={a.date || ""}
                        onChange={e => updateAdjustment(a.id, { date: e.target.value })} />
                      <span className="text-[10px] ml-auto" style={{ color: "var(--ink-mute)" }}>金額:</span>
                      <input type="number"
                        className="input-text-plain text-xs text-right font-medium"
                        style={{ width: "120px", color: amtColor, fontSize: "14px" }}
                        placeholder="0"
                        value={a.amount || ""}
                        onChange={e => updateAdjustment(a.id, { amount: Number(e.target.value) || 0 })} />
                      <button className="text-red-600 text-xs hover:underline ml-1"
                        title="刪除此筆"
                        onClick={() => removeAdjustment(a.id)}>×</button>
                    </div>

                    {/* 第二列: 原因 */}
                    <div className="flex items-center gap-2 mb-1.5">
                      <span className="text-[10px]" style={{ minWidth: "55px", color: "var(--ink-mute)" }}>原因/內容:</span>
                      <input type="text"
                        className="input-text-plain text-xs flex-1"
                        placeholder="例: 漏報利息所得 5A 兆豐銀行,經核定補繳"
                        value={a.reason || ""}
                        onChange={e => updateAdjustment(a.id, { reason: e.target.value })} />
                    </div>

                    {/* 第三列: 公文文號 / 站號 / 公文連結 */}
                    <div className="grid grid-cols-3 gap-2">
                      <div className="flex items-center gap-1">
                        <span className="text-[10px]" style={{ color: "var(--ink-mute)" }}>公文文號:</span>
                        <input type="text"
                          className="input-text-plain text-xs flex-1 num"
                          placeholder="例: 北稅核字第 1XXXXX 號"
                          value={a.docNo || ""}
                          onChange={e => updateAdjustment(a.id, { docNo: e.target.value })} />
                      </div>
                      <div className="flex items-center gap-1">
                        <span className="text-[10px]" style={{ color: "var(--ink-mute)" }}>站號/承辦:</span>
                        <input type="text"
                          className="input-text-plain text-xs flex-1"
                          placeholder="例: 北稅信義分局 02-2XXX"
                          value={a.station || ""}
                          onChange={e => updateAdjustment(a.id, { station: e.target.value })} />
                      </div>
                      <div className="flex items-center gap-1">
                        <span className="text-[10px]" style={{ color: "var(--ink-mute)" }}>公文連結:</span>
                        <input type="url"
                          className="input-text-plain text-xs flex-1"
                          placeholder="https://..."
                          value={a.docUrl || ""}
                          onChange={e => updateAdjustment(a.id, { docUrl: e.target.value })} />
                        {a.docUrl && (
                          <a href={a.docUrl} target="_blank" rel="noopener noreferrer"
                            className="text-[10px] hover:underline px-1"
                            style={{ color: "var(--accent)" }}
                            title="開啟連結">
                            ↗
                          </a>
                        )}
                      </div>
                    </div>

                    {/* 第四列: 備註 (optional, 可摺疊) */}
                    {(a.note || a.showNote) && (
                      <div className="flex items-center gap-2 mt-1.5">
                        <span className="text-[10px]" style={{ minWidth: "55px", color: "var(--ink-mute)" }}>備註:</span>
                        <input type="text"
                          className="input-text-plain text-xs flex-1"
                          placeholder="其他補充"
                          value={a.note || ""}
                          onChange={e => updateAdjustment(a.id, { note: e.target.value })} />
                      </div>
                    )}
                    {!a.note && !a.showNote && (
                      <button className="text-[10px] mt-1 hover:underline"
                        style={{ color: "var(--ink-mute)" }}
                        onClick={() => updateAdjustment(a.id, { showNote: true })}>
                        + 加備註
                      </button>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          <div className="text-[10px] mt-2" style={{ color: "var(--ink-mute)" }}>
            ⓘ 補繳 / 罰鍰 / 利息 = 再繳出去(正)· 實收退稅 = 收到錢(負)
          </div>
        </div>

        {/* 總結 */}
        {(hasActual || adjustments.length > 0) && (
          <div className="p-3 rounded" style={{ background: "#fdfcf7", border: "1px solid var(--accent-soft)" }}>
            <div className="text-xs font-medium mb-2" style={{ color: "var(--accent-deep)" }}>📊 本年度總實際稅務變動</div>
            <table className="w-full text-xs num">
              <tbody>
                <tr><td className="py-0.5">系統試算</td>
                    <td className="text-right">{sysFinal >= 0 ? `補繳 ${fmt(sysFinal)}` : `退稅 ${fmt(-sysFinal)}`}</td></tr>
                {hasActual && (
                  <tr><td className="py-0.5">實際結算</td>
                      <td className="text-right">{actualNum >= 0 ? `補繳 ${fmt(actualNum)}` : `退稅 ${fmt(-actualNum)}`}</td></tr>
                )}
                {adjustments.length > 0 && (
                  <tr><td className="py-0.5">後續調整合計</td>
                      <td className="text-right">{adjTotal >= 0 ? `再繳 ${fmt(adjTotal)}` : `再收 ${fmt(-adjTotal)}`}</td></tr>
                )}
                <tr className="font-medium" style={{ borderTop: "1px solid var(--line)" }}>
                  <td className="pt-1.5">最終本年度淨支出</td>
                  <td className="text-right pt-1.5" style={{ fontSize: "14px", color: "var(--accent-deep)" }}>
                    {(() => {
                      const final = (hasActual ? actualNum : sysFinal) + adjTotal;
                      return final >= 0 ? `補繳 ${fmt(final)}` : `退稅 ${fmt(-final)}`;
                    })()}
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        )}
      </div>
      )}
    </div>
  );
}

function DeductionInput({ label, hint, value, onChange }) {
  return (
    <div>
      <label className="block text-xs mb-1" style={{ color: "var(--ink-soft)" }}>{label}</label>
      <SumInput value={value} onChange={onChange} />
      <div className="text-xs mt-1" style={{ color: "var(--ink-mute)" }}>{hint}</div>
    </div>
  );
}

function TaxMethodsPanel({ result, filing, onChange }) {
  const allMethods = result.taxMethods;
  const isAuto = (filing.taxMethod || "auto") === "auto";
  const [collapsed, setCollapsed] = React.useState(false);
  // 預設只顯示「股利合併」(A 變體);打勾才顯示「股利分開 28%」(B 變體)
  const allBest = result.bestMethod;
  const chosen = result.chosenMethod;
  const [showSeparateB, setShowSeparateB] = React.useState(
    // 若 best 或 chosen 是 B 變體,預設打開讓使用者看到
    (allBest?.dividendChoice === "separate") || (chosen?.dividendChoice === "separate")
  );
  const methods = showSeparateB
    ? allMethods
    : allMethods.filter(m => m.dividendChoice !== "separate");
  // 顯示用 best:在當前可見的方法中選最低
  const best = methods.reduce((b, m) => (!b || m.finalDue < b.finalDue) ? m : b, null);
  const hiddenCount = allMethods.length - methods.length;

  return (
    <div className="card" style={{ borderColor: "var(--green)" }}>
      <div
        className="px-5 py-3 flex items-center justify-between cursor-pointer hover:bg-green-50"
        style={{ borderBottom: collapsed ? "none" : "1px solid var(--line)", background: "var(--green-soft)" }}
        onClick={() => setCollapsed(!collapsed)}
      >
        <div className="flex items-center gap-2 flex-1">
          <span className="text-xs" style={{ color: "#3d5235", minWidth: "12px" }}>
            {collapsed ? "▶" : "▼"}
          </span>
          <div className="ornament" style={{ color: "#3d5235" }}>
            ⑥ TAX METHODS · {methods.length} 種計稅方式比較 (所得稅法第15條)
          </div>
        </div>
        <div className="text-xs" style={{ color: "#3d5235" }}>
          ✓ 系統已自動採用稅最低的方式 (省下 {fmt(methods[0].finalDue - best.finalDue)} 元)
        </div>
      </div>
      {!collapsed && (
      <div className="p-5">
        <div className="flex items-center justify-between mb-3">
          <div className="text-xs" style={{ color: "var(--ink-soft)" }}>
            預設顯示 5 種「股利合併 8.5% 抵減」計稅方式。如需高所得族群的「股利分開 28%」試算,請打勾下方:
          </div>
          {hiddenCount > 0 || showSeparateB ? (
            <label className="text-xs flex items-center gap-2 cursor-pointer" style={{ color: "var(--ink-soft)" }}>
              <input type="checkbox"
                checked={showSeparateB}
                onChange={e => setShowSeparateB(e.target.checked)} />
              顯示「股利分開 28%」({allMethods.filter(m => m.dividendChoice === "separate").length} 種)
            </label>
          ) : null}
        </div>
        <table className="w-full text-sm">
          <thead>
            <tr style={{ background: "#fafaf6", borderBottom: "1px solid var(--line)" }}>
              <th className="text-center px-2 py-2 text-xs font-medium w-12" style={{ color: "var(--ink-mute)" }}>採用</th>
              <th className="text-left px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>計稅方式</th>
              {showSeparateB && (
                <th className="text-center px-2 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>股利</th>
              )}
              <th className="text-left px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>淨額分配</th>
              <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>綜所稅額</th>

                      {m.dividendChoice === "combine"

                  <td className="px-3 py-2 text-right num text-xs" style={{ color: diff === 0 ? "var(--green)" : "var(--ink-mute)" }}>

              );
            })}
          </tbody>
        </table>

        <div className="mt-3 flex items-center gap-3">
          <label className="text-xs flex items-center gap-2 cursor-pointer">
            <input type="checkbox"
              checked={isAuto}
              onChange={e => onChange({ ...filing, taxMethod: e.target.checked ? "auto" : best.key })} />

          </label>
          <span className="text-xs" style={{ color: "var(--ink-mute)" }}>
            {isAuto ? `→ 目前自動採用「${best.label}」` : `→ 手動選擇「${chosen.label}」(比最低多繳 ${fmt(chosen.finalDue - best.finalDue)})`}
          </span>
        </div>
      </div>
      )}
    </div>
  );
}

          </div>
        )}
      </div>

  }

  return (
    <div className={`${widthCls} inline-block`}>

        <div className="text-[10px] mb-0.5 text-left p-1 rounded" style={{ background: "#f5fbef", color: "var(--green)" }}>
          📑 逐筆明細:{fmt(entriesValue)} (計算採用此值)
        </div>
      )}
      <div className="text-[10px] mb-0.5 text-left" style={{ color: "var(--ink-mute)" }}>
        {hasEntries ? "單格(備用,計算不採用):" : "單格輸入:"}
      </div>

}

// 代號 → 類別 (用於使用者手動輸入代號時自動推斷類別)
function inferCategoryFromCode(code) {
  if (!code) return null;
  const c = String(code).trim().toUpperCase();
  // 薪資
  if (c.startsWith("50")) return "salary";
  // 利息類 (5A 5B 5C 60 61)
  if (c === "5A" || c === "5B" || c === "5C" || c === "60" || c === "61") return "interest";
  // 營利/股利 (54 / 54C / 54Y / 71D / 71G / 71M)
  if (c.startsWith("54") || c === "71D" || c === "71G" || c === "71M") return "dividend";
  // 海外/大陸 71 (一般) / 73
  if (c === "71" || c === "73") return "dividend";  // 也屬營利,但要小心是否享 8.5%
  // 租賃
  if (c.startsWith("51")) return "rental";
  // 執行業務
  if (c === "9A" || c === "9B") return "executive";
  // 其他
  if (["53","76","76W","87","90","91","92","93","94","95","96","97"].includes(c)) return "other";
  return null;  // 不認得 → 保持原狀
}

// 判斷某代號對應的所得是否享「股利 8.5% 可抵減稅額」
// 法源:所得稅法第15條 — 只有 54/54C (公司、合作社、法人 87年以後盈餘) 享抵減
// 71D 小規模、71G 信託、71M 緩課、54Y 其他、71 海外、73 海外利息 — 不享抵減
function codeQualifiesFor85Credit(code) {
  if (!code) return true;  // 預設假設享 (沒填代號時保守)
  const c = String(code).trim().toUpperCase();
  return c === "54" || c === "54C";
}
function renderEntryRow(e, CATEGORIES, CODES, members, onUpdate, onRemove, groupByMember, payerDirectory, onSavePayer) {
  const cat = CATEGORIES[e.category];
  const net = computeEntryNet(e);
  // helper: 看名稱反查統編 / 統編反查名稱
  const lookupName = (taxId) => payerDirectory && payerDirectory[taxId];
  const lookupTaxId = (name) => {
    if (!payerDirectory || !name) return null;
    const found = Object.entries(payerDirectory).find(([, n]) => n === name);
    return found ? found[0] : null;
  };
  return (
    <tr key={e.id} style={{ borderBottom: "1px solid var(--line-soft)" }}>
      <td className="px-2 py-1">
        <select className="input-text-plain text-xs w-full" value={e.category}
          onChange={ev => onUpdate(e.id, { category: ev.target.value, code: CATEGORIES[ev.target.value]?.defaultCode || "" })}>
          {Object.entries(CATEGORIES).map(([k, c]) => (
            <option key={k} value={k}>{c.label}</option>
          ))}
        </select>
      </td>
      <td className="px-2 py-1">
        <input className="input-text-plain text-xs w-full" value={e.code || ""}
          onChange={ev => {
            const newCode = ev.target.value;
            const inferred = inferCategoryFromCode(newCode);
            // 如果代號可推斷出類別,且跟目前不同,就一起更新
            if (inferred && inferred !== e.category) {
              onUpdate(e.id, { code: newCode, category: inferred });
            } else {
              onUpdate(e.id, { code: newCode });
            }
          }}
          placeholder={`${cat?.defaultCode || "代號"} (可手填)`} list={`codes_${e.id}`} />
        <datalist id={`codes_${e.id}`}>
          {Object.entries(CODES).map(([code, info]) => (
            <option key={code} value={code}>{info.name}</option>
          ))}
        </datalist>
        {e.code && CODES[e.code] && (
          <div className="text-[9px] mt-0.5 truncate" style={{ color: "var(--ink-mute)" }} title={CODES[e.code].name}>
            {CODES[e.code].name.split(" (")[0]}
          </div>
        )}
        {e.code && !CODES[e.code] && (
          <div className="text-[9px] mt-0.5" style={{ color: "var(--gold)" }}>
            ⓘ 自定代號
          </div>
        )}
        {e.category === "interest" && (
          <div className="text-[9px] mt-0.5">
            {e.code === "5A" && <span style={{ color: "var(--green)" }}>✓ 享儲蓄扣除</span>}
            {e.code === "5B" && <span style={{ color: "var(--gold)" }}>✗ 不享儲蓄扣除</span>}
          </div>
        )}
      </td>
      <td className="px-2 py-1">
        <input className="input-text-plain text-xs w-full" value={e.source || ""}
          list={`payerNames_${e.id}`}
          onChange={ev => {
            const name = ev.target.value;
            // 反查統編
            const matchedTaxId = lookupTaxId(name);
            const patch = { source: name };
            if (matchedTaxId && !e.taxId) patch.taxId = matchedTaxId;
            onUpdate(e.id, patch);
          }}
          onBlur={ev => {
            // 失焦時:若統編 + 名稱都有 → 存入 directory
            if (e.taxId && ev.target.value && onSavePayer) {
              onSavePayer(e.taxId, ev.target.value);
            }
          }}
          placeholder="例:鴻海精密" />
        <datalist id={`payerNames_${e.id}`}>
          {payerDirectory && Object.entries(payerDirectory).map(([taxId, name]) => (
            <option key={taxId} value={name}>{taxId}</option>
          ))}
        </datalist>
      </td>
      <td className="px-2 py-1">
        <input className="input-text-plain text-xs w-full num" value={e.taxId || ""}
          list={`payerTaxIds_${e.id}`}
          onChange={ev => {
            const taxId = ev.target.value.replace(/[^\d]/g, "");
            const patch = { taxId };
            // 帶出名稱 (只在 source 沒填時)
            if (taxId.length === 8) {
              const matchedName = lookupName(taxId);
              if (matchedName && !e.source) patch.source = matchedName;
            }
            onUpdate(e.id, patch);
          }}
          onBlur={ev => {
            // 失焦時:若統編 + 名稱都有 → 存入 directory
            if (ev.target.value && e.source && onSavePayer) {
              onSavePayer(ev.target.value, e.source);
            }
          }}
          placeholder="統編" />
        <datalist id={`payerTaxIds_${e.id}`}>
          {payerDirectory && Object.entries(payerDirectory).map(([taxId, name]) => (
            <option key={taxId} value={taxId}>{name}</option>
          ))}
        </datalist>
      </td>
      {!groupByMember && (
        <td className="px-2 py-1">
          <select className="input-text-plain text-xs w-full" value={e.ownerId || ""}
            onChange={ev => onUpdate(e.id, { ownerId: ev.target.value })}>
            <option value="">—</option>
            {(members || []).map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
          </select>
        </td>
      )}
      <td className="px-2 py-1">
        <FormulaInput
          exprValue={e.grossExpr}
          value={e.gross}
          onChange={({ expr, value }) => onUpdate(e.id, { gross: value, grossExpr: expr })}
        />
      </td>
      <td className="px-2 py-1">
        {(() => {
          const needsExpenseInput = (
            (e.category === "rental" && (e.code === "51L" || e.code === "51I" || e.code === "51J" || e.code === "51K")) ||
            (e.category === "executive") ||
            (e.category === "rental" && e.code === "51" && toNum(e.expense) > 0)
          );
          if (needsExpenseInput) {
            return <SumInput value={e.expense} onChange={v => onUpdate(e.id, { expense: v })} />;
          }
          return (
            <div className="text-right text-[10px] num" style={{ color: "var(--ink-mute)" }}>
              {e.category === "rental" && e.code === "51" && toNum(e.gross) > 0
                ? `自動 43% (${fmt(Math.round(toNum(e.gross) * 0.43))})`
                : "—"}
            </div>
          );
        })()}
      </td>
      <td className="px-2 py-1 text-right num font-medium" style={{ background: "#fdfcf7" }}>
        {fmt(net)}
      </td>
      <td className="px-2 py-1">
        <SumInput value={e.withholding} onChange={v => onUpdate(e.id, { withholding: v })} />
      </td>
      <td className="px-2 py-1 text-center">
        <button className="text-red-600 text-xs hover:underline" onClick={() => onRemove(e.id)}>×</button>
      </td>
    </tr>
  );
}

function IncomeEntriesTable({ entries, members, onAdd, onUpdate, onRemove, payerDirectory, savePayer }) {
  const [expanded, setExpanded] = React.useState(true);  // 預設展開
  const [filter, setFilter] = React.useState("all");
  const [memberFilter, setMemberFilter] = React.useState("all");
  const [groupByMember, setGroupByMember] = React.useState(true);
  // 新增時的預設歸戶:預設沿用最後一筆;使用者可在「新增區」上方手動鎖定到特定成員
  const [stickyOwnerId, setStickyOwnerId] = React.useState("__last__");
  const resolvedOwnerId = stickyOwnerId === "__last__"
    ? (entries[entries.length - 1]?.ownerId || (members?.[0]?.id) || "")
    : stickyOwnerId;

  const addWithOwner = (preset = {}) => {
    onAdd({ ownerId: resolvedOwnerId, ...preset });
  };

  // 依類別分類
  const grouped = entries.reduce((acc, e) => {
    if (!acc[e.category]) acc[e.category] = [];
    acc[e.category].push(e);
    return acc;
  }, {});

  // 依成員分類
  const groupedByMember = entries.reduce((acc, e) => {
    const key = e.ownerId || "_unassigned";
    if (!acc[key]) acc[key] = [];
    acc[key].push(e);
    return acc;
  }, {});

  // 各類別合計
  const totals = Object.entries(grouped).map(([cat, items]) => {
    const grossSum = items.reduce((s, e) => s + toNum(e.gross), 0);
    const netSum = items.reduce((s, e) => s + computeEntryNet(e), 0);
    const withSum = items.reduce((s, e) => s + toNum(e.withholding), 0);
    return { category: cat, count: items.length, grossSum, netSum, withSum };
  });
  const grossTotal = totals.reduce((s, t) => s + t.grossSum, 0);
  const netTotal = totals.reduce((s, t) => s + t.netSum, 0);
  const withTotal = totals.reduce((s, t) => s + t.withSum, 0);

  // 每個成員的小計
  const memberSummary = (members || []).map(m => {
    const items = groupedByMember[m.id] || [];
    const salary = items.filter(e => e.category === "salary").reduce((s, e) => s + computeEntryNet(e), 0);
    const interest = items.filter(e => e.category === "interest").reduce((s, e) => s + computeEntryNet(e), 0);
    const dividend = items.filter(e => e.category === "dividend").reduce((s, e) => s + computeEntryNet(e), 0);
    const rental = items.filter(e => e.category === "rental").reduce((s, e) => s + computeEntryNet(e), 0);
    const other = items.filter(e => ["executive", "other"].includes(e.category)).reduce((s, e) => s + computeEntryNet(e), 0);
    const withhold = items.reduce((s, e) => s + toNum(e.withholding), 0);
    return { member: m, count: items.length, salary, interest, dividend, rental, other, withhold, total: salary + interest + dividend + rental + other };
  }).filter(s => s.count > 0);

  // 篩選 (類別 + 成員)
  const visibleEntries = entries.filter(e => {
    if (filter !== "all" && e.category !== filter) return false;
    if (memberFilter !== "all" && e.ownerId !== memberFilter) return false;
    return true;
  });

  return (
    <div className="card">
      <details open={expanded} onToggle={e => setExpanded(e.target.open)}>
        <summary className="px-5 py-3 cursor-pointer flex items-center justify-between" style={{ borderBottom: expanded ? "1px solid var(--line)" : "none" }}>
          <div>
            <div className="ornament" style={{ color: "var(--accent-deep)" }}>INCOME ENTRIES</div>
            <div className="font-serif text-base">📑 所得明細逐筆輸入 <span className="text-xs ml-2" style={{ color: "var(--ink-mute)" }}>(依官方申報書格式 · 共 {entries.length} 筆)</span></div>
          </div>
          {entries.length > 0 && (
            <div className="flex gap-4 text-xs" style={{ color: "var(--ink-soft)" }}>
              <span>收入合計 <span className="num font-medium ml-1">{fmt(grossTotal)}</span></span>
              <span>所得合計 <span className="num font-medium ml-1">{fmt(netTotal)}</span></span>
              <span>扣繳合計 <span className="num font-medium ml-1" style={{ color: "var(--green)" }}>{fmt(withTotal)}</span></span>
            </div>
          )}
        </summary>

        <div className="p-5">
          {entries.length === 0 ? (
            <div className="text-center py-6 text-xs" style={{ color: "var(--ink-mute)" }}>
              <div className="mb-2">📝 還沒有任何所得明細</div>
              <div className="mb-3">建議直接從「綜合所得稅結算申報書」逐筆抄入,系統會自動加總並對應到上方 ① 各成員所得</div>
            </div>
          ) : (
            <>
              {/* 類別篩選 */}
              <div className="flex flex-wrap gap-1 mb-3">
                <button className={`btn-secondary text-xs ${filter === "all" ? "border-2" : ""}`}
                  style={filter === "all" ? { borderColor: "var(--accent)" } : {}}
                  onClick={() => setFilter("all")}>
                  全部 ({entries.length})
                </button>
                {Object.entries(INCOME_CATEGORIES).map(([key, cat]) => {
                  const cnt = grouped[key]?.length || 0;
                  if (cnt === 0) return null;
                  return (
                    <button key={key}
                      className={`btn-secondary text-xs ${filter === key ? "border-2" : ""}`}
                      style={filter === key ? { borderColor: "var(--accent)" } : {}}
                      onClick={() => setFilter(key)}>
                      {cat.label} ({cnt})
                    </button>

                })}
                <span className="border-l mx-2" style={{ borderColor: "var(--line)" }}></span>
                <button className={`btn-secondary text-xs ${memberFilter === "all" ? "border-2" : ""}`}

                  按成員分組顯示

              </div>

              {/* 每個成員的所得小計卡片 */}
              {memberSummary.length > 0 && (
                <div className="grid grid-cols-2 md:grid-cols-3 gap-2 mb-3">
                  {memberSummary.map(s => (
                    <div key={s.member.id} className="p-2 rounded text-xs" style={{ background: "#fafaf6", border: "1px solid var(--line)" }}>

function DeductionOverrideInput({ autoValue, overrideValue, currentValue, onChange }) {
  const hasOverride = overrideValue !== undefined && overrideValue !== null && overrideValue !== "";
  return (
    <div className="flex items-center justify-end gap-1">
      <input
        type="text"
        inputMode="numeric"
        className="text-right text-sm num px-2 py-1 rounded w-28"
        style={{
          background: hasOverride ? "#fef9ec" : "transparent",
          border: hasOverride ? "1px dashed var(--gold)" : "1px dashed transparent",
          color: hasOverride ? "var(--gold)" : "var(--ink)",
        }}
        defaultValue={hasOverride ? String(overrideValue) : String(currentValue)}
        key={`${hasOverride}_${overrideValue}_${currentValue}`}
        placeholder={fmt(autoValue)}
        onChange={e => {
          const v = e.target.value.replace(/[^\d-]/g, "");
          if (v === "") {
            onChange(undefined);
          } else if (toNum(v) === autoValue && !hasOverride) {
            // 沒 override 且 value 等於 auto:不變
          } else {
            onChange(v);
          }
        }}
        title="點擊修改 (留空會還原為自動)"
      />
      {hasOverride && (
        <button
          className="text-[10px] hover:underline px-1"
          style={{ color: "var(--ink-mute)" }}
          onClick={() => onChange(undefined)}
          title={`還原為自動值 ${fmt(autoValue)}`}
        >↻</button>
      )}
    </div>
  );
}

                            <td className="text-center font-medium" style={{ color: "var(--accent-deep)" }}>{fmt(sub2.net)}</td>
                            <td className="text-center">×</td>
                            <td className="text-center">{(sub2.taxRate * 100).toFixed(0)}%</td>
                            <td className="text-center">=</td>
                            <td className="text-center font-medium" style={{ color: "var(--accent-deep)" }}>{fmt(sub2.tax)}</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>

                    {/* === 第三段:合計 === */}

                    </div>

              // 合併計算 (A 方法):原本一段

                <>

                        <th className="text-center font-normal underline-offset-2 underline">全部扣除額</th>
                        <th className="text-center font-normal w-6">減</th>

                      <tr style={{ color: "var(--ink-mute)" }}>

                        <th className="text-center font-normal w-6">乘</th>
                        <th className="text-center font-normal underline-offset-2 underline">稅率</th>
                        <th className="text-center font-normal w-6">減</th>
                        <th className="text-center font-normal underline-offset-2 underline">累進差額</th>
                        <th className="text-center font-normal w-6">等於</th>
                        <th className="text-center font-normal underline-offset-2 underline">應納稅額</th>

              <tbody>

                  <td className="text-center">{fmt(prepaidTax)}</td>
                  <td className="text-center">−</td>
                  <td className="text-center">{fmt(dividendCredit)}</td>
                  <td className="text-center">−</td>
                  <td className="text-center" style={{ color: "var(--ink-mute)" }}>0</td>

                <span className="font-medium" style={{ color: "var(--green)" }}>

                  <DeductionOverrideInput
                    autoValue={result.disabilityDedAuto || 0}
                    overrideValue={filing.disabilityDedOverride}
                    currentValue={result.disabilityDed || 0}

              <tr style={{ borderBottom: "1px solid var(--line)" }}>

                    {result.studentCount || 0} 人 × {fmt(result.params.educationDeduction)}
