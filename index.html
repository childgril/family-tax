                <td className="px-3 py-2 text-right">
                  <DeductionOverrideInput
                    autoValue={result.preschoolDedAuto || 0}
                    overrideValue={filing.preschoolDedOverride}
                    currentValue={result.preschoolDed || 0}
                    onChange={(val) => onChange({ ...filing, preschoolDedOverride: val === undefined ? "" : val })}
                  />
                </td>
              </tr>
              <tr style={{ borderBottom: "1px solid var(--line)" }}>
                <td className="px-3 py-2">
                  7. 長期照顧特別扣除額
                  <div className="text-[10px]" style={{ color: "var(--ink-mute)" }}>
                    {result.longTermCareCount || 0} 人 × {fmt(result.params.longTermCare)}
                    {filing.longTermCareDedOverride !== undefined && filing.longTermCareDedOverride !== "" && <span className="ml-1" style={{ color: "var(--gold)" }}>✎ 手動</span>}
                  </div>
                </td>
                <td className="px-3 py-2 text-right">
                  <DeductionOverrideInput
                    autoValue={result.longTermCareDedAuto || 0}
                    overrideValue={filing.longTermCareDedOverride}
                    currentValue={result.longTermCareDed || 0}
                    onChange={(val) => onChange({ ...filing, longTermCareDedOverride: val === undefined ? "" : val })}
                  />
                </td>
              </tr>
              {year >= 114 && (
                <tr style={{ borderBottom: "1px solid var(--line)" }}>
                  <td className="px-3 py-2">8. 房屋租金支出特別扣除額</td>
                  <td className="px-3 py-2 text-right">{fmt(result.rentDeductActual || 0)}</td>
                </tr>
              )}
              <tr style={{ background: "#fafaf6", borderTop: "2px solid var(--ink)" }}>
                <td className="px-3 py-2 font-medium">合計</td>
                <td className="px-3 py-2 text-right font-medium">{fmt(totalDeduction)}</td>
              </tr>
            </tbody>
          </table>
        </div>

        {/* === 5. 列舉扣除額明細 (僅當採列舉時顯示) === */}
        {result.useItemized && (
          <div>
            <div className="font-medium mb-2" style={{ color: "var(--accent-deep)" }}>
              ★ 列舉扣除額明細
            </div>
            <table className="w-full text-xs num" style={{ borderCollapse: "collapse" }}>
              <thead>
                <tr style={{ background: "#fafaf6", borderBottom: "1px solid var(--ink)" }}>
                  <th className="px-3 py-1 text-left font-medium">項目</th>
                  <th className="px-3 py-1 text-right font-medium">實際發生</th>
                  <th className="px-3 py-1 text-right font-medium">可扣除</th>
                </tr>
              </thead>
              <tbody>
                {[
                  ["對機關或團體之捐贈 (現金,≤20%綜所)", toNum(itemizedDeductions.donationGeneral), itemizedDetail.donationGeneral || 0],
                  ["對政府捐贈等(不限額)", toNum(itemizedDeductions.donationUnlimited), itemizedDetail.donationUnlimited || 0],
                  ["人身保險費 - 非健保 (每人≤24k)", toNum(itemizedDeductions.insurancePersonal), itemizedDetail.insurancePersonal || 0],
                  ["人身保險費 - 健保 (不限額)", toNum(itemizedDeductions.insuranceHealth), itemizedDetail.insuranceHealth || 0],
                  ["醫藥及生育費 (不限額)", toNum(itemizedDeductions.medical), itemizedDetail.medical || 0],
                  ["災害損失", toNum(itemizedDeductions.disaster), itemizedDetail.disaster || 0],
                  ["自用住宅購屋借款利息", toNum(itemizedDeductions.mortgageInterest), itemizedDetail.mortgageInterest || 0],
                  ...(year < 114 ? [["房屋租金支出", toNum(filing.rentSupportPaid), result.rentDeductActual || 0]] : []),
                ].filter(([_, actual]) => actual > 0).map(([label, actual, allowed], i) => (
                  <tr key={i} style={{ borderBottom: "1px solid var(--line-soft)" }}>
                    <td className="px-3 py-1">{label}</td>
                    <td className="px-3 py-1 text-right">{fmt(actual)}</td>
                    <td className="px-3 py-1 text-right" style={{ color: actual !== allowed ? "var(--gold)" : "inherit" }}>{fmt(allowed)}</td>
                  </tr>
                ))}
                <tr style={{ background: "#fafaf6", borderTop: "2px solid var(--ink)" }}>
                  <td className="px-3 py-2 font-medium" colSpan={2}>可扣除金額合計</td>
                  <td className="px-3 py-2 text-right font-medium">{fmt(result.itemizedTotal || 0)}</td>
                </tr>
              </tbody>
            </table>
          </div>
        )}
      </div>
      </>)}
    </div>
  );
}

// 算式用的單格 (label + value + 運算符)
function FormulaCell({ label, value, sub, highlight, muted, refund }) {
  const display = typeof value === "string" ? value : fmt(value);
  return (
    <div className="text-center" style={{ minWidth: "70px" }}>
      <div className="text-[10px]" style={{ color: muted ? "var(--ink-mute)" : "var(--ink-soft)" }}>{label}</div>
      <div className={`font-serif num ${highlight ? "text-base font-medium" : "text-sm"}`} style={{
        color: muted ? "var(--ink-mute)" : (highlight ? (refund ? "var(--green)" : "var(--accent-deep)") : "var(--ink)"),
        padding: highlight ? "2px 8px" : "0",
        background: highlight ? (refund ? "var(--green-soft, #f5fbef)" : "#fdfcf7") : "transparent",
        borderRadius: highlight ? "3px" : "0",
        border: highlight ? `1px solid ${refund ? "var(--green)" : "var(--accent)"}` : "none",
        display: "inline-block",
      }}>
        {display}
      </div>
      {sub && <div className="text-[9px] mt-0.5" style={{ color: "var(--ink-mute)" }}>{sub}</div>}
    </div>
  );
}

function ResultPanel({ result, year, members, filing }) {
  if (!result) return null;
  const chosen = result.chosenMethod;
  const isSplit = chosen && chosen.formula && (chosen.formula.type === "allSep" || chosen.formula.type === "salarySep");
  const mainMember = chosen && chosen.mainMemberId ? (members || result.filers).find(m => m.id === chosen.mainMemberId) : null;
  const mainName = mainMember ? mainMember.name : "本人";

  return (
    <div className="card" style={{ background: "#fdfcf7", borderColor: "var(--accent)" }}>
      <div className="px-5 py-3 ornament" style={{ borderBottom: "1px solid var(--line)", color: "var(--accent-deep)" }}>

}

// 區塊單元: 顯示 "標籤 (數字)" 並可接運算符
function FCell({ label, value, bold }) {
  // 字串原樣顯示 (例如稅率 "12%"); 數字才走 fmt 千分位
  const display = typeof value === "string" ? value : fmt(value);
  // 把 \n 切開,用 <br/> 顯示真的換行 (CSS pre-line 在某些情境下不可靠)
  const lines = typeof label === "string" ? label.split("\n") : [label];
  return (
    <div className="text-center px-2" style={{ minWidth: "85px" }}>
      <div className="text-[10px] underline" style={{ color: "var(--ink-soft)", lineHeight: "1.2" }}>
        {lines.map((line, i) => (
          <React.Fragment key={i}>
            {i > 0 && <br />}
            {line}
          </React.Fragment>
        ))}
      </div>
      <div className={`num mt-1 ${bold ? "font-semibold" : ""}`} style={{ fontSize: "13px" }}>{display}</div>
    </div>
  );
}
function FOp({ op }) {
  return <div className="self-end pb-0.5 text-base font-semibold mx-1" style={{ color: "var(--ink-soft)" }}>{op}</div>;
}
function FormulaRow({ children, className = "" }) {
  return (
    <div className={`flex items-end flex-wrap gap-y-2 py-2 ${className}`}>
      {children}
    </div>
  );
}

              <tr style={{ background: "#fafaf6", borderBottom: "1px solid var(--line)" }}>
                <th className="text-left px-5 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>申報戶</th>
                <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>綜合所得</th>
                <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>標準</th>
                <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>列舉</th>
                <th className="text-center px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>推薦</th>
                <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>採推薦稅額</th>
                <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>採另一稅額</th>
                <th className="text-right px-5 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>節省</th>
              </tr>
            </thead>
            <tbody>
              {yearFilings.map(f => {
                const filerIds = [f.taxpayerId, f.spouseId, ...(f.dependentIds || [])].filter(Boolean);
                const householdProps = data.properties.filter(p => filerIds.includes(p.ownerId));
                const filingForCompute = { ...f, properties: householdProps, rentalRecords: data.rentalRecords || [], contracts: data.contracts || [], manualRentOverrides: f.manualRentOverrides || {} };
                const result = computeTaxForFiling(filingForCompute, data.members, year);
                if (!result) return null;
                const recommended = result.itemizedTotal > result.standardDeduction ? "itemized" : "standard";
                return (
                  <tr key={f.id} className="table-row">
                    <td className="px-5 py-3 font-medium">{f.name}</td>
                    <td className="px-3 py-3 text-right num">{fmt(result.grossIncome)}</td>
                    <td className="px-3 py-3 text-right num">{fmt(result.standardDeduction)}</td>
                    <td className="px-3 py-3 text-right num">{fmt(result.itemizedTotal)}</td>
                    <td className="px-3 py-3 text-center">
                      <span className={`chip ${recommended === "itemized" ? "chip-green" : "chip-amber"}`}>
                        {recommended === "itemized" ? "列舉" : "標準"}
                      </span>
                    </td>
                    <td className="px-3 py-3 text-right num font-medium">{fmt(Math.min(result.tax, result.altTax))}</td>
                    <td className="px-3 py-3 text-right num" style={{ color: "var(--ink-mute)" }}>{fmt(Math.max(result.tax, result.altTax))}</td>
                    <td className="px-5 py-3 text-right num font-medium" style={{ color: "var(--green)" }}>
                      {fmt(Math.abs(result.tax - result.altTax))}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function HistoryPage({ data }) {
  // 以成員為主軸,看每個人歷年參與的申報戶與稅額分攤
  const memberHistory = data.members.map(m => {
    const records = [];
    AVAILABLE_YEARS.forEach(y => {
      const filings = data.filings.filter(f =>
        f.year === y &&
        (f.taxpayerId === m.id || f.spouseId === m.id || (f.dependentIds || []).includes(m.id))
      );
      filings.forEach(f => {
        const filerIds = [f.taxpayerId, f.spouseId, ...(f.dependentIds || [])].filter(Boolean);
        const householdProps = data.properties.filter(p => filerIds.includes(p.ownerId));
        const result = computeTaxForFiling({ ...f, properties: householdProps, rentalRecords: data.rentalRecords || [], contracts: data.contracts || [], manualRentOverrides: f.manualRentOverrides || {} }, data.members, y);
        if (!result) return;
        const income = f.memberIncome?.[m.id] || {};
        const role = f.taxpayerId === m.id ? "本人" : (f.spouseId === m.id ? "配偶" : "扶養");
        records.push({
          year: y, role, filingName: f.name,
          salary: toNum(income.salary), interest: toNum(income.interest),
          dividend: toNum(income.dividend), other: toNum(income.other),
          householdTax: result.tax,
        });
      });
    });
    return { member: m, records };
  });

  return (
    <div className="fade-in">
      <PageHeader
        ornament="§ HISTORICAL RECORDS · 歷年紀錄"
        title="每位成員的歷史申報"
        subtitle="按成員整理,可看出個人歷年所得變化與所屬申報戶稅額"
      />

      {memberHistory.filter(h => h.records.length > 0).length === 0 && (
        <div className="card p-12 text-center" style={{ color: "var(--ink-mute)" }}>尚無歷史紀錄</div>
      )}

      {memberHistory.map(({ member, records }) => {
        if (records.length === 0) return null;
        return (
          <div key={member.id} className="card mb-5">
            <div className="px-5 py-3 flex items-center justify-between" style={{ borderBottom: "1px solid var(--line)" }}>
              <div>
                <div className="font-serif text-lg">{member.name}</div>
                <div className="text-xs" style={{ color: "var(--ink-mute)" }}>共 {records.length} 筆紀錄</div>
              </div>
              <div className="text-right text-xs" style={{ color: "var(--ink-mute)" }}>
                <div>累計薪資</div>
                <div className="num font-serif text-base" style={{ color: "var(--ink)" }}>
                  {fmt(records.reduce((s, r) => s + r.salary, 0))}
                </div>
              </div>
            </div>
            <table className="w-full text-sm">
              <thead>
                <tr style={{ background: "#fafaf6", borderBottom: "1px solid var(--line)" }}>
                  <th className="text-left px-5 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>年度</th>
                  <th className="text-left px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>申報戶</th>
                  <th className="text-left px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>身分</th>
                  <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>薪資</th>
                  <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>利息</th>
                  <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>股利</th>
                  <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>其他</th>
                  <th className="text-right px-5 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>戶總稅額</th>
                </tr>
              </thead>
              <tbody>
                {records.map((r, i) => (
                  <tr key={i} className="table-row">
                    <td className="px-5 py-2 font-serif">{r.year}</td>
                    <td className="px-3 py-2">{r.filingName}</td>
                    <td className="px-3 py-2"><span className="chip">{r.role}</span></td>
                    <td className="px-3 py-2 text-right num">{fmt(r.salary)}</td>
                    <td className="px-3 py-2 text-right num">{fmt(r.interest)}</td>
                    <td className="px-3 py-2 text-right num">{fmt(r.dividend)}</td>
                    <td className="px-3 py-2 text-right num">{fmt(r.other)}</td>
                    <td className="px-5 py-2 text-right num font-medium">{fmt(r.householdTax)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      })}
    </div>
  );
}

// 資料管理 (匯入/匯出)
// ============================================================
function DataPage({ data, setData }) {
  const fileRef = useRef(null);

  const exportJson = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `家庭綜所稅備份_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const importJson = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const obj = JSON.parse(ev.target.result);
        if (!obj.members || !obj.filings) throw new Error("檔案格式不正確");
        if (!confirm(`確定要匯入此檔案?\n成員: ${obj.members.length}, 申報戶: ${obj.filings.length}, 物件: ${obj.properties?.length || 0}\n\n這會覆蓋現有所有資料。`)) return;
        setData(migrateData({ ...SAMPLE_DATA, ...obj }));
        alert("匯入成功!");
      } catch (err) {
        alert("匯入失敗: " + err.message);
      }
    };
    reader.readAsText(file);
  };

  const clearAll = () => {
    if (!confirm("確定清空所有資料?無法復原!")) return;
    if (!confirm("再次確認:這會刪除所有成員、物件、申報資料")) return;
    setData(SAMPLE_DATA);
  };

  const loadSample = () => {
    if (data.members.length > 0 && !confirm("這會覆蓋現有資料,確定?")) return;
    setData(SAMPLE_FAMILY);
  };

  return (
    <div className="fade-in">
      <PageHeader
        ornament="§ DATA MANAGEMENT · 資料管理"
        title="備份、還原與匯出"
        subtitle="所有資料儲存在你的瀏覽器本機,匯出 JSON 檔可備份或跨裝置使用"
      />

      <div className="grid grid-cols-2 gap-5">
        <div className="card p-5">
          <div className="ornament mb-2">EXPORT · 匯出備份</div>
          <h3 className="font-serif text-lg mb-3">下載 JSON 備份檔</h3>
          <p className="text-sm mb-4" style={{ color: "var(--ink-soft)" }}>
            將所有家庭成員、租賃物件、歷年申報資料匯出為單一 JSON 檔。建議每次更新後備份一次。
          </p>
          <button className="btn-primary w-full" onClick={exportJson}>↓ 匯出所有資料</button>
          <div className="text-xs mt-3 num" style={{ color: "var(--ink-mute)" }}>
            最後儲存: {data.meta.lastSavedAt ? new Date(data.meta.lastSavedAt).toLocaleString("zh-TW") : "—"}
          </div>
        </div>

        <div className="card p-5">
          <div className="ornament mb-2">IMPORT · 匯入備份</div>
          <h3 className="font-serif text-lg mb-3">從 JSON 檔還原</h3>
          <p className="text-sm mb-4" style={{ color: "var(--ink-soft)" }}>
            上傳先前匯出的 JSON 備份檔。<span style={{ color: "var(--red)" }}>注意:會覆蓋現有所有資料。</span>
          </p>
          <input type="file" accept=".json" ref={fileRef} onChange={importJson} className="hidden" />
          <button className="btn-secondary w-full" onClick={() => fileRef.current?.click()}>↑ 選擇 JSON 檔匯入</button>
        </div>

        <div className="card p-5">
          <div className="ornament mb-2">SAMPLE · 範例資料</div>
          <h3 className="font-serif text-lg mb-3">載入範例家庭</h3>
          <p className="text-sm mb-4" style={{ color: "var(--ink-soft)" }}>
            載入一個七人家庭範例 (夫妻+子女+祖父母+單身手足),含多種租賃情境,快速體驗系統。
          </p>
          <button className="btn-secondary w-full" onClick={loadSample}>★ 載入範例家庭</button>
        </div>

        <div className="card p-5" style={{ borderColor: "var(--red)" }}>
          <div className="ornament mb-2" style={{ color: "var(--red)" }}>DANGER · 危險區</div>
          <h3 className="font-serif text-lg mb-3">清空所有資料</h3>
          <p className="text-sm mb-4" style={{ color: "var(--ink-soft)" }}>
            從頭開始,刪除所有家庭成員、物件、申報資料。建議先匯出備份。
          </p>
          <button className="btn-danger w-full" onClick={clearAll} style={{ border: "1px solid var(--red)" }}>清空所有資料</button>
        </div>
      </div>

      <div className="card p-5 mt-5">
        <div className="ornament mb-2">STORAGE INFO · 儲存資訊</div>
        <div className="grid grid-cols-3 gap-4 text-sm">
          <div>
            <div className="text-xs" style={{ color: "var(--ink-mute)" }}>成員數</div>
            <div className="num font-serif text-xl">{data.members.length}</div>
          </div>
          <div>
            <div className="text-xs" style={{ color: "var(--ink-mute)" }}>物件數</div>
            <div className="num font-serif text-xl">{data.properties.length}</div>
          </div>
          <div>
            <div className="text-xs" style={{ color: "var(--ink-mute)" }}>申報戶歷史</div>
            <div className="num font-serif text-xl">{data.filings.length}</div>
          </div>
        </div>
        <div className="text-xs mt-3 p-3 rounded" style={{ background: "#fafaf6", color: "var(--ink-soft)" }}>
          ※ 本系統不傳送資料到任何伺服器,所有資料只存在你的瀏覽器中 (localStorage)。
          清除瀏覽器資料會遺失所有紀錄,請定期匯出 JSON 備份。
        </div>
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null, info: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { this.setState({ info }); console.error("ErrorBoundary caught:", error, info); }
  render() {
    if (this.state.error) {
      return (
        <div className="p-8" style={{ background: "#fef5f5", border: "2px solid #c83232", borderRadius: 6, margin: 20 }}>
          <div className="font-serif text-lg mb-2" style={{ color: "#c83232" }}>⚠ 頁面發生錯誤</div>
          <div className="text-sm mb-3" style={{ color: "var(--ink-soft)" }}>
            程式碰到 runtime 錯誤導致渲染中止。可以試試:
            <ol className="list-decimal list-inside mt-2 space-y-1">
              <li>重新整理頁面 (Cmd/Ctrl + R)</li>
              <li>切到其他頁(例如「家庭成員」)再回來</li>
              <li>把錯誤訊息(下方)貼給開發者</li>
            </ol>
          </div>
          <div className="p-3 rounded text-xs num" style={{ background: "white", border: "1px solid var(--line)", maxHeight: 300, overflow: "auto" }}>
            <div className="font-medium mb-1">錯誤訊息:</div>
            <pre style={{ whiteSpace: "pre-wrap" }}>{String(this.state.error?.message || this.state.error)}</pre>
            {this.state.error?.stack && (
              <>
                <div className="font-medium mt-2 mb-1">Stack trace:</div>
                <pre style={{ whiteSpace: "pre-wrap", color: "var(--ink-mute)" }}>{this.state.error.stack.split("\n").slice(0, 8).join("\n")}</pre>
              </>
            )}
          </div>
          <button className="btn-primary text-xs mt-3" onClick={() => this.setState({ error: null, info: null })}>
            ↻ 嘗試恢復
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

function App() {
  const [page, setPage] = useState("dashboard");
  const [year, setYear] = useState(DEFAULT_YEAR);
  const [data, setData] = useState(() => loadData());

  useEffect(() => { saveData(data); }, [data]);

  const props = { data, setData, year, setPage };

  return (
    <div className="flex min-h-screen">
      <Sidebar current={page} onNav={setPage} year={year} onYearChange={setYear} data={data} />
      <main className="flex-1 overflow-y-auto" style={{ background: "var(--bg)" }}>
        <div className="p-8 max-w-[1800px] mx-auto">
          {page === "dashboard" && <Dashboard {...props} />}
          {page === "members" && <MembersPage {...props} />}
          {page === "properties" && <PropertiesPage {...props} />}
          {page === "contracts" && <ContractsPage {...props} />}
          {page === "filing" && <ErrorBoundary><FilingPage {...props} /></ErrorBoundary>}
          {page === "compare" && <ComparePage {...props} />}
          {page === "history" && <HistoryPage {...props} />}
          {page === "sources" && <SourcesPage {...props} />}
          {page === "data" && <DataPage {...props} />}
          {page === "help" && <HelpPage {...props} />}
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
