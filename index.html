  );
}

// ============================================================
// CSV 解析 + 匯入工具
// ============================================================
function parseCSV(text) {
  // 簡單 CSV 解析,支援 "..." 內含逗號與雙引號跳脫 ""
  const lines = [];
  let row = [];
  let cur = "";
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; }
      else if (ch === '"') { inQuotes = false; }
      else { cur += ch; }
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { row.push(cur); cur = ""; }
      else if (ch === '\n') { row.push(cur); lines.push(row); row = []; cur = ""; }
      else if (ch === '\r') { /* ignore */ }
      else cur += ch;
    }
  }
  if (cur.length > 0 || row.length > 0) { row.push(cur); lines.push(row); }
  return lines.filter(r => r.some(c => c.trim() !== ""));
}

// 嘗試多種日期格式,回傳 ROC 7 碼字串 (例 "1140810")
function normalizeRocDateString(s) {
  if (!s) return "";
  const str = String(s).trim();
  if (!str) return "";
  // 已是 7 碼
  if (/^\d{7}$/.test(str)) return str;
  // 民國 + 分隔符: "114/8/10" / "114-8-10" / "114.8.10"
  let m = str.match(/^(\d{2,3})[\/\.\-年](\d{1,2})[\/\.\-月](\d{1,2})/);
  if (m) {
    return `${m[1].padStart(3, "0")}${m[2].padStart(2, "0")}${m[3].padStart(2, "0")}`;
  }
  // 西元: "2025/8/10" / "2025-08-10"
  m = str.match(/^(20\d{2})[\/\.\-](\d{1,2})[\/\.\-](\d{1,2})/);
  if (m) {
    const roc = Number(m[1]) - 1911;
    return `${String(roc).padStart(3, "0")}${m[2].padStart(2, "0")}${m[3].padStart(2, "0")}`;
  }
  return str; // 解析不出來,原樣回傳讓使用者編輯
}

// 由地址查現有物件,若無則建立新的並回傳
function findOrCreatePropertyByAddress(properties, address, ownerId, name) {
  const norm = (s) => String(s || "").trim();
  const target = norm(address);
  if (!target) return null;
  const existing = properties.find(p => norm(p.address) === target || norm(p.name) === target);
  if (existing) return { property: existing, isNew: false };
  const newProp = {
    id: uid(),
    name: name || target.slice(0, 30),
    address: target,
    ownerId: ownerId || (properties[0] && properties[0].ownerId) || "",
    type: "general",
    monthlyRent: 0,
    months: 12,
    expenseRatio: 0.43,
    note: "(從 CSV 匯入時自動建立)",
    taxFreeReason: "",
  };
  return { property: newProp, isNew: true };
}

// CSV 下載 helper (加 BOM 讓 Excel 顯示中文正確)
function downloadCSVHelper(filename, content) {
  const blob = new Blob(["\uFEFF" + content], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

// 解析一個 boolean 欄位
function parseBool(v) {
  const s = String(v || "").trim().toLowerCase();
  return s === "1" || s === "true" || s === "y" || s === "yes" || s === "v" || s === "✓" || s === "公益" || s === "公益出租";
}

              <option value="all">全部</option>
              {[...data.properties].sort((a,b) => String(a.serial||"").localeCompare(String(b.serial||""), "zh-Hant", {numeric:true}))
                .map(p => <option key={p.id} value={p.id}>{p.serial && `${p.serial} · `}{p.name}</option>)}
            </select>
          </div>
          <div className="flex items-center gap-2">
            <label className="text-xs" style={{ color: "var(--ink-soft)" }}>租客</label>
            <input className="input-text text-xs py-1 w-32" placeholder="姓名或電話"
              value={filterTenant} onChange={e => setFilterTenant(e.target.value)} />
          </div>
          <div className="flex items-center gap-2">
            <label className="text-xs" style={{ color: "var(--ink-soft)" }}>類型</label>
            <div className="flex gap-1">
              {[
                { v: "all", label: "全部" },
                { v: "general", label: "一般" },
                { v: "public", label: "公益" },
              ].map(opt => (
                <button key={opt.v}
                  className={`text-xs px-2 py-1 rounded ${filterType === opt.v ? "font-medium" : ""}`}
                  style={{
                    background: filterType === opt.v ? "var(--accent-soft)" : "white",
                    border: `1px solid ${filterType === opt.v ? "var(--accent)" : "var(--line)"}`,
                    color: filterType === opt.v ? "var(--accent-deep)" : "var(--ink-soft)"
                  }}
                  onClick={() => setFilterType(opt.v)}>{opt.label}</button>
              ))}
            </div>
          </div>
          <div className="flex-1"></div>
          <div className="text-xs" style={{ color: "var(--ink-mute)" }}>
            顯示 <b>{filtered.length}</b> / {(data.contracts || []).length} 份合約
          </div>
          {(filterProp !== "all" || filterTenant || filterType !== "all") && (
            <button className="btn-secondary text-xs"
              onClick={() => { setFilterProp("all"); setFilterTenant(""); setFilterType("all"); }}>
              清除篩選
            </button>
          )}
        </div>
      )}

      {/* 匯入工具區 */}
      {importing && (
        <div className="card mb-5 p-5" style={{ background: "#fdfcf7", borderColor: "var(--accent)" }}>
          <div className="ornament mb-3" style={{ color: "var(--accent-deep)" }}>BULK IMPORT · 批次匯入</div>
          <div className="grid grid-cols-2 gap-5">
            {/* 物件 CSV */}
            <div>
              <div className="font-medium text-sm mb-2">① 匯入出租物件</div>
              <div className="text-xs mb-3" style={{ color: "var(--ink-soft)" }}>
                CSV 欄位: <code className="num">序號, 屋主, 地址, 備註</code>
              </div>
              <div className="flex gap-2">
                <button className="btn-secondary text-xs"
                  onClick={() => downloadCSV("物件範本.csv", PROPERTIES_CSV_SAMPLE)}>
                  ↓ 下載範本
                </button>
                <input type="file" accept=".csv" ref={fileRefProperties}
                  onChange={importPropertiesCSV} className="hidden" />
                <button className="btn-primary text-xs"
                  onClick={() => fileRefProperties.current?.click()}
                  disabled={data.members.length === 0}>
                  ↑ 上傳 CSV
                </button>
              </div>
              <div className="text-[10px] mt-2" style={{ color: "var(--ink-mute)" }}>
                ⓘ「屋主」欄請填家庭成員的姓名 (例:陳大年);找不到時用第一個成員
              </div>
            </div>

            {/* 合約 CSV */}
            <div>
              <div className="font-medium text-sm mb-2">② 匯入租賃合約</div>
              <div className="text-xs mb-3" style={{ color: "var(--ink-soft)" }}>
                CSV 欄位: <code className="num text-[10px]">物件地址, 租客姓名, 電話, 租期起, 租期迄, 月租, 管理費, 押金, 負責出租人, 公益出租, 公益期間, 公益登記人, 備註</code>
              </div>
              <div className="flex gap-2">
                <button className="btn-secondary text-xs"
                  onClick={() => downloadCSV("合約範本.csv", CONTRACTS_CSV_SAMPLE)}>
                  ↓ 下載範本
                </button>
                <input type="file" accept=".csv" ref={fileRefContracts}
                  onChange={importContractsCSV} className="hidden" />
                <button className="btn-primary text-xs"
                  onClick={() => fileRefContracts.current?.click()}
                  disabled={data.members.length === 0}>
                  ↑ 上傳 CSV
                </button>
              </div>
              <div className="text-[10px] mt-2" style={{ color: "var(--ink-mute)" }}>
                ⓘ 公益出租欄填 <b>是 / Y / 1 / 公益</b> 都算是;空白為一般合約
              </div>
            </div>
          </div>

          <div className="mt-4 p-3 rounded text-xs" style={{ background: "white", border: "1px solid var(--line)", color: "var(--ink-soft)" }}>
            <div className="font-medium mb-1">📋 從 Excel 製作 CSV 的方法</div>
            <div className="space-y-1">
              <div>1. 在 Excel 開新檔,把資料貼進去,標題列照範本順序排好</div>
              <div>2. 檔案 → 另存新檔 → 選 <b>「CSV UTF-8 (逗號分隔)」</b>格式</div>
              <div>3. 回到本系統點「↑ 上傳 CSV」</div>
              <div className="mt-2" style={{ color: "var(--accent-deep)" }}>
                💡 <b>地址匹配規則</b>:CSV 裡「物件地址」會自動找已存在的物件;若沒找到,系統會自動建立新物件 (以該地址當名稱)。
              </div>
              <div style={{ color: "var(--accent-deep)" }}>
                💡 <b>日期格式</b>:支援 <code className="num">1140810</code> / <code className="num">114/8/10</code> / <code className="num">2025/8/10</code> 三種寫法。
              </div>
            </div>
          </div>

          {/* 匯出按鈕 */}
          <div className="mt-4 pt-3 flex gap-2" style={{ borderTop: "1px solid var(--line)" }}>
            <div className="text-xs flex-1" style={{ color: "var(--ink-soft)" }}>
              將現有資料匯出為 CSV,方便在 Excel 中編輯後再匯入:
            </div>
            <button className="btn-secondary text-xs"
              onClick={() => {
                if ((data.properties || []).length === 0) return alert("沒有物件可匯出");
                const rows = [PROPERTIES_CSV_HEADERS.join(",")];
                // 依序號排序匯出
                const sorted = [...data.properties].sort((a, b) =>
                  String(a.serial || "").localeCompare(String(b.serial || "")));
                sorted.forEach(p => {
                  const owner = data.members.find(m => m.id === p.ownerId);
                  rows.push([
                    JSON.stringify(p.serial || ""),
                    JSON.stringify(owner?.name || ""),
                    JSON.stringify(p.address || ""),
                    JSON.stringify(p.note || "")
                  ].join(","));
                });
                downloadCSV(`物件_${new Date().toISOString().slice(0,10)}.csv`, rows.join("\n"));
              }}>
              ↓ 匯出物件 CSV
            </button>
            <button className="btn-secondary text-xs"
              onClick={() => {
                if ((data.contracts || []).length === 0) return alert("沒有合約可匯出");
                const rows = [CONTRACTS_CSV_HEADERS.join(",")];
                // 依物件序號 → 類型 → 起日排序
                const sorted = [...data.contracts].sort((a, b) => {
                  const pa = data.properties.find(x => x.id === a.propertyId);
                  const pb = data.properties.find(x => x.id === b.propertyId);
                  const sa = String(pa?.serial || ""), sb = String(pb?.serial || "");
                  if (sa !== sb) return sa.localeCompare(sb);
                  return String(a.startDate || "").localeCompare(String(b.startDate || ""));
                });
                sorted.forEach(c => {
                  const p = data.properties.find(x => x.id === c.propertyId);
                  const typeLabel = (c.contractType === "public" || c.isPublicLandlord) ? "公益" : "一般";
                  rows.push([
                    JSON.stringify(p?.serial || ""),
                    JSON.stringify(typeLabel),
                    JSON.stringify(c.tenantName || ""),
                    JSON.stringify(c.tenantPhone || ""),
                    JSON.stringify(c.startDate || ""),
                    JSON.stringify(c.endDate || ""),
                    JSON.stringify(c.monthlyRent || 0),
                    JSON.stringify(c.managementFee || 0),
                    JSON.stringify(c.deposit || 0),
                    JSON.stringify(c.landlordOwner || ""),
                    JSON.stringify(c.note || "")
                  ].join(","));
                });
                downloadCSV(`合約_${new Date().toISOString().slice(0,10)}.csv`, rows.join("\n"));
              }}>
              ↓ 匯出合約 CSV
            </button>
          </div>
        </div>
      )}

      {(data.contracts || []).length === 0 ? (
        <div className="card p-12 text-center" style={{ color: "var(--ink-mute)" }}>
          <div className="text-4xl mb-3">▦</div>
          <div className="font-serif text-lg mb-1">尚無合約資料</div>
          <div className="text-sm">
            {data.members.length === 0 ? "請先建立家庭成員" : "點右上角「新增合約」或「匯入 / 匯出」批次上傳"}
          </div>
        </div>
      ) : (
        <div className="card overflow-hidden">
          <table className="w-full text-sm">
            <thead>
              <tr style={{ background: "#fafaf6", borderBottom: "1px solid var(--line)" }}>
                {colTh("propertySerial", "物件", "text-left px-3 py-2")}
                {colTh("tenant", "租客", "text-left px-3 py-2")}
                {colTh("startDate", "租期起", "text-left px-3 py-2")}
                {colTh("endDate", "租期迄", "text-left px-3 py-2")}
                {colTh("monthlyRent", "月租", "text-right px-3 py-2")}
                <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>管理費</th>
                <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>押金</th>
                <th className="text-center px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>類型</th>
                {colTh("thisYearRent", `${year}年度租金`, "text-right px-3 py-2")}
                <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>操作</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(c => {
                const prop = data.properties.find(p => p.id === c.propertyId);
                const calc = computeForContract(c);
                return (
                  <tr key={c.id} className="table-row">
                    <td className="px-3 py-2">
                      <div className="text-xs">
                        {prop?.serial && <span className="num font-medium mr-1">{prop.serial}</span>}
                        {prop?.name || "—"}
                      </div>
                    </td>
                    <td className="px-3 py-2">
                      <div className="text-xs font-medium">{c.tenantName || "—"}</div>
                      {c.tenantPhone && <div className="text-[10px]" style={{ color: "var(--ink-mute)" }}>{c.tenantPhone}</div>}
                    </td>
                    <td className="px-3 py-2 text-xs num">{c.startDate || "—"}</td>
                    <td className="px-3 py-2 text-xs num">
                      {c.endDate || "—"}
                      {calc.totalMonths > 0 && <div className="text-[10px]" style={{ color: "var(--ink-mute)" }}>共 {calc.totalMonths} 個月</div>}
                    </td>
                    <td className="px-3 py-2 text-right num">{fmt(c.monthlyRent)}</td>
                    <td className="px-3 py-2 text-right num text-xs" style={{ color: "var(--ink-mute)" }}>{fmt(c.managementFee)}</td>
                    <td className="px-3 py-2 text-right num text-xs" style={{ color: "var(--ink-mute)" }}>{fmt(c.deposit)}</td>
                    <td className="px-3 py-2 text-center">
                      {(c.contractType === "public" || c.isPublicLandlord) ?
                        <span className="chip chip-green text-[10px]">公益</span> :
                        <span className="chip chip-amber text-[10px]">一般</span>}
                    </td>
                    <td className="px-3 py-2 text-right num text-xs font-medium" style={{ color: calc.thisYear > 0 ? "var(--accent-deep)" : "var(--ink-mute)" }}>
                      {calc.thisYear > 0 ? (
                        <>
                          {fmt(calc.thisYear)}
                          <div className="text-[10px]" style={{ color: "var(--ink-mute)" }}>{calc.thisYearMonths} 個月</div>
                        </>
                      ) : "—"}
                    </td>
                    <td className="px-3 py-2 text-right space-x-1">
                      <button className="btn-secondary text-xs" onClick={() => setEditing(c)}>編輯</button>
                      <button className="btn-danger text-xs" onClick={() => remove(c.id)}>刪除</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      <div className="mt-5 p-4 rounded text-xs" style={{ background: "#fafaf6", color: "var(--ink-soft)", border: "1px solid var(--line)" }}>
        ⓘ <b>跨年合約如何攤分</b>:系統用「合約期間在該年度內的月數 × 月租金」自動計算。例:114/8/10~115/8/10 月租 5,500
        → 114 年計入 5 個月 (8-12月) = 27,500;115 年計入 8 個月 (1-8月) = 44,000。<br/>
        ⓘ <b>手動覆寫</b>:在「本年度試算 → ⑥ 租賃紀錄」可以手動覆寫某物件某年度的應稅金額。<br/>
        ⓘ <b>公益出租人</b>:勾選「公益出租」後,該合約適用「每月免稅 15,000,超出部分必要費用 60%」的優惠。
      </div>

      {editing && (
        <ContractModal
          contract={editing}
          properties={data.properties}
          members={data.members}
          onSave={save}
          onClose={() => setEditing(null)}
        />
      )}
    </div>
  );
}

function ContractModal({ contract, properties, members, onSave, onClose }) {
  // 初始化 contractType (向後相容: 舊資料的 isPublicLandlord=true → 設為 public)
  const initial = { ...contract };
  if (!initial.contractType) {
    initial.contractType = initial.isPublicLandlord ? "public" : "general";
  }
  const [c, setC] = useState(initial);

  // 預覽: 全合約總額 / 各年度攤分
  const preview = (() => {
    const s = parseRocDate(c.startDate);
    const e = parseRocDate(c.endDate);
    if (!s || !e) return null;
    const sJs = rocToDate(s), eJs = rocToDate(e);
    const totalMonths = (eJs.getFullYear() - sJs.getFullYear()) * 12 + (eJs.getMonth() - sJs.getMonth()) + 1;
    if (totalMonths <= 0) return null;
    const monthly = toNum(c.monthlyRent);
    const total = monthly * totalMonths;
    const years = [];
    for (let y = s.y; y <= e.y; y++) {
      const m = monthsInYear(s, e, y);
      if (m > 0) years.push({ year: y, months: m, rent: m * monthly });
    }
    return { totalMonths, total, years };
  })();

  const isPublic = c.contractType === "public";

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center" style={{ background: "rgba(26,29,35,0.4)" }} onClick={onClose}>
      <div className="card w-[680px] max-h-[90vh] overflow-y-auto p-6" onClick={e => e.stopPropagation()}>
        <div className="ornament mb-2">{c.id ? "EDIT CONTRACT" : "NEW CONTRACT"}</div>
        <h2 className="font-serif text-xl mb-4">{c.id ? "編輯合約" : "新增租賃合約"}</h2>

        <div className="space-y-3">
          {/* 合約類型: 一般 vs 公益 */}
          <Field label="合約類型" hint="同一物件可同時有「一般合約」+「公益出租」兩份合約獨立存在">
            <div className="grid grid-cols-2 gap-2">
              <label className={`p-3 rounded cursor-pointer border ${!isPublic ? "border-2" : ""}`}
                style={{ borderColor: !isPublic ? "var(--accent)" : "var(--line)", background: !isPublic ? "var(--accent-soft)" : "white" }}>
                <input type="radio" name="contractType" value="general"
                  checked={!isPublic} onChange={() => setC({ ...c, contractType: "general", isPublicLandlord: false })}
                  className="mr-2" />
                <span className="text-sm font-medium">一般出租合約</span>
                <div className="text-xs mt-1 ml-5" style={{ color: "var(--ink-mute)" }}>
                  43% 必要費用,計入應稅租金所得
                </div>
              </label>
              <label className={`p-3 rounded cursor-pointer border ${isPublic ? "border-2" : ""}`}
                style={{ borderColor: isPublic ? "var(--green)" : "var(--line)", background: isPublic ? "var(--green-soft)" : "white" }}>
                <input type="radio" name="contractType" value="public"
                  checked={isPublic} onChange={() => setC({ ...c, contractType: "public", isPublicLandlord: true })}
                  className="mr-2" />
                <span className="text-sm font-medium">公益出租合約</span>
                <div className="text-xs mt-1 ml-5" style={{ color: "var(--ink-mute)" }}>
                  每月免稅 15,000,超出部分費用率 60%
                </div>
              </label>
            </div>
          </Field>

          <div className="grid grid-cols-2 gap-3">
            <Field label="物件">
              <select className="input-text-plain w-full" value={c.propertyId} onChange={e => setC({...c, propertyId: e.target.value})}>
                {properties.map(p => <option key={p.id} value={p.id}>
                  {p.serial && `${p.serial} · `}{p.name} {p.address && `(${p.address})`}
                </option>)}
              </select>
            </Field>
            <Field label="負責出租人 (誰簽的)">
              <input className="input-text-plain w-full" value={c.landlordOwner} onChange={e => setC({...c, landlordOwner: e.target.value})} placeholder="如:湯三姐 / 公司" />
            </Field>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <Field label="租客姓名">
              <input className="input-text-plain w-full" value={c.tenantName} onChange={e => setC({...c, tenantName: e.target.value})} />
            </Field>
            <Field label="租客電話">
              <input className="input-text-plain w-full" value={c.tenantPhone} onChange={e => setC({...c, tenantPhone: e.target.value})} placeholder="0912-345678" />
            </Field>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <Field label={isPublic ? "公益期間起" : "租期起 (民國日期)"} hint="格式:1140810 或 114/08/10">
              <input className="input-text w-full" value={c.startDate} onChange={e => setC({...c, startDate: e.target.value})} placeholder="1140810" />
            </Field>
            <Field label={isPublic ? "公益期間迄" : "租期迄"} hint="同上格式">
              <input className="input-text w-full" value={c.endDate} onChange={e => setC({...c, endDate: e.target.value})} placeholder="1150810" />
            </Field>
          </div>

          <div className="grid grid-cols-3 gap-3">
            <Field label={isPublic ? "公益登記月租 ★稅務以此計算" : "月租金"}>
              <input type="number" className="input-text w-full text-right" value={c.monthlyRent} onChange={e => setC({...c, monthlyRent: e.target.value})} />
            </Field>
            <Field label="管理費 (不計稅)">
              <input type="number" className="input-text w-full text-right" value={c.managementFee} onChange={e => setC({...c, managementFee: e.target.value})} />
            </Field>
            <Field label="押金">
              <input type="number" className="input-text w-full text-right" value={c.deposit} onChange={e => setC({...c, deposit: e.target.value})} />
            </Field>
          </div>

          {isPublic && (
            <div className="p-3 rounded text-xs" style={{ background: "var(--green-soft)", border: "1px solid var(--green)", color: "#3d5235" }}>
              💡 <b>公益出租合約計算說明</b>:此合約上的「公益登記月租」會以公益出租人優惠計稅
              (每月免稅 {fmt(15000)},超出部分必要費用 60%)。如果你跟同一租客同期間另有「一般合約」金額,
              請另建一筆「一般合約」記錄實際收的金額(僅作為內部紀錄,稅務不重複計算)。
            </div>
          )}

          <Field label="備註">
            <input className="input-text-plain w-full" value={c.note} onChange={e => setC({...c, note: e.target.value})} placeholder="如:申請補貼、有續住未續簽等" />
          </Field>

          {/* 計算預覽 */}
          {preview && (
            <div className="p-3 rounded" style={{ background: "white", border: "1px solid var(--accent)" }}>
              <div className="ornament mb-2" style={{ color: "var(--accent-deep)" }}>PREVIEW · 攤分預覽</div>
              <div className="text-xs mb-2">
                合約期間共 <b>{preview.totalMonths}</b> 個月,總租金 <span className="num font-medium">{fmt(preview.total)}</span>
              </div>
              <table className="w-full text-xs">
                <thead>
                  <tr style={{ borderBottom: "1px solid var(--line)" }}>
                    <th className="text-left py-1">年度</th>
                    <th className="text-center py-1">月數</th>
                    <th className="text-right py-1">當年度租金</th>
                  </tr>
                </thead>
                <tbody>
                  {preview.years.map(y => (
                    <tr key={y.year}>
                      <td className="py-1">{y.year} 年</td>
                      <td className="text-center num">{y.months}</td>
                      <td className="text-right num font-medium">{fmt(y.rent)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>

        <div className="flex gap-2 justify-end mt-6">
          <button className="btn-secondary" onClick={onClose}>取消</button>
          <button className="btn-primary" onClick={() => {
            if (!c.propertyId) return alert("請選擇物件");
            if (!parseRocDate(c.startDate)) return alert("租期起日期格式不正確");
            if (!parseRocDate(c.endDate)) return alert("租期迄日期格式不正確");
            onSave(c);
          }}>儲存</button>
        </div>
      </div>
    </div>
  );
}

function FilingPage({ data, setData, year, setPage }) {
  const yearFilings = data.filings.filter(f => f.year === year);
  const [selectedId, setSelectedId] = useState(yearFilings[0]?.id || null);
  const selected = yearFilings.find(f => f.id === selectedId);

  useEffect(() => {
    if (yearFilings.length > 0 && !yearFilings.find(f => f.id === selectedId)) {
      setSelectedId(yearFilings[0].id);
    }
  }, [year, data.filings]);

  const addFiling = () => {
    const newFiling = {
      id: uid(),
      year,
      name: `${year}年度·新申報戶`,
      taxpayerId: data.members[0]?.id || "",
      spouseId: "",
      dependentIds: [],
      memberIncome: {},
      itemizedDeductions: {
        donationGeneral: 0, donationUnlimited: 0,
        insurancePersonal: 0, insuranceHealth: 0,
        medical: 0, disaster: 0, mortgageInterest: 0,
      },
      rentSupportPaid: 0,
      deductionChoice: "auto", // auto / standard / itemized
      savingsOverride: false,
      savingsOverrideAmount: 0,
      dividendChoice: "combine", // combine (8.5%抵減) / separate (28%分開)
      taxMethod: "auto", // auto / combined / salarySepTaxpayer / salarySepSpouse / allSepTaxpayer / allSepSpouse
      taxCredits: {
        prepaidTax: 0,
        repurchaseCredit: 0,
        otherCredit: 0,
      },
    };
    setData({ ...data, filings: [...data.filings, newFiling] });
    setSelectedId(newFiling.id);
  };

  const updateFiling = (next) => {
    setData({ ...data, filings: data.filings.map(f => f.id === next.id ? next : f) });
  };

  const deleteFiling = (id) => {
    if (!confirm("確定刪除此申報戶?")) return;
    setData({ ...data, filings: data.filings.filter(f => f.id !== id) });
    if (selectedId === id) setSelectedId(null);
  };

  const cloneFromLastYear = () => {
    // 找上一年度同名申報戶
    const prevYear = year - 1;
    const candidates = data.filings.filter(f => f.year === prevYear);
    if (candidates.length === 0) return alert(`找不到 ${prevYear} 年度的申報戶可複製`);
    const src = candidates[0];
    const newFiling = { ...src, id: uid(), year, name: src.name.replace(`${prevYear}年`, `${year}年`) || `${year}年度` };
    setData({ ...data, filings: [...data.filings, newFiling] });
    setSelectedId(newFiling.id);
  };

  return (
    <div className="fade-in">
      <PageHeader
        ornament={`§ TAX FILING · ${year} 年度試算`}
        title="申報戶與稅額試算"
        subtitle="每個申報戶獨立試算 · 系統自動比較標準/列舉扣除額,選擇較划算者"
        right={
          <div className="space-x-2">
            <button className="btn-secondary text-sm" onClick={() => setPage("sources")}>? 不知道數字從哪來?</button>
            <button className="btn-secondary text-sm" onClick={cloneFromLastYear}>↻ 複製上年度</button>
            <button className="btn-primary text-sm" onClick={addFiling}
              disabled={data.members.length === 0}>+ 新增申報戶</button>
          </div>
        }
      />

      {yearFilings.length === 0 ? (
        <div className="card p-12 text-center" style={{ color: "var(--ink-mute)" }}>
          <div className="text-4xl mb-3">✎</div>
          <div className="font-serif text-lg mb-1">{year} 年度尚無申報戶</div>
          <div className="text-sm">
            {data.members.length === 0 ? "請先到「家庭成員」頁面建立成員" : "點右上角「新增申報戶」開始試算"}
          </div>
        </div>
      ) : (
        <div className="grid grid-cols-[260px_1fr] gap-5">
          {/* 申報戶清單 */}
          <div className="card overflow-hidden" style={{ alignSelf: "flex-start" }}>
            <div className="px-3 py-2 ornament" style={{ borderBottom: "1px solid var(--line)" }}>HOUSEHOLDS</div>
            {yearFilings.map(f => {
              const r = computeFilingWithData(f, data, year);
              return (
                <button key={f.id} onClick={() => setSelectedId(f.id)}
                  className={`w-full text-left px-3 py-3 border-b ${selectedId === f.id ? "" : "hover:bg-gray-50"}`}
                  style={{ borderColor: "var(--line-soft)", background: selectedId === f.id ? "#fafaf6" : "white",
                    borderLeft: selectedId === f.id ? "3px solid var(--accent)" : "3px solid transparent" }}>
                  <div className="text-sm font-medium truncate">{f.name}</div>
                  <div className="text-xs num mt-1" style={{ color: "var(--ink-mute)" }}>應納 {fmt(r?.tax || 0)}</div>
                  <div className="flex gap-1 mt-1">
                    {r?.hasSpouse && <span className="chip text-[10px]">夫妻</span>}
                    {r?.useItemized && <span className="chip chip-green text-[10px]">列舉</span>}
                    {!r?.useItemized && <span className="chip chip-amber text-[10px]">標準</span>}
                  </div>
                </button>
              );
            })}
          </div>

          {/* 申報戶詳細 */}
          {selected && (
            <FilingDetail
              filing={selected}
              members={data.members}
              properties={data.properties}
              rentalRecords={data.rentalRecords || []}
              setRentalRecords={(next) => setData({ ...data, rentalRecords: next })}
              contracts={data.contracts || []}
              setContracts={(next) => setData({ ...data, contracts: next })}
              year={year}
              onChange={updateFiling}
              onDelete={() => deleteFiling(selected.id)}
            />
          )}
        </div>
      )}
    </div>
  );
}

function FilingDetail({ filing, members, properties, rentalRecords, setRentalRecords, contracts, setContracts, year, onChange, onDelete }) {
  // 把 properties 過濾出屬於這申報戶的人持有的
  const filerIds = [filing.taxpayerId, filing.spouseId, ...(filing.dependentIds || [])].filter(Boolean);
  const householdProperties = properties.filter(p => filerIds.includes(p.ownerId));
  // 把該年度的 rentalRecords/合約 帶入 filing 給計算用
  const filingForCompute = { ...filing, properties: householdProperties, rentalRecords, contracts, manualRentOverrides: filing.manualRentOverrides || {} };
  const result = computeTaxForFiling(filingForCompute, members, year);
  const params = TAX_PARAMS[year];

  // 物件 + 該年度紀錄 (含虛擬)
  const yearRecords = householdProperties.map(p => ({
    property: p,
    record: getRentalRecord(rentalRecords, p, year, contracts, filing.manualRentOverrides),
  }));

  // 更新某物件的該年度紀錄
  const upsertRecord = (propertyId, patch) => {
    const idx = rentalRecords.findIndex(r => r.propertyId === propertyId && r.year === year);
    if (idx >= 0) {
      // 既有紀錄
      const next = [...rentalRecords];
      next[idx] = { ...next[idx], ...patch };
      setRentalRecords(next);
    } else {
      // 新建紀錄
      const property = householdProperties.find(p => p.id === propertyId);
      const base = {
        id: uid(),
        propertyId,
        year,
        monthlyRent: property?.monthlyRent || 0,
        months: property?.months || 12,
        type: property?.type || "general",
        expenseRatio: property?.expenseRatio || 0.43,
        taxFreeReason: property?.taxFreeReason || "",
        note: "",
        includeInFiling: true,
        ...patch,
      };
      setRentalRecords([...rentalRecords, base]);
    }
  };

  // 從上一年複製到當前年
  const copyFromPrevYear = (propertyId) => {
    const prev = rentalRecords.find(r => r.propertyId === propertyId && r.year === year - 1);
    if (!prev) return alert(`找不到 ${year - 1} 年度的紀錄`);
    const { id, year: _y, ...rest } = prev;
    upsertRecord(propertyId, { ...rest });
  };

  // 從物件預設值建立
  const initFromProperty = (propertyId) => {
    upsertRecord(propertyId, {});
  };

  // 刪除當前年的紀錄
  const removeRecord = (propertyId) => {
    if (!confirm(`確定刪除此物件 ${year} 年度的紀錄?`)) return;
    setRentalRecords(rentalRecords.filter(r => !(r.propertyId === propertyId && r.year === year)));
  };

  // 手動覆寫合約攤分結果
  const updateRentOverride = (propertyId, patch) => {
    const key = `${propertyId}_${year}`;
    const current = (filing.manualRentOverrides || {})[key] || {};
    onChange({
      ...filing,
      manualRentOverrides: {
        ...(filing.manualRentOverrides || {}),
        [key]: { ...current, ...patch }
      }
    });
  };
  const clearRentOverride = (propertyId) => {
    const key = `${propertyId}_${year}`;
    const overrides = { ...(filing.manualRentOverrides || {}) };
    const current = overrides[key] || {};
    // 只清掉金額,保留 includeInFiling 等其他設定
    const cleaned = { ...current };
    delete cleaned.totalAnnualRent;
    delete cleaned.generalAnnualRent;
    delete cleaned.publicAnnualRent;
    delete cleaned.annualRent; // 舊版相容
    // 如果清完只剩 includeInFiling 預設值,整個刪掉
    if (Object.keys(cleaned).length === 0 || (Object.keys(cleaned).length === 1 && cleaned.includeInFiling !== false)) {
      delete overrides[key];
    } else {
      overrides[key] = cleaned;
    }
    onChange({ ...filing, manualRentOverrides: overrides });
  };

  const taxpayer = members.find(m => m.id === filing.taxpayerId);
  const spouse = members.find(m => m.id === filing.spouseId);

  const updateField = (path, value) => {
    const next = { ...filing };
    const parts = path.split(".");
    let obj = next;
    for (let i = 0; i < parts.length - 1; i++) {
      obj[parts[i]] = { ...obj[parts[i]] };
      obj = obj[parts[i]];
    }
    obj[parts[parts.length - 1]] = value;
    onChange(next);
  };

  const updateIncome = (memberId, key, value) => {
    const next = {
      ...filing,
      memberIncome: {
        ...filing.memberIncome,
        [memberId]: { ...(filing.memberIncome?.[memberId] || {}), [key]: value }
      }
    };
    onChange(next);
  };

  const toggleDependent = (id) => {
    const list = filing.dependentIds || [];
    const next = list.includes(id) ? list.filter(x => x !== id) : [...list, id];
    onChange({ ...filing, dependentIds: next });
  };

  if (!result) return null;

  return (
    <div className="space-y-5">
      {/* 標題列 */}
      <div className="card p-5">
        <div className="flex items-center gap-3 mb-3">
          <input
            className="font-serif text-2xl flex-1 px-2 py-1 border-b-2"
            style={{ borderColor: "var(--line)", background: "transparent" }}
            value={filing.name}
            onChange={e => onChange({ ...filing, name: e.target.value })}
          />
          <button className="btn-danger text-sm" onClick={onDelete}>刪除此申報戶</button>
        </div>

        {/* 申報戶成員選擇 */}
        <div className="grid grid-cols-3 gap-3">
          <Field label="主納稅義務人">
            <select className="input-text-plain w-full" value={filing.taxpayerId}
              onChange={e => onChange({ ...filing, taxpayerId: e.target.value })}>
              <option value="">— 請選擇 —</option>
              {members.map(m => {
                const r = RELATIONS[m.relation];
                return <option key={m.id} value={m.id}>{m.name} ({r?.label || m.relation})</option>;
              })}
            </select>
          </Field>
          <Field label="配偶 (合併申報)">
            <select className="input-text-plain w-full" value={filing.spouseId || ""}
              onChange={e => onChange({ ...filing, spouseId: e.target.value })}>
              <option value="">無 (單身申報)</option>
              {members.filter(m => m.id !== filing.taxpayerId).map(m => {
                const r = RELATIONS[m.relation];
                const isCandidate = r && r.canBeSpouse;
                return <option key={m.id} value={m.id}>
                  {isCandidate ? "★ " : ""}{m.name} ({r?.label || m.relation})
                </option>;
              })}
            </select>
          </Field>
          <Field label="扶養親屬數">
            <div className="input-text-plain w-full bg-gray-50">{(filing.dependentIds || []).length} 人</div>
          </Field>
        </div>

        {/* 扶養親屬勾選 */}
        <div className="mt-3">
          <div className="text-xs mb-2" style={{ color: "var(--ink-soft)" }}>勾選扶養親屬 (圓點顯示稅法限制):</div>
          <div className="flex flex-wrap gap-2">
            {members.filter(m => m.id !== filing.taxpayerId && m.id !== filing.spouseId).map(m => {
              const checked = (filing.dependentIds || []).includes(m.id);
              const r = RELATIONS[m.relation];
              const age = Number(m.age);
              // 判斷此人能否合法扶養
              let okHint = "✓";
              let okColor = "var(--green)";
              if (!r || !r.canBeDependent) { okHint = "✗"; okColor = "var(--red)"; }
              else if ((r.isChild || m.relation === "sibling") && age >= 20 && !m.isStudent && !m.isDisabled && !m.cannotSupportSelf) {
                okHint = "△"; okColor = "var(--gold)";
              } else if (r.isLinealAscendant && age < 60 && !m.cannotSupportSelf && !m.isDisabled) {
                okHint = "△"; okColor = "var(--gold)";
              } else if (m.relation === "other" && !m.coResident) {
                okHint = "△"; okColor = "var(--gold)";
              }
              return (
                <label key={m.id} className={`px-3 py-1.5 rounded cursor-pointer text-sm flex items-center gap-2 border`}
                  style={{ borderColor: checked ? "var(--accent)" : "var(--line)", background: checked ? "var(--accent-soft)" : "white" }}>
                  <input type="checkbox" checked={checked} onChange={() => toggleDependent(m.id)} />
                  <span style={{ color: okColor, fontWeight: 700 }}>{okHint}</span>
                  {m.name} <span className="text-xs" style={{ color: "var(--ink-mute)" }}>({r?.label})</span>
                </label>
              );
            })}
          </div>
        </div>
      </div>

      {/* 警告 / 提示面板 */}
      {result.warnings && result.warnings.length > 0 && (
        <div className="card p-4" style={{ background: "#fdfaf3", borderColor: "var(--gold)" }}>
          <div className="ornament mb-2" style={{ color: "#6b5418" }}>⚠ VALIDATION · 申報戶檢查</div>
          <div className="space-y-1.5 text-sm">
            {result.warnings.map((w, i) => (
              <div key={i} className="flex items-start gap-2">
                <span style={{
                  color: w.level === "error" ? "var(--red)" : (w.level === "warn" ? "var(--gold)" : "var(--ink-mute)"),
                  fontWeight: 700, minWidth: "1.5em"
                }}>
                  {w.level === "error" ? "✗" : (w.level === "warn" ? "⚠" : "ⓘ")}
                </span>
                <span style={{ color: "var(--ink-soft)" }}>{w.msg}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* 各成員所得輸入 */}
      <div className="card">
        <div className="px-5 py-3 ornament" style={{ borderBottom: "1px solid var(--line)" }}>
          ① INCOME · 各成員所得
        </div>
        <div className="p-5">
          <table className="w-full text-sm">
            <thead>
              <tr style={{ borderBottom: "1px solid var(--line)" }}>
                <th className="text-left py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>成員</th>
                <th className="text-right py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>薪資</th>
                <th className="text-right py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>利息</th>
                <th className="text-right py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>股利</th>
                <th className="text-right py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>租金 (自動)</th>
                <th className="text-right py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>其他</th>
              </tr>
            </thead>
            <tbody>
              {result.filers.map(m => {
                const income = filing.memberIncome?.[m.id] || {};
                const myProps = householdProperties.filter(p => p.ownerId === m.id);
                const myComputable = myProps.flatMap(p =>
                  getComputablesForProperty(p, year, contracts, rentalRecords, filing.manualRentOverrides));
                const myRental = computeRentalIncome(myComputable, params);
                const includedCount = myComputable.length;
                return (
                  <tr key={m.id} className="table-row">
                    <td className="py-2 font-medium">
                      {m.name}
                      <div className="text-xs" style={{ color: "var(--ink-mute)" }}>
                        {m.id === filing.taxpayerId ? "本人" : (m.id === filing.spouseId ? "配偶" : "扶養")}
                      </div>
                    </td>
                    <td className="py-2 text-right">
                      <input type="number" className="input-text w-28 text-right"
                        value={income.salary || ""} onChange={e => updateIncome(m.id, "salary", e.target.value)} />
                    </td>
                    <td className="py-2 text-right">
                      <input type="number" className="input-text w-24 text-right"
                        value={income.interest || ""} onChange={e => updateIncome(m.id, "interest", e.target.value)} />
                    </td>
                    <td className="py-2 text-right">
                      <input type="number" className="input-text w-24 text-right"
                        value={income.dividend || ""} onChange={e => updateIncome(m.id, "dividend", e.target.value)} />
                    </td>
                    <td className="py-2 text-right num text-xs" title={myComputable.map(p => p.name).join(", ")}>
                      {fmt(myRental.taxable)}
                      {myProps.length > 0 && <div className="text-[10px]" style={{ color: "var(--ink-mute)" }}>
                        計入 {includedCount}/{myProps.length} 物件
                      </div>}
                    </td>
                    <td className="py-2 text-right">
                      <input type="number" className="input-text w-24 text-right"
                        value={income.other || ""} onChange={e => updateIncome(m.id, "other", e.target.value)} />
                    </td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              <tr className="divider-double" style={{ background: "#fafaf6" }}>
                <td className="py-3 font-medium">總計</td>
                <td className="py-3 text-right num font-medium">{fmt(result.salaryGross)}</td>
                <td className="py-3 text-right num font-medium">{fmt(result.interest)}</td>
                <td className="py-3 text-right num font-medium">{fmt(result.dividend)}</td>
                <td className="py-3 text-right num font-medium">{fmt(result.rentalTaxable)}</td>
                <td className="py-3 text-right num font-medium">{fmt(result.otherIncome)}</td>
              </tr>
            </tfoot>
          </table>

          {/* 儲蓄投資特別扣除額提示 */}
          <div className="mt-4 p-3 rounded" style={{ background: "#fafaf6", border: "1px solid var(--line)" }}>
            <div className="flex items-start justify-between gap-3">
              <div className="flex-1">
                <div className="text-xs font-medium mb-1" style={{ color: "var(--ink-soft)" }}>
                  ⓘ 儲蓄投資特別扣除額 (從利息自動計算)
                </div>
                <div className="text-xs" style={{ color: "var(--ink-mute)" }}>
                  系統自動套用 = min(全戶利息, {fmt(params.savingsDeduction)})。
                  <br />
                  ⚠ 若你的利息包含郵局存簿、公債、公司債、金融債券、短期票券等<b>不適用</b>項目,請勾選下方覆寫。
                </div>
                {filing.savingsOverride ? (
                  <div className="flex items-center gap-2 mt-2">
                    <span className="text-xs">手動指定金額:</span>
                    <input type="number" className="input-text w-32 text-right"
                      value={filing.savingsOverrideAmount || 0}
                      onChange={e => onChange({ ...filing, savingsOverrideAmount: Number(e.target.value) || 0 })} />
                    <span className="text-xs" style={{ color: "var(--ink-mute)" }}>
                      上限 {fmt(params.savingsDeduction)}
                    </span>
                  </div>
                ) : null}
              </div>
              <div className="text-right">
                <div className="text-xs" style={{ color: "var(--ink-mute)" }}>實際採用</div>
                <div className="font-serif text-2xl num" style={{ color: "var(--accent-deep)" }}>
                  {fmt(result.savings)}
                </div>
                {filing.savingsOverride && result.savings !== result.savingsAuto && (
                  <div className="text-xs" style={{ color: "var(--gold)" }}>
                    (覆寫,自動值 {fmt(result.savingsAuto)})
                  </div>
                )}
              </div>
            </div>
            <label className="flex items-center gap-2 mt-3 cursor-pointer text-xs">
              <input type="checkbox"
                checked={!!filing.savingsOverride}
                onChange={e => onChange({ ...filing, savingsOverride: e.target.checked })} />
              <span>手動覆寫儲蓄投資扣除額 (排除不適用利息)</span>
            </label>
          </div>
        </div>
      </div>

      {/* 列舉扣除額輸入 */}
      <div className="card">
        <div className="px-5 py-3 flex items-center justify-between" style={{ borderBottom: "1px solid var(--line)" }}>
          <div className="ornament">② DEDUCTIONS · 一般扣除額</div>
          <div className="flex gap-1">
            {["auto", "standard", "itemized"].map(c => (
              <button key={c} onClick={() => onChange({ ...filing, deductionChoice: c })}
                className={`px-3 py-1 text-xs rounded border ${filing.deductionChoice === c ? "" : ""}`}
                style={{
                  background: filing.deductionChoice === c ? "var(--ink)" : "white",
                  color: filing.deductionChoice === c ? "white" : "var(--ink-soft)",
                  borderColor: filing.deductionChoice === c ? "var(--ink)" : "var(--line)",
                }}>
                {c === "auto" ? "自動選最划算" : c === "standard" ? "強制標準" : "強制列舉"}
              </button>
            ))}
          </div>
        </div>
        <div className="p-5">
          <div className="grid grid-cols-2 gap-4 mb-4">
            <DeductionInput
              label="一般捐贈" hint={`上限 = 綜合所得 20% = ${fmt(result.grossIncome * 0.2)}`}
              value={filing.itemizedDeductions.donationGeneral}
              onChange={v => updateField("itemizedDeductions.donationGeneral", v)} />
            <DeductionInput
              label="不限額捐贈" hint="政府/國防/勞軍/古蹟修復等,不限額"
              value={filing.itemizedDeductions.donationUnlimited}
              onChange={v => updateField("itemizedDeductions.donationUnlimited", v)} />
            <DeductionInput
              label="人身保險費" hint={`每人上限 24,000 × ${result.filers.length}人 = ${fmt(params.insuranceLimit * result.filers.length)}`}
              value={filing.itemizedDeductions.insurancePersonal}
              onChange={v => updateField("itemizedDeductions.insurancePersonal", v)} />
            <DeductionInput
              label="全民健保費" hint="不限額 (含補充保費)"

              onChange={v => updateField("itemizedDeductions.insuranceHealth", v)} />
            <DeductionInput
              label="醫藥及生育費" hint="不限額,須附醫療院所收據"

            <DeductionInput

              onChange={v => updateField("itemizedDeductions.disaster", v)} />
            <DeductionInput
              label="自用住宅購屋借款利息"
              hint={(() => {
                const input = toNum(filing.itemizedDeductions.mortgageInterest);
                if (input === 0) return `一屋為限,實際扣除 = 利息 − 儲蓄投資扣除額 (上限 ${fmt(params.mortgageLimit)})`;
                const afterSavings = Math.max(0, input - result.savings);
                const capped = Math.min(afterSavings, params.mortgageLimit);
                if (capped === input) {
                  return `✓ 全額列入 ${fmt(capped)} (儲蓄扣除額 0)`;
                }
                if (capped === 0) {
                  return `⚠ 儲蓄扣除 ${fmt(result.savings)} 已大於利息,實際列入 0`;
                }
                if (afterSavings > params.mortgageLimit) {
                  return `輸入 ${fmt(input)} − 儲蓄 ${fmt(result.savings)} = ${fmt(afterSavings)},超上限 → 列入 ${fmt(params.mortgageLimit)}`;
                }
                return `輸入 ${fmt(input)} − 儲蓄扣除 ${fmt(result.savings)} = 實際列入 ${fmt(capped)}`;
              })()}
              value={filing.itemizedDeductions.mortgageInterest}
              onChange={v => updateField("itemizedDeductions.mortgageInterest", v)} />
            <DeductionInput
              label="自住房屋租金支出"
              hint={`特扣 (114起改特扣,上限 ${fmt(params.rentDeduction)}),稅率20%以上不得扣`}
              value={filing.rentSupportPaid}

          </div>

          <div className="grid grid-cols-2 gap-3 mt-4">
            <div className="p-3 rounded" style={{
              background: result.useItemized ? "white" : "var(--green-soft)",
              border: result.useItemized ? "1px solid var(--line)" : "2px solid var(--green)"
            }}>
              <div className="text-xs font-medium mb-1">標準扣除額 {!result.useItemized && "✓ 採用"}</div>
              <div className="num font-serif text-xl">{fmt(result.standardDeduction)}</div>
              <div className="text-xs" style={{ color: "var(--ink-mute)" }}>
                {result.hasSpouse ? "夫妻合併 262,000" : "單身 131,000"}
              </div>

            <div className="p-3 rounded" style={{
              background: result.useItemized ? "var(--green-soft)" : "white",

              <div className="text-xs font-medium mb-1">列舉扣除額 {result.useItemized && "✓ 採用"}</div>
              <div className="num font-serif text-xl">{fmt(result.itemizedTotal)}</div>

                <div className="mt-2 space-y-0.5 text-xs">

                    <div className="flex justify-between"><span>不限額捐贈</span><span className="num">{fmt(result.itemizedDetail.donationUnlimited)}</span></div>

                    <div className="flex justify-between"><span>人身保險 (≤24k×人)</span><span className="num">{fmt(result.itemizedDetail.insurancePersonal)}</span></div>
                  )}
                  {result.itemizedDetail.insuranceHealth > 0 && (
                    <div className="flex justify-between"><span>健保費</span><span className="num">{fmt(result.itemizedDetail.insuranceHealth)}</span></div>
                  )}
                  {result.itemizedDetail.medical > 0 && (
                    <div className="flex justify-between"><span>醫藥及生育</span><span className="num">{fmt(result.itemizedDetail.medical)}</span></div>
                  )}
                  {result.itemizedDetail.disaster > 0 && (
                    <div className="flex justify-between"><span>災害損失</span><span className="num">{fmt(result.itemizedDetail.disaster)}</span></div>

                    const rawMortgage = toNum(filing.itemizedDeductions.mortgageInterest);
                    const actual = result.itemizedDetail.mortgageInterest;
                    if (rawMortgage === 0) return null;
                    return (
                      <div className="flex justify-between" style={{ color: actual < rawMortgage ? "var(--gold)" : "inherit" }}>
                        <span>房貸利息 {actual < rawMortgage ? `(${fmt(rawMortgage)}−儲蓄${fmt(result.savings)})` : ""}</span>
                        <span className="num">{fmt(actual)}</span>
                      </div>
                    );
                  })()}
                  <div className="flex justify-between border-t pt-1 mt-1 font-medium" style={{ borderColor: "var(--green)" }}>
                    <span>合計</span><span className="num">{fmt(result.itemizedTotal)}</span>
                  </div>
                </div>
              </details>
            </div>
          </div>
        </div>

      {/* ③ 抵減與已扣繳 */}

        <div className="px-5 py-3 ornament" style={{ borderBottom: "1px solid var(--line)" }}>

        </div>

          {/* 股利課稅方式 */}
          <div>

            <div className="grid grid-cols-2 gap-3">

                style={{ borderColor: (filing.dividendChoice || "combine") === "combine" ? "var(--accent)" : "var(--line)", background: (filing.dividendChoice || "combine") === "combine" ? "#fafaf6" : "white" }}>
                <input type="radio" name="divChoice" value="combine"
                  checked={(filing.dividendChoice || "combine") === "combine"}
                  onChange={() => onChange({ ...filing, dividendChoice: "combine" })} className="mr-2"/>
                <span className="text-sm font-medium">合併計稅,可抵減</span>
                <div className="text-xs mt-1 ml-5" style={{ color: "var(--ink-mute)" }}>
                  股利併入綜所;可用「股利 × 8.5%」抵減稅額,上限 80,000 / 戶
                </div>
                <div className="text-xs ml-5 mt-1 num" style={{ color: "var(--accent-deep)" }}>
                  本戶可抵減: {fmt(Math.min(Math.round(result.dividend * 0.085), 80000))}
                </div>
              </label>
              <label className={`p-3 rounded cursor-pointer border ${filing.dividendChoice === "separate" ? "border-2" : ""}`}
                style={{ borderColor: filing.dividendChoice === "separate" ? "var(--accent)" : "var(--line)", background: filing.dividendChoice === "separate" ? "#fafaf6" : "white" }}>
                <input type="radio" name="divChoice" value="separate"

                <span className="text-sm font-medium">分開計稅 28%</span>
                <div className="text-xs mt-1 ml-5" style={{ color: "var(--ink-mute)" }}>
                  股利單獨用 28% 課稅 (適用高所得者,稅率 30%+ 時)
                </div>
                <div className="text-xs ml-5 mt-1 num" style={{ color: "var(--ink-mute)" }}>
                  分離稅額: {fmt(Math.round(result.dividend * 0.28))}
                </div>
              </label>
            </div>

              <input type="number" className="input-text w-full text-right"
                value={filing.taxCredits?.prepaidTax || ""}
                onChange={e => onChange({ ...filing, taxCredits: { ...filing.taxCredits, prepaidTax: Number(e.target.value) || 0 } })} />
              <div className="text-xs mt-1" style={{ color: "var(--ink-mute)" }}>
                薪資/利息/租賃等扣繳憑單上的「扣繳稅額」合計
              </div>
            </div>
            <div>
              <label className="block text-xs mb-1" style={{ color: "var(--ink-soft)" }}>重購自用住宅退稅</label>
              <input type="number" className="input-text w-full text-right"
                value={filing.taxCredits?.repurchaseCredit || ""}
                onChange={e => onChange({ ...filing, taxCredits: { ...filing.taxCredits, repurchaseCredit: Number(e.target.value) || 0 } })} />
              <div className="text-xs mt-1" style={{ color: "var(--ink-mute)" }}>
                2 年內重購自宅可申請的退稅
              </div>
            </div>
            <div>
              <label className="block text-xs mb-1" style={{ color: "var(--ink-soft)" }}>其他扣抵</label>
              <input type="number" className="input-text w-full text-right"
                value={filing.taxCredits?.otherCredit || ""}
                onChange={e => onChange({ ...filing, taxCredits: { ...filing.taxCredits, otherCredit: Number(e.target.value) || 0 } })} />

                投資抵減、大陸地區已納稅額等
              </div>
            </div>
          </div>
        </div>

      {/* ④ 5 種計稅方式比較 (只在夫妻合併申報時顯示) */}
      {result.hasSpouse && result.taxMethods && result.taxMethods.length > 1 && (
        <TaxMethodsPanel result={result} filing={filing} onChange={onChange} />
      )}

      {/* 試算結果 */}
      <ResultPanel result={result} year={year} members={members} />

      {/* 本戶租賃 — 合約自動攤分,每物件可展開查看與手動覆寫 */}
      {householdProperties.length > 0 && (
        <div className="card">
          <div className="px-5 py-3 flex items-center justify-between" style={{ borderBottom: "1px solid var(--line)" }}>
            <div className="ornament">⑥ RENTAL RECORDS · 本戶 {year} 年度租賃紀錄</div>
            <div className="text-xs" style={{ color: "var(--ink-mute)" }}>
              依合約自動攤分,可勾選計入 / 手動覆寫金額
            </div>
          </div>
          <div className="p-3 space-y-2">
            {(() => {
              // 過濾出當年度有合約的物件
              const propsWithContracts = householdProperties.filter(p => {
                const agg = aggregateContractsForYear(contracts, p.id, year, filing.manualRentOverrides);
                return agg.anyContractInYear;
              });

              if (propsWithContracts.length === 0) {
                return (
                  <div className="text-center py-8 text-xs" style={{ color: "var(--ink-mute)" }}>
                    本戶在 {year} 年度沒有任何有效合約的物件
                  </div>
                );
              }

              return propsWithContracts.map(p => {
              const owner = members.find(m => m.id === p.ownerId);
              const agg = aggregateContractsForYear(contracts, p.id, year, filing.manualRentOverrides);
              const computables = getComputablesForProperty(p, year, contracts, rentalRecords, filing.manualRentOverrides);
              const taxableTotal = computeRentalIncome(computables, params).taxable;
              const overrideKey = `${p.id}_${year}`;
              const override = (filing.manualRentOverrides || {})[overrideKey];
              const isIncluded = override ? override.includeInFiling !== false : true;
              const hasContracts = agg.anyContractInYear;

              // 算去年同物件的應稅租金 (作參考) — 直接用合約自動算,不參考去年的手動覆寫
              const lastYear = year - 1;
              const lastYearComputables = getComputablesForProperty(p, lastYear, contracts, rentalRecords, {});
              const lastYearTaxable = computeRentalIncome(lastYearComputables, params).taxable;
              const lastYearAgg = aggregateContractsForYear(contracts, p.id, lastYear, {});

              return (
                <details key={p.id} className="rounded" open={hasContracts} style={{ background: isIncluded ? "white" : "#fafaf6", border: "1px solid var(--line)" }}>
                  <summary className="px-3 py-2 flex items-center gap-3 cursor-pointer">
                    <span className="chevron text-xs" style={{ color: "var(--ink-mute)" }}>▸</span>
                    {hasContracts ? (
                      <input type="checkbox" checked={isIncluded}
                        onChange={e => {
                          e.stopPropagation();
                          updateRentOverride(p.id, { includeInFiling: e.target.checked });
                        }}
                        onClick={e => e.stopPropagation()} />
                    ) : null}
                    <div className="flex-1">
                      <div className="text-sm font-medium">{p.name}</div>
                      <div className="text-xs" style={{ color: "var(--ink-mute)" }}>
                        {owner?.name} · {p.address}
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      {agg.hasMixedType && <span className="chip chip-amber text-[10px]">公益+一般</span>}
                      {override && <span className="chip chip-accent text-[10px]">手動覆寫</span>}
                    </div>
                    {/* 去年同物件參考 */}
                    {lastYearAgg.anyContractInYear && (
                      <div className="text-right pr-3" style={{ borderRight: "1px solid var(--line-soft)" }}>
                        <div className="text-[10px]" style={{ color: "var(--ink-mute)" }}>{lastYear} 年應稅</div>
                        <div className="font-serif num text-sm" style={{ color: "var(--ink-soft)" }}>
                          {fmt(lastYearTaxable)}
                        </div>
                      </div>
                    )}
                    <div className="text-right">
                      <div className="text-xs" style={{ color: "var(--ink-mute)" }}>{year} 年應稅</div>
                      <div className="font-serif num text-base">
                        {isIncluded ? fmt(taxableTotal) : <span style={{ color: "var(--ink-mute)" }}>不計入</span>}
                      </div>
                      {lastYearAgg.anyContractInYear && isIncluded && (
                        <div className="text-[10px]" style={{
                          color: taxableTotal > lastYearTaxable ? "var(--accent-deep)" :
                                 taxableTotal < lastYearTaxable ? "var(--green)" : "var(--ink-mute)"
                        }}>
                          {taxableTotal === lastYearTaxable ? "持平" :
                           taxableTotal > lastYearTaxable ? `↑ +${fmt(taxableTotal - lastYearTaxable)}` :
                           `↓ -${fmt(lastYearTaxable - taxableTotal)}`}
                        </div>
                      )}
                    </div>
                  </summary>

                  <div className="px-3 pb-3 pt-2" style={{ borderTop: "1px solid var(--line-soft)" }}>
                    {!hasContracts ? (
                      <div className="text-xs p-3 text-center" style={{ color: "var(--ink-mute)" }}>
                        此物件在 {year} 年度沒有合約紀錄。
                        <button className="btn-secondary text-xs ml-2" onClick={() => setPage && setPage("contracts")}>
                          → 去合約管理新增
                        </button>
                      </div>
                    ) : (
                      <>
                        {/* 合約攤分明細 */}
                        <div className="text-xs font-medium mb-2" style={{ color: "var(--ink-soft)" }}>合約攤分明細 ({agg.contracts.length} 份)</div>
                        <table className="w-full text-xs">
                          <thead>
                            <tr style={{ background: "#fafaf6", borderBottom: "1px solid var(--line)" }}>
                              <th className="text-left px-2 py-1 font-medium">租客</th>
                              <th className="text-left px-2 py-1 font-medium">租期</th>
                              <th className="text-center px-2 py-1 font-medium">月數</th>
                              <th className="text-right px-2 py-1 font-medium">月租</th>
                              <th className="text-right px-2 py-1 font-medium">當年度租金</th>
                              <th className="text-center px-2 py-1 font-medium">類型</th>
                            </tr>
                          </thead>
                          <tbody>
                            {agg.contracts.map(c => (
                              <tr key={c.contractId} style={{
                                borderBottom: "1px solid var(--line-soft)",
                                opacity: c.overriddenByPublic ? 0.5 : 1
                              }}>
                                <td className="px-2 py-1">
                                  {c.tenantName}
                                  {c.overriddenByPublic && <span className="ml-1 text-[9px]" style={{ color: "var(--ink-mute)" }}>(被公益覆蓋)</span>}
                                  {c.hasOverlapWithPublic && <span className="ml-1 text-[9px]" style={{ color: "var(--gold)" }}>(部分扣除)</span>}
                                </td>
                                <td className="px-2 py-1 num text-[10px]">{c.period}</td>
                                <td className="px-2 py-1 text-center num">{
                                  Number.isInteger(c.months) ? c.months : c.months.toFixed(2)
                                }</td>
                                <td className="px-2 py-1 text-right num">{fmt(c.monthly)}</td>
                                <td className="px-2 py-1 text-right num font-medium">{fmt(c.rent)}</td>
                                <td className="px-2 py-1 text-center">
                                  {c.isPublic ? <span className="chip chip-green text-[10px]">公益</span> : <span className="chip chip-amber text-[10px]">一般</span>}
                                </td>
                              </tr>
                            ))}
                            <tr style={{ background: "#fafaf6" }}>
                              <td colSpan={4} className="px-2 py-1 text-right font-medium">自動計算合計</td>
                              <td className="px-2 py-1 text-right num font-medium">{fmt(agg.computedAnnualRent)}</td>
                              <td className="px-2 py-1 text-center text-[10px]" style={{ color: "var(--ink-mute)" }}>
                                {agg.publicRent > 0 && agg.generalRent > 0
                                  ? `公益 ${fmt(agg.publicRent)} + 一般 ${fmt(agg.generalRent)}`
                                  : ""}
                              </td>
                            </tr>
                          </tbody>
                        </table>

                        {/* 手動覆寫區 */}
                        {/* 單欄手動覆寫: 輸入全年總租金,系統自動扣公益 */}
                        <div className="mt-3 p-3 rounded text-xs" style={{ background: "#fafaf6", border: "1px solid var(--line)" }}>
                          <label className="flex items-center gap-2 cursor-pointer mb-2">
                            <input type="checkbox" checked={override?.totalAnnualRent !== undefined}
                              onChange={e => {
                                if (e.target.checked) {
                                  // 預填: 自動算出的總額
                                  updateRentOverride(p.id, { totalAnnualRent: agg.computedAnnualRent });
                                } else {
                                  // 還原: 清掉 totalAnnualRent (與舊版相容欄位)
                                  updateRentOverride(p.id, {
                                    totalAnnualRent: undefined,
                                    annualRent: undefined,
                                    generalAnnualRent: undefined,
                                    publicAnnualRent: undefined
                                  });
                                }
                              }} />
                            <span className="font-medium">手動覆寫年度總租金</span>
                            <span className="text-[10px]" style={{ color: "var(--ink-mute)" }}>(系統會自動扣公益部分)</span>
                          </label>

                          {override?.totalAnnualRent !== undefined && (
                            <div className="ml-5 space-y-2">
                              <div className="flex items-center gap-2">
                                <span style={{ minWidth: "100px" }}>全年總租金:</span>
                                <input type="number" className="input-text w-40 text-right"
                                  value={override.totalAnnualRent || ""}
                                  placeholder="0"
                                  onChange={e => updateRentOverride(p.id, { totalAnnualRent: Number(e.target.value) || 0 })} />
                                <span style={{ color: "var(--ink-mute)" }}>(含公益)</span>
                                <button className="btn-secondary text-[10px] ml-auto" onClick={() => clearRentOverride(p.id)}>↻ 還原為合約自動</button>
                              </div>

                              {/* 拆解明細 */}
                              <div className="p-2 rounded" style={{ background: "white", border: "1px solid var(--line-soft)" }}>
                                <div className="flex justify-between py-0.5">
                                  <span>全年總租金 (你輸入)</span>
                                  <span className="num">{fmt(agg.manualTotal)}</span>
                                </div>
                                <div className="flex justify-between py-0.5" style={{ color: "var(--green)" }}>
                                  <span>− 公益部分 (依公益合約自動)</span>
                                  <span className="num">{fmt(agg.appliedPublicRent)}</span>
                                </div>
                                <div className="flex justify-between py-0.5 pt-1 mt-1 font-medium" style={{ borderTop: "1px solid var(--line)", color: "var(--accent-deep)" }}>
                                  <span>= 一般部分 (43% 費用率)</span>
                                  <span className="num">{fmt(agg.appliedGeneralRent)}</span>
                                </div>
                                {agg.appliedGeneralRent < 0 && (
                                  <div className="text-[10px] mt-1" style={{ color: "var(--gold)" }}>
                                    ⚠ 你輸入的總租金小於公益部分,一般部分視為 0
                                  </div>
                                )}
                              </div>

                              <div className="text-[10px]" style={{ color: "var(--ink-mute)" }}>
                                ⓘ 公益部分依「公益出租合約」自動計算 (每月免稅 15,000 + 60% 費用率),不可手動更動。
                                你輸入的金額減掉公益後,剩餘視為一般出租 (43% 費用率)。
                              </div>
                            </div>
                          )}

                          {override?.totalAnnualRent === undefined && (
                            <div className="ml-5 text-[10px]" style={{ color: "var(--ink-mute)" }}>
                              自動算出的總額: <span className="num">{fmt(agg.computedAnnualRent)}</span>
                              (公益 {fmt(agg.publicRent)} + 一般 {fmt(agg.generalRent)})
                            </div>
                          )}
                        </div>

                        {/* 應稅計算結果 */}
                        <div className="mt-2 p-2 rounded text-xs" style={{ background: agg.hasMixedType ? "#fef9ec" : "#f5fbef", border: `1px solid ${agg.hasMixedType ? "var(--gold)" : "var(--green)"}` }}>
                          <div className="font-medium mb-1">應稅租金所得計算</div>
                          {computables.map((c, i) => {
                            const ci = computeRentalIncome([c], params).breakdown[0];
                            return (
                              <div key={i} className="flex justify-between py-0.5">
                                <span>· {c.name} <span style={{ color: "var(--ink-mute)" }}>({ci.note})</span></span>
                                <span className="num font-medium">{fmt(ci.taxableIncome)}</span>
                              </div>
                            );
                          })}
                          <div className="flex justify-between pt-1 mt-1 font-medium" style={{ borderTop: "1px solid var(--line)" }}>
                            <span>合計應稅</span>
                            <span className="num">{fmt(taxableTotal)}</span>
                          </div>
                        </div>
                      </>
                    )}
                  </div>
                </details>
              );
            });
            })()}
          </div>

          <div className="px-5 py-3 text-xs" style={{ color: "var(--ink-mute)", borderTop: "1px solid var(--line-soft)" }}>
            ⓘ 系統優先用「合約管理」頁的合約資料,依日期自動攤分到該年度。

          </div>
        </div>
      )}
    </div>
  );
}

function FCell({ label, value, bold }) {

  return (
    <div className="text-center px-2" style={{ minWidth: "85px" }}>

      <div className={`num mt-1 ${bold ? "font-semibold" : ""}`} style={{ fontSize: "13px" }}>{display}</div>

function FOp({ op }) {

function FormulaRow({ children, className = "" }) {

function HistoryPage({ data }) {
  // 以成員為主軸,看每個人歷年參與的申報戶與稅額分攤
  const memberHistory = data.members.map(m => {
    const records = [];
    AVAILABLE_YEARS.forEach(y => {
      const filings = data.filings.filter(f =>
        f.year === y &&
        (f.taxpayerId === m.id || f.spouseId === m.id || (f.dependentIds || []).includes(m.id))
      );
      filings.forEach(f => {
        const filerIds = [f.taxpayerId, f.spouseId, ...(f.dependentIds || [])].filter(Boolean);
        const householdProps = data.properties.filter(p => filerIds.includes(p.ownerId));
        const result = computeTaxForFiling({ ...f, properties: householdProps, rentalRecords: data.rentalRecords || [], contracts: data.contracts || [], manualRentOverrides: f.manualRentOverrides || {} }, data.members, y);
        if (!result) return;
        const income = f.memberIncome?.[m.id] || {};
        const role = f.taxpayerId === m.id ? "本人" : (f.spouseId === m.id ? "配偶" : "扶養");
        records.push({
          year: y, role, filingName: f.name,
          salary: toNum(income.salary), interest: toNum(income.interest),
          dividend: toNum(income.dividend), other: toNum(income.other),
          householdTax: result.tax,
        });
      });
    });
    return { member: m, records };
  });

  return (
    <div className="fade-in">
      <PageHeader
        ornament="§ HISTORICAL RECORDS · 歷年紀錄"
        title="每位成員的歷史申報"
        subtitle="按成員整理,可看出個人歷年所得變化與所屬申報戶稅額"
      />

      {memberHistory.filter(h => h.records.length > 0).length === 0 && (
        <div className="card p-12 text-center" style={{ color: "var(--ink-mute)" }}>尚無歷史紀錄</div>
      )}

      {memberHistory.map(({ member, records }) => {
        if (records.length === 0) return null;
        return (
          <div key={member.id} className="card mb-5">
            <div className="px-5 py-3 flex items-center justify-between" style={{ borderBottom: "1px solid var(--line)" }}>
              <div>
                <div className="font-serif text-lg">{member.name}</div>
                <div className="text-xs" style={{ color: "var(--ink-mute)" }}>共 {records.length} 筆紀錄</div>
              </div>
              <div className="text-right text-xs" style={{ color: "var(--ink-mute)" }}>
                <div>累計薪資</div>
                <div className="num font-serif text-base" style={{ color: "var(--ink)" }}>
                  {fmt(records.reduce((s, r) => s + r.salary, 0))}
                </div>
              </div>
            </div>
            <table className="w-full text-sm">
              <thead>
                <tr style={{ background: "#fafaf6", borderBottom: "1px solid var(--line)" }}>
                  <th className="text-left px-5 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>年度</th>
                  <th className="text-left px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>申報戶</th>
                  <th className="text-left px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>身分</th>
                  <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>薪資</th>
                  <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>利息</th>
                  <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>股利</th>
                  <th className="text-right px-3 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>其他</th>
                  <th className="text-right px-5 py-2 text-xs font-medium" style={{ color: "var(--ink-mute)" }}>戶總稅額</th>
                </tr>
              </thead>
              <tbody>
                {records.map((r, i) => (
                  <tr key={i} className="table-row">
                    <td className="px-5 py-2 font-serif">{r.year}</td>
                    <td className="px-3 py-2">{r.filingName}</td>
                    <td className="px-3 py-2"><span className="chip">{r.role}</span></td>
                    <td className="px-3 py-2 text-right num">{fmt(r.salary)}</td>
                    <td className="px-3 py-2 text-right num">{fmt(r.interest)}</td>
                    <td className="px-3 py-2 text-right num">{fmt(r.dividend)}</td>
                    <td className="px-3 py-2 text-right num">{fmt(r.other)}</td>
                    <td className="px-5 py-2 text-right num font-medium">{fmt(r.householdTax)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      })}
    </div>
  );
}
