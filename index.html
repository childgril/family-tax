// ============================================================
// 親屬關係分類 (依所得稅法第 17 條)
// ============================================================
// isLinealAscendant: 直系尊親屬 (享有 70 歲免稅額優惠 145,500)
// isChild: 子女 (享教育學費扣除 / 幼兒學前扣除)
// isCollateral: 旁系 (兄弟姊妹等,扶養條件較嚴)
// ============================================================
const RELATIONS = {
  self:        { label: "本人",       isLinealAscendant: false, isChild: false, isCollateral: false, canBeDependent: false, canBeSpouse: false },
  spouse:      { label: "配偶",       isLinealAscendant: false, isChild: false, isCollateral: false, canBeDependent: false, canBeSpouse: true  },
  child:       { label: "子女",       isLinealAscendant: false, isChild: true,  isCollateral: false, canBeDependent: true,  canBeSpouse: false },
  grandchild:  { label: "孫子女",     isLinealAscendant: false, isChild: true,  isCollateral: false, canBeDependent: true,  canBeSpouse: false },
  parent:      { label: "父母",       isLinealAscendant: true,  isChild: false, isCollateral: false, canBeDependent: true,  canBeSpouse: false },
  grandparent: { label: "祖父母",     isLinealAscendant: true,  isChild: false, isCollateral: false, canBeDependent: true,  canBeSpouse: false },
  parentInLaw: { label: "配偶父母",   isLinealAscendant: true,  isChild: false, isCollateral: false, canBeDependent: true,  canBeSpouse: false },
  sibling:     { label: "兄弟姊妹",   isLinealAscendant: false, isChild: false, isCollateral: true,  canBeDependent: true,  canBeSpouse: false },
  other:       { label: "其他親屬",   isLinealAscendant: false, isChild: false, isCollateral: true,  canBeDependent: true,  canBeSpouse: false },
};

// 判斷某成員是否能享 70 歲提高免稅額
// 規定: 本人、配偶、直系尊親屬 (parent/grandparent/parentInLaw) 滿 70 歲適用
// year 為申報年度,用於以該年 12/31 計算歲數
function canUseElderExemption(member, role, year) {
  if (!member) return false;
  const age = year ? getMemberAge(member, year) : toNum(member.age);
  if (age < 70) return false;
  if (role === "taxpayer" || role === "spouse") return true;
  const r = RELATIONS[member.relation];
  return r && r.isLinealAscendant;
}

// 檢查申報戶合法性 (回傳警告訊息陣列)
function validateFiling(filing, members) {
  const warnings = [];
  const taxpayer = members.find(m => m.id === filing.taxpayerId);
  const spouse = filing.spouseId ? members.find(m => m.id === filing.spouseId) : null;
  const dependents = (filing.dependentIds || []).map(id => members.find(m => m.id === id)).filter(Boolean);

  if (!taxpayer) {
    warnings.push({ level: "error", msg: "尚未指定主納稅義務人" });
    return warnings;
  }

  // 配偶關係檢查
  if (spouse) {
    if (spouse.id === taxpayer.id) {
      warnings.push({ level: "error", msg: "配偶不能與主納稅人是同一人" });
    }
    const sr = RELATIONS[spouse.relation];
    if (sr && !sr.canBeSpouse && spouse.relation !== "self") {
      warnings.push({ level: "warn", msg: `「${spouse.name}」關係標記為「${sr.label}」,不符合配偶身分,建議改成「配偶」` });
    }
  }

  // 扶養親屬條件檢查
  dependents.forEach(d => {
    const r = RELATIONS[d.relation];
    if (!r) return;
    if (!r.canBeDependent) {
      warnings.push({ level: "error", msg: `「${d.name}」(${r.label}) 不能列為扶養親屬` });
      return;
    }
    if (d.id === taxpayer.id || d.id === filing.spouseId) {
      warnings.push({ level: "error", msg: `「${d.name}」已是本人或配偶,不可重複列為扶養` });
      return;
    }
    const age = Number(d.age);

    // 子女、孫子女、兄弟姊妹: 未成年 OR 成年但在學/身障/無謀生能力
    if (r.isChild || d.relation === "sibling") {
      if (age >= 20 && !d.isStudent && !d.isDisabled && !d.cannotSupportSelf) {
        warnings.push({ level: "warn", msg: `「${d.name}」(${r.label}) 已成年,需「在學」、「身心障礙」或「無謀生能力」才可列為扶養` });
      }
    }

    // 直系尊親屬: 60 歲以上 OR 無謀生能力
    if (r.isLinealAscendant) {
      if (age < 60 && !d.cannotSupportSelf && !d.isDisabled) {
        warnings.push({ level: "warn", msg: `「${d.name}」(${r.label}) 未滿 60 歲,需「無謀生能力」或「身心障礙」才可列為扶養` });
      }
    }

    // 其他親屬: 必須勾選共同居住
    if (d.relation === "other" && !d.coResident) {
      warnings.push({ level: "info", msg: `「${d.name}」(其他親屬) 須與納稅人共同居住且確受扶養,請確認並在成員資料勾選「共同居住」` });
    }
  });

  return warnings;
}

const fmt = (n) => {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return Math.round(Number(n)).toLocaleString("zh-TW");
};
const fmtSign = (n) => {
  if (n === null || n === undefined || isNaN(n)) return "—";
  const v = Math.round(Number(n));
  if (v > 0) return "+" + v.toLocaleString("zh-TW");
  return v.toLocaleString("zh-TW");
};
const toNum = (v) => {
  if (v === "" || v === null || v === undefined) return 0;
  const n = Number(String(v).replace(/,/g, ""));
  return isNaN(n) ? 0 : n;
};

  "9B":     { name: "稿費/演講費/版稅 (定額免稅 18 萬)" },

  // 其他類
  "76":     { name: "財產交易所得 (含拍賣、未上市股票)" },
  "76W":    { name: "境外財產交易所得 (海外)" },
  "87":     { name: "自力耕作、漁、牧、林、礦所得" },
  "90":     { name: "告發/檢舉獎金 (分離課稅)" },
  "91":     { name: "競技、競賽、機會中獎獎金" },
  "92":     { name: "其他所得 (需註明給付項目)" },
  "93":     { name: "退職所得 (定額免稅)" },
  "94":     { name: "員工認股權所得" },
  "95":     { name: "政府補助款" },
  "96":     { name: "結構型商品交易所得 (分離課稅)" },
  "97":     { name: "受贈所得" },

  // 海外/大陸地區 (基本稅額制計算)
  "71":     { name: "海外/大陸地區營利所得" },
  "73":     { name: "海外/大陸地區利息所得" },
};

// 算單一筆所得的「所得總額」(收入 − 必要費用)
function computeEntryNet(entry) {
  const gross = toNum(entry.gross);
  // 租賃所得算法依代號:
  //   51   房屋租賃: 收入 × (1 − 43%) 或自填費用 (預設 43% 費用率)
  //   51L  土地租賃: 收入 − 地價稅 (使用者填在 expense)
  //   51J  其他固定資產 (機具設備等): 收入 − 自填費用,預設無費用
  //   51I  非固定資產-其他 (借券): 收入 − 自填手續費,預設無費用
  //   51K  非固定資產-債券租借: 收入 − 自填手續費,預設無費用
  // 50 薪資: 整年薪資作為「所得」(扣除額在另一處算)
  // 54C 股利: 不扣費用,直接 = 收入
  // 5A/5B 利息: 不扣費用
  if (entry.category === "rental") {
    if (entry.code === "51L") {
      return Math.max(0, gross - toNum(entry.expense));
    }
    if (entry.code === "51I" || entry.code === "51J" || entry.code === "51K") {
      // 借券/其他非固定資產: 不適用 43% 費用率, 預設無費用
      const userExpense = toNum(entry.expense);
      return Math.max(0, gross - userExpense);
    }
    // 51 房屋: 自動 43%,使用者也可手填覆寫
    const userExpense = toNum(entry.expense);
    if (userExpense > 0) return Math.max(0, gross - userExpense);
    return Math.round(gross * 0.57);
  }
  if (entry.category === "executive") {
    // 執行業務: 9A 一般經紀人 20% 費用、9B 稿費上限 18 萬免稅
    if (entry.code === "9B") {
      return Math.max(0, gross - Math.min(gross, 180000));
    }
    const userExpense = toNum(entry.expense);
    if (userExpense > 0) return Math.max(0, gross - userExpense);
    return Math.round(gross * 0.80); // 20% 費用率
  }
  // 薪資、利息、股利、其他: 直接收入 = 所得 (不扣費用)
  return gross;
}

// 算式求值: 支援 + - * / 與括號,空白與千分位逗號被忽略
// 例: "114360+171540" → 285900, "(1+2)*3" → 9
function evalExpr(expr) {
  if (expr == null || expr === "") return 0;
  const raw = String(expr).replace(/[,\s]/g, "").trim();
  if (!raw) return 0;
  // 純數字 (含負號) 直接回傳
  if (/^-?\d+(\.\d+)?$/.test(raw)) return Number(raw);
  // 只允許數字、+ - * / . ( )
  if (!/^[0-9+\-*/.()]+$/.test(raw)) return NaN;
  try {
    // eslint-disable-next-line no-new-func
    const r = Function(`"use strict"; return (${raw});`)();
    if (typeof r === "number" && Number.isFinite(r)) return r;
    return NaN;
  } catch {
    return NaN;
  }
}

// ============================================================
// ROC 民國日期工具
// ============================================================
// 民國日期可能形式: "1140810" (7碼) / "114/08/10" / "114-8-10" / "1140810"
// 內部統一用 { y: ROC年, m: 1-12, d: 1-31 } 物件
function parseRocDate(str) {
  if (!str) return null;
  const s = String(str).trim();
  // 純數字 7 碼: 1140810 → 114/08/10
  if (/^\d{7}$/.test(s)) {
    return { y: Number(s.slice(0, 3)), m: Number(s.slice(3, 5)), d: Number(s.slice(5, 7)) };
  }
  // 帶分隔符
  const m = s.match(/^(\d{2,3})[\/\.\-年](\d{1,2})[\/\.\-月](\d{1,2})/);
  if (m) {
    return { y: Number(m[1]), m: Number(m[2]), d: Number(m[3]) };
  }
  return null;
}
function formatRocDate(d) {
  if (!d) return "";
  return `${d.y}/${String(d.m).padStart(2,"0")}/${String(d.d).padStart(2,"0")}`;
}

// 算成員在「申報年度」12/31 時的歲數
// 規則(財政部):家戶成員年齡以「所得所屬年度終了 12/31」為準
// 優先用 member.birthDate (民國年/月/日);若無則退回 member.age (使用者手填)
function getMemberAge(member, taxYear) {
  if (!member) return 0;
  const bd = parseRocDate(member.birthDate);
  if (bd && taxYear) {
    // 在該年度 12/31 時的歲數
    // 例:bd = 50/3/15 (民國 50 年 3 月),申報 114 年 → 該年 12/31 時 114-50 = 64 歲
    // 因為 12/31 一定在 3/15 之後,所以不用扣 1
    return taxYear - bd.y;
  }
  // 沒填出生日 → 退回手填年齡
  return toNum(member.age);
}
// ROC -> JS Date
function rocToDate(d) {
  if (!d) return null;
  return new Date(d.y + 1911, d.m - 1, d.d);
}
// 算兩個日期跨越某年的「月數」(粗略整月算法 — 用於 UI 顯示參考)
function monthsInYear(startROC, endROC, year) {
  if (!startROC || !endROC) return 0;
  const yearStart = { y: year, m: 1, d: 1 };
  const yearEnd = { y: year, m: 12, d: 31 };
  const sJs = rocToDate(startROC), eJs = rocToDate(endROC);
  const ysJs = rocToDate(yearStart), yeJs = rocToDate(yearEnd);
  const ovStart = sJs > ysJs ? sJs : ysJs;
  const ovEnd = eJs < yeJs ? eJs : yeJs;
  if (ovStart > ovEnd) return 0;
  return (ovEnd.getFullYear() - ovStart.getFullYear()) * 12 + (ovEnd.getMonth() - ovStart.getMonth()) + 1;
}

// 算合約在某年度內,每個月的「有效天數」陣列 (長度 12,每元素 0~31)
// 規則: 起始日 ≤ 該天 ≤ 結束日 = 有效;起始日含、結束日含
// 重疊月份的合約交接,呼叫端會以「公益優先」或「先到先服務」處理
function monthDaysInYear(startROC, endROC, year) {
  const result = new Array(12).fill(0);
  if (!startROC || !endROC) return result;
  const sJs = rocToDate(startROC), eJs = rocToDate(endROC);
  for (let m = 1; m <= 12; m++) {
    const monthStart = new Date(year + 1911, m - 1, 1);
    const monthEnd = new Date(year + 1911, m, 0); // 該月最後一天
    const daysInMonth = monthEnd.getDate();
    const ovStart = sJs > monthStart ? sJs : monthStart;
    const ovEnd = eJs < monthEnd ? eJs : monthEnd;
    if (ovStart > ovEnd) continue;
    // 重疊天數 (含頭含尾)
    const days = Math.round((ovEnd - ovStart) / 86400000) + 1;
    result[m - 1] = days;
  }
  return result;
}

// 一個月的總天數
function daysInMonth(year, monthIndex) {
  // monthIndex: 1-12, year: ROC
  return new Date(year + 1911, monthIndex, 0).getDate();
}

// ============================================================
// 核心稅務計算
// ============================================================
function computeRentalIncome(properties, params) {
  // 回傳: { taxable: 應稅租金所得, exempted: 免稅金額, breakdown: [...] }
  let taxable = 0, exempted = 0;
  const breakdown = [];
  properties.forEach(p => {
    const monthly = toNum(p.monthlyRent);
    const months = toNum(p.months || 12);
    // 若有 annualRentDirect (從合約推算),優先使用它作為 gross
    const gross = p.annualRentDirect !== undefined ? toNum(p.annualRentDirect) : monthly * months;
    let income = 0, exempt = 0;
    let note = "";
    if (p.type === "general") {
      // 一般出租: 43%必要費用
      const expenseRatio = p.expenseRatio !== undefined && p.expenseRatio !== "" ? Number(p.expenseRatio) : params.rentExpenseRatio;
      income = gross * (1 - expenseRatio);
      note = `必要費用 ${(expenseRatio * 100).toFixed(0)}%`;
    } else if (p.type === "land") {
      // 土地出租: 不能用 43% 費用率,只能扣地價稅
      const landTax = toNum(p.landTax || 0);
      income = Math.max(0, gross - landTax);
      note = `土地租金 − 地價稅 ${fmt(landTax)}`;
    } else if (p.type === "public") {
      // 公益出租人: 每月免稅 15,000,超出部分必要費用 60%
      const exemptMonthly = Math.min(monthly, params.publicLandlordExempt);
      const overMonthly = Math.max(0, monthly - params.publicLandlordExempt);
      exempt = exemptMonthly * months;
      const overGross = overMonthly * months;
      income = overGross * (1 - params.publicLandlordExpense);
      note = `每月免稅 ${fmt(params.publicLandlordExempt)},超出部分費用率 60%`;
    } else if (p.type === "subletAgent") {
      // 包租代管: 每月免稅 15,000,超出部分必要費用 60% (與公益出租人類似的優惠)
      const exemptMonthly = Math.min(monthly, params.publicLandlordExempt);
      const overMonthly = Math.max(0, monthly - params.publicLandlordExempt);
      exempt = exemptMonthly * months;
      const overGross = overMonthly * months;
      income = overGross * (1 - params.publicLandlordExpense);
      note = `包租代管,每月免稅 ${fmt(params.publicLandlordExempt)},超出部分費用率 60%`;
    } else if (p.type === "taxFree") {
      // 免稅紀錄: 不報稅
      income = 0;
      exempt = gross;
      note = "免稅租金紀錄,不計入所得";
    } else {
      income = gross * (1 - params.rentExpenseRatio);
      note = "預設 43% 費用率";
    }
    taxable += income;
    exempted += exempt;
    breakdown.push({
      ...p,
      gross,
      taxableIncome: Math.round(income),
      exemptAmount: Math.round(exempt),
      note,
    });
  });
  return { taxable: Math.round(taxable), exempted: Math.round(exempted), breakdown };
}

function applyBrackets(netIncome, params) {
  if (netIncome <= 0) return { tax: 0, rate: 0, deduct: 0 };
  for (const b of params.brackets) {
    if (netIncome <= b.upTo) {
      return { tax: Math.max(0, Math.round(netIncome * b.rate - b.deduct)), rate: b.rate, deduct: b.deduct };
    }
  }
  const last = params.brackets[params.brackets.length - 1];
  return { tax: Math.max(0, Math.round(netIncome * last.rate - last.deduct)), rate: last.rate, deduct: last.deduct };
}

// ============================================================
// 5 種計稅方式試算 (所得稅法第15條) × 2 種股利選擇 = 10 種組合
// 法源: 財政部「綜合所得稅結算電子申報繳稅軟體會自選擇稅額最低之方式計算」
// ============================================================
function computeAllTaxMethods(ctx) {
  const { filers, taxpayerId, spouseId, memberIncome, householdProperties, rentalRecords, contracts, manualOverrides, params, year } = ctx;
  const { exemptionByMember, generalDeduction, disabilityDed, educationDed, preschoolDed, longTermCareDed, rentDeductActual, blDiff, savings } = ctx;
  const { dividend54, repurchaseCredit, otherCredit, prepaidTax } = ctx;

  // 算個人所得明細
  const incomeByMember = {};
  filers.forEach(m => {
    const inc = memberIncome[m.id] || {};
    const myProps = householdProperties.filter(p => p.ownerId === m.id);
    // 每物件可能對應多份合約 (公益+一般並存)
    const myComputable = myProps.flatMap(p =>
      getComputablesForProperty(p, year, contracts, rentalRecords, manualOverrides));
    const r = computeRentalIncome(myComputable, params);
    incomeByMember[m.id] = {
      salary: toNum(inc.salary),
      salaryDed: Math.min(toNum(inc.salary), params.salaryDeduction),
      interest: toNum(inc.interest),
      dividend: toNum(inc.dividend),
      rental: r.taxable,
      other: toNum(inc.other),
    };
  });

  const memberSpecial = (memberId) => {
    const m = filers.find(f => f.id === memberId);
    if (!m) return 0;
    let sd = 0;
    if (m.isDisabled) sd += params.disabilityDeduction;
    if (m.needsLongTermCare) sd += params.longTermCare;
    return sd;
  };
  const memberExemption = (memberId) => {
    const e = exemptionByMember.find(x => x.memberId === memberId);
    return e ? e.amount : params.exemption;
  };

  const totals = filers.reduce((t, m) => {
    const inc = incomeByMember[m.id];
    t.salary += inc.salary;
    t.salaryDed += inc.salaryDed;
    t.interest += inc.interest;
    t.dividend += inc.dividend;
    t.rental += inc.rental;
    t.other += inc.other;
    return t;
  }, { salary: 0, salaryDed: 0, interest: 0, dividend: 0, rental: 0, other: 0 });
  const grossAll = totals.salary + totals.interest + totals.dividend + totals.rental + totals.other;
  const allMemberExemption = exemptionByMember.reduce((s, e) => s + e.amount, 0);

  // === 兩個 finalize 變體: A 股利合併計稅(享 8.5% 抵減) / B 股利分開計稅(28% 分離) ===
  // 股利分開計稅 = 股利不併入綜所(本來在 grossAll、netIncome 內 → 要扣回),用 28% 單獨課稅
  // 但本系統的 net 算法傳入是「已含股利」,所以變體 B 要從 net 內扣股利再算稅,加上 28% 分離稅
  const dividend54Total = toNum(dividend54);

  // finalize: 給定「合併版稅 + 用於分開計稅的 netForB」算出 A/B 兩變體
  const finalizeAB = (combinedTax, netForBExtractDiv) => {
    // === 變體 A: 股利合併計稅 (享 8.5% 抵減,上限 8 萬) ===
    const dividendCreditA = Math.min(Math.round(dividend54Total * 0.085), 80000);
    const totalCreditsA = dividendCreditA + repurchaseCredit + otherCredit;
    const taxRawA = combinedTax;
    const taxAfterCreditsA = taxRawA - totalCreditsA;
    const finalDueA = taxAfterCreditsA - prepaidTax;

    // === 變體 B: 股利分開計稅 28% (股利從綜所拿掉) ===
    // 重算 net (扣回股利):netForBExtractDiv 已經是扣完股利的 net
    const netForB = Math.max(0, netForBExtractDiv);
    const taxFromCombinedB = applyBrackets(netForB, params).tax;
    const taxFromSeparateB = Math.round(dividend54Total * 0.28);
    const taxRawB = taxFromCombinedB + taxFromSeparateB;
    // 分開計稅: 不可享 8.5% 抵減,但 repurchase / otherCredit 仍可
    const totalCreditsB = repurchaseCredit + otherCredit;
    const taxAfterCreditsB = taxRawB - totalCreditsB;
    const finalDueB = taxAfterCreditsB - prepaidTax;

    return {
      A: { dividendChoice: "combine", taxRaw: taxRawA, taxAfterCredits: taxAfterCreditsA, finalDue: finalDueA, dividendCredit: dividendCreditA, dividendSeparateTax: 0 },
      B: { dividendChoice: "separate", taxRaw: taxRawB, taxAfterCredits: taxAfterCreditsB, finalDue: finalDueB, dividendCredit: 0, dividendSeparateTax: taxFromSeparateB, netForB, taxFromCombinedB },
    };
  };

  const methods = [];

  // helper: 把方法的「合併計稅 net + B 變體用的扣股利 net」 → 2 個 push 進 methods
  const pushMethodAB = (baseKey, baseLabel, net, subLabel) => {
    const r = applyBrackets(net, params);
    // B 變體:股利不併入綜所 → net 要扣回股利;再加 28% 分離
    const netB = Math.max(0, net - dividend54Total);
    const { A, B } = finalizeAB(r.tax, netB);
    methods.push({
      key: baseKey + "_A",
      label: baseLabel,
      labelFull: baseLabel + " · 股利合併(8.5%抵減)",
      dividendChoice: "combine",
      baseKey,
      desc: "股利合併 8.5% 抵減",
      sub: [{ label: subLabel, net, taxRate: r.rate, deductValue: r.deduct, tax: r.tax }],
      ...A,
    });
    // 只在「有 54/54C 股利」時才產 B 變體 (沒股利的話 A=B,免重複)
    if (dividend54Total > 0) {
      const rB = applyBrackets(netB, params);
      methods.push({
        key: baseKey + "_B",
        label: baseLabel,
        labelFull: baseLabel + " · 股利分開(28%)",
        dividendChoice: "separate",
        baseKey,
        desc: "股利分開計稅 28%",
        sub: [{ label: subLabel + "(扣回股利後)", net: netB, taxRate: rB.rate, deductValue: rB.deduct, tax: rB.tax }],
        ...B,
      });
    }
  };

  // === 方法 1: 全部所得合併計稅 ===
  {
    const net = Math.max(0, grossAll - allMemberExemption - generalDeduction
      - totals.salaryDed - savings - disabilityDed - educationDed - preschoolDed - longTermCareDed - rentDeductActual - blDiff);
    pushMethodAB("combined", "全部所得合併計稅", net, "全戶淨額");
  }

  // === 方法 2 & 3: 薪資分開計稅 ===
  const hasSpouseWithSalary = spouseId && incomeByMember[spouseId] && incomeByMember[spouseId].salary > 0;
  const hasTaxpayerWithSalary = incomeByMember[taxpayerId] && incomeByMember[taxpayerId].salary > 0;

  const computeSalarySep = (mainId, label) => {
    const main = incomeByMember[mainId];
    const mainExemption = memberExemption(mainId);
    const mainSpecial = memberSpecial(mainId);
    // 主之薪資淨額 = 薪資 - 免稅 - 薪資扣除 - 身障/長照
    const mainNet = Math.max(0, main.salary - mainExemption - main.salaryDed - mainSpecial);
    const r1 = applyBrackets(mainNet, params);

    // 不含本人塊: 全戶 - 本人薪資 (注意: 本人非薪資所得仍在不含本人塊裡)
    const remainGross = grossAll - main.salary;
    const remainExemption = allMemberExemption - mainExemption;
    const remainSalaryDed = totals.salaryDed - main.salaryDed;
    const remainSpecial = (disabilityDed + longTermCareDed) - mainSpecial;
    const remainDeductSum = generalDeduction + remainSalaryDed + savings + remainSpecial + educationDed + preschoolDed + rentDeductActual;
    const remainNet = Math.max(0, remainGross - remainExemption - remainDeductSum - blDiff);
    const r2 = applyBrackets(remainNet, params);
    const taxRawCombined = r1.tax + r2.tax;

    // B 變體: 股利分開計稅 → 股利從「不含本人塊」拿掉
    const remainNetB = Math.max(0, remainNet - dividend54Total);
    const r2B = applyBrackets(remainNetB, params);
    const taxRawCombinedForB = r1.tax + r2B.tax; // A 變體用的 combinedTax = taxRawCombined; B 用的 netForB = r1.tax + r2B.tax... 但 finalizeAB 收的是 net 不是 tax
    // 注意:finalizeAB 第二個參數是「netForBExtractDiv」(即扣回股利的「合併用 net」)。對薪資分開不適用,要直接傳 tax 給 B
    // 我們不能直接用 finalizeAB,要手動處理:
    const dividendCreditA = Math.min(Math.round(dividend54Total * 0.085), 80000);
    const totalCreditsA = dividendCreditA + repurchaseCredit + otherCredit;
    const taxAfterCreditsA = taxRawCombined - totalCreditsA;
    const finalDueA = taxAfterCreditsA - prepaidTax;

    const taxFromSeparateB = Math.round(dividend54Total * 0.28);
    const taxRawB = taxRawCombinedForB + taxFromSeparateB;
    const totalCreditsB = repurchaseCredit + otherCredit;
    const taxAfterCreditsB = taxRawB - totalCreditsB;
    const finalDueB = taxAfterCreditsB - prepaidTax;

    const baseKey = mainId === taxpayerId ? "salarySepTaxpayer" : "salarySepSpouse";
    methods.push({
      key: baseKey + "_A",
      label,
      labelFull: label + " · 股利合併(8.5%抵減)",
      dividendChoice: "combine",
      baseKey,
      desc: "薪資分開,其餘合併,股利合併",
      mainMemberId: mainId,
      sub: [
        { label: "主之薪資淨額", net: mainNet, taxRate: r1.rate, deductValue: r1.deduct, tax: r1.tax },
        { label: "其餘所得淨額", net: remainNet, taxRate: r2.rate, deductValue: r2.deduct, tax: r2.tax },
      ],
      taxRaw: taxRawCombined,
      taxAfterCredits: taxAfterCreditsA,
      finalDue: finalDueA,
      dividendCredit: dividendCreditA,
      dividendSeparateTax: 0,
      formula: {
        type: "salarySep",
        mainSalary: main.salary, mainSalaryDed: main.salaryDed, mainExemption, mainSpecial,
        mainNet, mainRate: r1.rate, mainDeductValue: r1.deduct, mainTax: r1.tax,
        remainGross, remainExemption, remainGeneralDeduction: generalDeduction,
        remainSalaryDed, remainSavings: savings, remainSpecial,
        remainEducation: educationDed, remainPreschool: preschoolDed, remainRentDeduct: rentDeductActual,
        remainDeductTotal: remainDeductSum, blDiff, remainNet,
        remainRate: r2.rate, remainDeductValue: r2.deduct, remainTax: r2.tax,
        taxRaw: taxRawCombined,
      },
    });

    if (dividend54Total > 0) {
      methods.push({
        key: baseKey + "_B",
        label,
        labelFull: label + " · 股利分開(28%)",
        dividendChoice: "separate",
        baseKey,
        desc: "薪資分開,其餘合併,股利分開 28%",
        mainMemberId: mainId,
        sub: [
          { label: "主之薪資淨額", net: mainNet, taxRate: r1.rate, deductValue: r1.deduct, tax: r1.tax },
          { label: "其餘所得淨額(扣回股利後)", net: remainNetB, taxRate: r2B.rate, deductValue: r2B.deduct, tax: r2B.tax },
        ],
        taxRaw: taxRawB,
        taxAfterCredits: taxAfterCreditsB,
        finalDue: finalDueB,
        dividendCredit: 0,
        dividendSeparateTax: taxFromSeparateB,
      });
    }
  };

  if (spouseId && hasTaxpayerWithSalary) {
    computeSalarySep(taxpayerId, "薪資分開 (本人為主)");
  }
  if (spouseId && hasSpouseWithSalary) {
    computeSalarySep(spouseId, "薪資分開 (配偶為主)");
  }

  // === 方法 4 & 5: 各類所得分開計稅 ===
  const computeAllSep = (mainId, label) => {
    const main = incomeByMember[mainId];
    const mainExemption = memberExemption(mainId);
    const mainSpecial = memberSpecial(mainId);
    const mainGrossRaw = main.salary + main.interest + main.dividend + main.rental + main.other;
    const mainGrossAfterSalary = mainGrossRaw - main.salaryDed;
    const mainSavings = Math.min(main.interest, params.savingsDeduction);
    const mainNet = Math.max(0, mainGrossAfterSalary - mainExemption - mainSavings - mainSpecial);
    const r1 = applyBrackets(mainNet, params);

    const grossAllAfterSalary = grossAll - totals.salaryDed;
    const remainGrossAfterSalary = grossAllAfterSalary - mainGrossAfterSalary;
    const remainExemption = allMemberExemption - mainExemption;
    const remainSavings = Math.max(0, savings - mainSavings);
    const remainSpecial = (disabilityDed + longTermCareDed) - mainSpecial;
    const remainDeductSum = generalDeduction + remainSavings + remainSpecial + educationDed + preschoolDed + rentDeductActual;
    const remainNet = Math.max(0, remainGrossAfterSalary - remainExemption - remainDeductSum - blDiff);
    const r2 = applyBrackets(remainNet, params);

    const taxRawCombined = r1.tax + r2.tax;

    // A 變體: 股利合併計稅,享 8.5% 抵減
    const dividendCreditA = Math.min(Math.round(dividend54Total * 0.085), 80000);
    const totalCreditsA = dividendCreditA + repurchaseCredit + otherCredit;
    const taxAfterCreditsA = taxRawCombined - totalCreditsA;
    const finalDueA = taxAfterCreditsA - prepaidTax;

    // B 變體: 股利分開 28% — 股利從「擁有股利的成員塊」扣掉
    // 簡化處理:股利從本人 / 不含本人塊各按比例扣 (主之股利從 main 拿,其餘從 remain 拿)
    const mainDividendFor54 = Math.min(main.dividend, dividend54Total);  // 本人塊內的 54 股利 (估算)
    const remainDividendFor54 = dividend54Total - mainDividendFor54;
    const mainNetB = Math.max(0, mainNet - mainDividendFor54);
    const remainNetB = Math.max(0, remainNet - remainDividendFor54);
    const r1B = applyBrackets(mainNetB, params);
    const r2B = applyBrackets(remainNetB, params);
    const taxFromCombinedB = r1B.tax + r2B.tax;
    const taxFromSeparateB = Math.round(dividend54Total * 0.28);
    const taxRawB = taxFromCombinedB + taxFromSeparateB;
    const totalCreditsB = repurchaseCredit + otherCredit;
    const taxAfterCreditsB = taxRawB - totalCreditsB;
    const finalDueB = taxAfterCreditsB - prepaidTax;

    const baseKey = mainId === taxpayerId ? "allSepTaxpayer" : "allSepSpouse";
    methods.push({
      key: baseKey + "_A",
      label,
      labelFull: label + " · 股利合併(8.5%抵減)",
      dividendChoice: "combine",
      baseKey,
      desc: "主之各類所得分開,其餘合併,股利合併",
      mainMemberId: mainId,
      sub: [
        { label: "主之各類淨額", net: mainNet, taxRate: r1.rate, deductValue: r1.deduct, tax: r1.tax },
        { label: "其餘所得淨額", net: remainNet, taxRate: r2.rate, deductValue: r2.deduct, tax: r2.tax },
      ],
      taxRaw: taxRawCombined,
      taxAfterCredits: taxAfterCreditsA,
      finalDue: finalDueA,
      dividendCredit: dividendCreditA,
      dividendSeparateTax: 0,
      formula: {
        type: "allSep",
        mainGrossAfterSalary, mainSalary: main.salary, mainSalaryDed: main.salaryDed,
        mainInterest: main.interest, mainDividend: main.dividend, mainRental: main.rental,
        mainOther: main.other, mainExemption, mainSavings, mainSpecial,
        mainNet, mainRate: r1.rate, mainDeductValue: r1.deduct, mainTax: r1.tax,
        grossAllAfterSalary, remainExemption, remainGeneralDeduction: generalDeduction,
        remainSavings, remainSpecial, remainEducation: educationDed, remainPreschool: preschoolDed,
        remainRentDeduct: rentDeductActual, remainDeductTotal: remainDeductSum, blDiff,
        remainNet, remainRate: r2.rate, remainDeductValue: r2.deduct, remainTax: r2.tax,
        taxRaw: taxRawCombined,
      },
    });

    if (dividend54Total > 0) {
      methods.push({
        key: baseKey + "_B",
        label,
        labelFull: label + " · 股利分開(28%)",
        dividendChoice: "separate",
        baseKey,
        desc: "主之各類所得分開,其餘合併,股利分開 28%",
        mainMemberId: mainId,
        sub: [
          { label: "主之各類淨額(扣股利後)", net: mainNetB, taxRate: r1B.rate, deductValue: r1B.deduct, tax: r1B.tax },
          { label: "其餘所得淨額(扣股利後)", net: remainNetB, taxRate: r2B.rate, deductValue: r2B.deduct, tax: r2B.tax },
        ],
        taxRaw: taxRawB,
        taxAfterCredits: taxAfterCreditsB,
        finalDue: finalDueB,
        dividendCredit: 0,
        dividendSeparateTax: taxFromSeparateB,
      });
    }
  };

  if (spouseId) {
    computeAllSep(taxpayerId, "各類所得分開 (本人為主)");
    computeAllSep(spouseId, "各類所得分開 (配偶為主)");
  }

  return methods;
}

function computeTaxForFiling(filing, members, year) {
  const params = TAX_PARAMS[year];
  if (!params) return null;

  // 收集申報戶的成員 (主納稅人 + 配偶 + 扶養親屬)
  const filerIds = [filing.taxpayerId, filing.spouseId, ...(filing.dependentIds || [])].filter(Boolean);
  const filers = filerIds.map(id => members.find(m => m.id === id)).filter(Boolean);
  const hasSpouse = !!filing.spouseId;

  // === 1. 各項所得 ===
  // 先把 incomeEntries (逐筆所得明細) 彙總到 effectiveMemberIncome (取代 memberIncome)
  // 規則: 若該成員在 incomeEntries 內有資料,該類別的 memberIncome 將被「entries 加總」取代;
  //       若該成員在 entries 內某類別沒有資料,沿用 memberIncome 的值
  let entriesPrepaidTax = 0;       // 從 entries 累計的扣繳稅額 (要併入 prepaidTax)
  const incomeFromEntries = {};     // { memberId: { salary, interest, dividend, rental, other } }
  let interest5A = 0;               // 5A 金融機構利息 (適用儲蓄投資扣除額)
  let has5BEntries = false;         // 是否有 5B 利息 (用於 UI 提示)
  // 區分:享 8.5% 抵減的股利 (54/54C) vs 不享的營利所得 (71D/71G/71M/54Y/等)
  let dividend54Total = 0;          // 享抵減的部分 (54/54C)
  let dividendOtherTotal = 0;       // 不享抵減的營利所得
  (filing.incomeEntries || []).forEach(e => {
    if (!e.ownerId) return;
    const cat = INCOME_CATEGORIES[e.category];
    if (!cat) return;
    const net = computeEntryNet(e);
    if (!incomeFromEntries[e.ownerId]) incomeFromEntries[e.ownerId] = {};
    const bucket = incomeFromEntries[e.ownerId];
    const targetField = cat.field === "rental" ? "_rental_entries" : cat.field;
    bucket[targetField] = (bucket[targetField] || 0) + net;
    entriesPrepaidTax += toNum(e.withholding);
    // 記 5A 利息 (僅 5A 適用儲蓄投資扣除額,5B 不適用)
    if (e.category === "interest") {
      if (e.code === "5A") interest5A += net;
      else if (e.code === "5B") has5BEntries = true;
    }
    // 區分股利類:54/54C 可享 8.5% 抵減,其他營利所得 (71D 等) 不享
    if (e.category === "dividend") {
      if (codeQualifiesFor85Credit(e.code)) {
        dividend54Total += net;
      } else {
        dividendOtherTotal += net;
      }
    }
  });

  let salaryGross = 0, salaryDeductible = 0;
  let interest = 0, dividend = 0, rentalTaxable = 0, otherIncome = 0;
  const rentalDetail = [];
  let disabilityCount = 0, elderCount = 0, studentCount = 0;
  let preschoolCount = 0;
  let longTermCareCount = 0;

  filers.forEach(m => {
    const income = filing.memberIncome?.[m.id] || {};
    const fromEntries = incomeFromEntries[m.id] || {};
    // 若 entries 該欄位有資料,以 entries 為準;否則用 memberIncome
    const get = (key) => fromEntries[key] !== undefined ? fromEntries[key] : toNum(income[key]);
    const sal = get("salary");
    salaryGross += sal;
    salaryDeductible += Math.min(sal, params.salaryDeduction);
    interest += get("interest");
    dividend += get("dividend");
    otherIncome += get("other");

    // 租金 (用 contracts 推算,公益+一般合約獨立計稅)
    const myProps = (filing.properties || []).filter(p => p.ownerId === m.id);
    const myComputable = myProps.flatMap(p =>
      getComputablesForProperty(p, filing.year, filing.contracts, filing.rentalRecords || [], filing.manualRentOverrides));
    const r = computeRentalIncome(myComputable, params);
    rentalTaxable += r.taxable;
    // 從 entries 補入「無合約物件」的租賃所得 (使用者自填,已扣完費用)
    const rentalFromEntries = fromEntries._rental_entries || 0;
    rentalTaxable += rentalFromEntries;
    rentalDetail.push({ memberId: m.id, ...r });

    // 判斷身分標記用的「角色」
    let role = "dependent";
    if (m.id === filing.taxpayerId) role = "taxpayer";
    else if (m.id === filing.spouseId) role = "spouse";

    const memberAge = getMemberAge(m, year);

    if (m.isDisabled) disabilityCount++;
    if (memberAge >= 70) elderCount++;
    // 教育學費: 限子女、孫子女 (財政部解釋以子女為限,孫子女實務上認可)
    const rel = RELATIONS[m.relation];
    if (m.isStudent && rel && rel.isChild) studentCount++;
    // 幼兒學前: 限子女、孫子女且年齡 < 上限 (113 起 6 歲以下;112 及之前 5 歲以下)
    // 年齡以該年度 12/31 為準,0 歲也算
    const preschoolAgeLimit = params.preschoolAgeLimit || 6;
    if (memberAge >= 0 && memberAge < preschoolAgeLimit && rel && rel.isChild) preschoolCount++;
    if (m.needsLongTermCare) longTermCareCount++;
  });

  // === 套用「申報書對照表」的申報應稅手動覆寫 ===
  // declaredTaxableOverrides 的 key 格式:
  //   c_${contractId}_${year}  — 合約級
  //   m_${propertyId}_${year}_${idx}  — 手動補列
  //   n_${propertyId}_${year}  — 沒合約物件 (使用者手動填申報應稅)
  // 邏輯:override 值「取代」系統算出來的 taxable
  // 同時要按「物件 owner」歸戶,讓 method 內計算也能套用 (透過 memberRentalAdjust)
  const dtOverrides = filing.declaredTaxableOverrides || {};
  const memberRentalAdjust = {};  // {memberId: adjust 金額} 給 method 內套用
  if (Object.keys(dtOverrides).length > 0) {
    const filerIds = new Set([filing.taxpayerId, filing.spouseId, ...(filing.dependentIds || [])].filter(Boolean));
    (filing.properties || []).filter(p => filerIds.has(p.ownerId)).forEach(p => {
      const overrideKey = `${p.id}_${filing.year}`;
      const propOverride = (filing.manualRentOverrides || {})[overrideKey] || {};
      const isIncluded = propOverride.includeInFiling === true;
      const isLand = p.assetType === "land";
      const ownerId = p.ownerId;

      // helper:用 taxable 算式 (跟對照表 calcTaxable 一致)
      const calcTaxableFor = (annualValue, isPub) => {
        const comp = {
          type: isPub ? "public" : (isLand ? "land" : "general"),
          monthlyRent: 0, months: 12,
          annualRentDirect: annualValue,
          landTax: toNum(p.landTax || 0),
          expenseRatio: 0.43,
        };
        return computeRentalIncome([comp], params).breakdown[0]?.taxableIncome || 0;
      };

      const agg = aggregateContractsForYear(filing.contracts, p.id, filing.year, filing.manualRentOverrides);
      let propAdjust = 0;

      if (agg.anyContractInYear && agg.contracts.length > 0) {
        agg.contracts.filter(c => c.months > 0).forEach(c => {
          const auditKey = `c_${c.contractId}_${filing.year}`;
          const ov = dtOverrides[auditKey];
          if (ov === undefined || ov === null || ov === "") return;
          const overrideVal = toNum(ov);
          const appliedAnnual = c.appliedRent !== undefined ? c.appliedRent : c.rent;
          const sysTaxable = isIncluded ? calcTaxableFor(appliedAnnual, c.isPublic) : 0;
          propAdjust += (overrideVal - sysTaxable);
        });
      } else {
        const auditKey = `n_${p.id}_${filing.year}`;
        const ov = dtOverrides[auditKey];
        if (ov !== undefined && ov !== null && ov !== "") {
          propAdjust += (toNum(ov) - 0);
        }
      }
      const computables = getComputablesForProperty(p, filing.year, filing.contracts, filing.rentalRecords || [], filing.manualRentOverrides);
      computables.forEach((comp, idx) => {
        const auditKey = `m_${p.id}_${filing.year}_${idx}`;
        const ov = dtOverrides[auditKey];
        if (ov === undefined || ov === null || ov === "") return;
        const overrideVal = toNum(ov);
        const sysTaxable = isIncluded ? (computeRentalIncome([comp], params).breakdown[0]?.taxableIncome || 0) : 0;
        propAdjust += (overrideVal - sysTaxable);
      });

      if (propAdjust !== 0) {
        memberRentalAdjust[ownerId] = (memberRentalAdjust[ownerId] || 0) + propAdjust;
        rentalTaxable += propAdjust;
      }
    });
  }

  const grossIncome = salaryGross + interest + dividend + rentalTaxable + otherIncome;

  // === 2. 免稅額 (按關係判定) ===
  // 規定: 本人、配偶、直系尊親屬 70 歲以上適用 145,500;其他親屬即使 70 歲仍用 97,000
  const exemption = filers.reduce((sum, m) => {
    let role = "dependent";
    if (m.id === filing.taxpayerId) role = "taxpayer";
    else if (m.id === filing.spouseId) role = "spouse";
    return sum + (canUseElderExemption(m, role, year) ? params.exemptionElder : params.exemption);
  }, 0);

  // === 3. 一般扣除額: 標準 vs 列舉 ===
  const standardDeduction = hasSpouse ? params.standardCouple : params.standardSingle;

  const itemized = filing.itemizedDeductions || {};
  const donationGeneral = toNum(itemized.donationGeneral);     // 一般捐贈(限20%)
  const donationUnlimited = toNum(itemized.donationUnlimited); // 不限額捐贈(政府/國防/勞軍等)
  const insurancePersonal = toNum(itemized.insurancePersonal); // 人身保險費(每人上限24,000)
  const insurancePersonalByMember = itemized.insurancePersonalByMember || {}; // 逐人輸入 (優先)
  const insuranceHealth = toNum(itemized.insuranceHealth);     // 健保費(不限額)
  const medical = toNum(itemized.medical);                     // 醫藥及生育費(不限額)
  const disaster = toNum(itemized.disaster);                   // 災害損失
  const mortgageInterest = toNum(itemized.mortgageInterest);   // 自用住宅購屋借款利息

  // 手動覆寫 (使用者直接指定「可扣除」金額,優先於系統自動算上限)
  // 規則:若有設定 override 且 ≥ 0 → 使用 override;否則用系統算
  const itemizedOverrides = itemized.overrides || {};
  const applyOverride = (key, autoValue) => {
    const o = itemizedOverrides[key];
    if (o !== undefined && o !== null && o !== "") return toNum(o);
    return autoValue;
  };

  // 捐贈上限: 一般捐贈不得超過「綜合所得總額」 20%
  // 注意:官方申報書「綜合所得總額」是「薪資已扣特扣後」的數字,所以 20% 上限要用扣完薪資特扣的金額
  const grossIncomeForDonation = grossIncome - salaryDeductible;
  const donationGeneralCappedAuto = Math.min(donationGeneral, grossIncomeForDonation * 0.20);

  // 保險費上限: 每人 24,000;若某人實際 < 24,000 則只能扣實際 (不可互相分配)
  // 規則:每一被保險人 × min(實際, 24,000) 後加總 = 可扣除
  let insurancePersonalCappedAuto;
  let insurancePersonalHasPerMember = false;
  const perMemberKeys = Object.keys(insurancePersonalByMember).filter(k => toNum(insurancePersonalByMember[k]) > 0);
  if (perMemberKeys.length > 0) {
    // 使用者已逐人輸入 → 每人各自套 24,000 上限
    insurancePersonalHasPerMember = true;
    insurancePersonalCappedAuto = perMemberKeys.reduce((s, k) => {
      const amt = toNum(insurancePersonalByMember[k]);
      return s + Math.min(amt, params.insuranceLimit);
    }, 0);
  } else {
    // 舊版相容:整戶總額,以 "申報戶人數 × 24,000" 為上限 (但這會略高估,使用者應改用逐人輸入)
    insurancePersonalCappedAuto = Math.min(insurancePersonal, filers.length * params.insuranceLimit);
  }

  // 房貸利息: 實際金額 − 儲蓄投資扣除額 (儲蓄會先扣完);上限 30 萬
  const mortgageInterestCappedAuto = Math.min(
    Math.max(0, mortgageInterest - 0),  // 儲蓄要在外面扣 (這裡先給原值)
    params.mortgageLimit
  );

  // 套用覆寫 (使用者直接填可扣除金額時)
  const donationGeneralCapped = applyOverride("donationGeneral", donationGeneralCappedAuto);
  const donationUnlimitedCapped = applyOverride("donationUnlimited", donationUnlimited);
  const insurancePersonalCapped = applyOverride("insurancePersonal", insurancePersonalCappedAuto);
  const insuranceHealthCapped = applyOverride("insuranceHealth", insuranceHealth);
  const medicalCapped = applyOverride("medical", medical);
  const disasterCapped = applyOverride("disaster", disaster);
  // 房貸的最終扣除值在 actualMortgage 計算 (含 30 萬上限);此處保留原始值

  const itemizedTotal =
    donationGeneralCapped + donationUnlimitedCapped +
    insurancePersonalCapped + insuranceHealthCapped +
    medicalCapped + disasterCapped + mortgageInterest;
    // 註:mortgageInterest 在後面會被 actualMortgage 取代

  const useItemized = filing.deductionChoice === "itemized" ||
    (filing.deductionChoice === "auto" && itemizedTotal > standardDeduction);

  const generalDeduction = useItemized ? itemizedTotal : standardDeduction;

  // === 4. 特別扣除額 ===
  // 儲蓄投資扣除額:依稅法規定,**只有「5A 金融機構存款利息」適用**
  // 5B (證券公司、保險公司等非金融機構利息) 不適用扣除
  // 邏輯:
  //   - 若使用者用「逐筆所得明細」表 → savingsAuto = min(Σ 5A 利息, 270k)
  //   - 若使用者只用 ① 區單格輸入 (沒分代號) → 退回舊邏輯,假設全部利息都是 5A
  //   - 使用者可手動覆寫
  const hasInterestEntries = (filing.incomeEntries || []).some(e => e.category === "interest");
  const savingsBase = hasInterestEntries ? interest5A : interest;  // 沒填 entries 時退回全部利息
  const savingsAuto = Math.min(savingsBase, params.savingsDeduction);
  const savings = filing.savingsOverride
    ? Math.min(Math.max(0, toNum(filing.savingsOverrideAmount)), params.savingsDeduction)
    : savingsAuto;
  // 身障特別扣除:預設按 isDisabled × params;允許手動覆寫
  const disabilityDedAuto = disabilityCount * params.disabilityDeduction;
  const disabilityDed = filing.disabilityDedOverride !== undefined && filing.disabilityDedOverride !== null && filing.disabilityDedOverride !== ""
    ? toNum(filing.disabilityDedOverride)
    : disabilityDedAuto;
  // 教育學費: 預設按 isStudent 子女算 25,000 × 人數;允許手動覆寫 (例: 申報書沒列)
  const educationDedAuto = Math.min(studentCount, filers.length) * params.educationDeduction;
  const educationDed = filing.educationDedOverride !== undefined && filing.educationDedOverride !== null && filing.educationDedOverride !== ""
    ? toNum(filing.educationDedOverride)
    : educationDedAuto;
  // 幼兒學前: 第一名定額,第二名以上提高 (依 114 年制度)
  let preschoolDedAuto = 0;
  if (preschoolCount > 0) {
    preschoolDedAuto = params.preschoolFirst + Math.max(0, preschoolCount - 1) * params.preschoolOther;
  }
  const preschoolDed = filing.preschoolDedOverride !== undefined && filing.preschoolDedOverride !== null && filing.preschoolDedOverride !== ""
    ? toNum(filing.preschoolDedOverride)
    : preschoolDedAuto;
  // 長照
  const longTermCareDedAuto = longTermCareCount * params.longTermCare;
  const longTermCareDed = filing.longTermCareDedOverride !== undefined && filing.longTermCareDedOverride !== null && filing.longTermCareDedOverride !== ""
    ? toNum(filing.longTermCareDedOverride)
    : longTermCareDedAuto;

  // 薪資扣除額
  const salarySD = salaryDeductible;

  // 房租支出特別扣除額 (114 起為特別扣除額,上限 18 萬;但稅率 20% 以上不得扣)
  const rentSupport = toNum(filing.rentSupportPaid);
  // 先試算,真正能扣需看稅率,稍後處理
  const rentSupportCapped = Math.min(rentSupport, params.rentDeduction);

  // 自用住宅購屋借款利息: 真實扣除額 = max(0, 利息 - 儲蓄投資扣除額)
  // 但因為儲蓄投資已在特扣處理,這裡列舉時要扣除
  // (簡化處理: 若選列舉且利息支出 > savings,實際可列 = 利息 - savings,上限30萬)
  let actualMortgageAuto = 0;
  if (useItemized && mortgageInterest > 0) {
    actualMortgageAuto = Math.min(Math.max(0, mortgageInterest - savings), params.mortgageLimit);
  }
  const actualMortgage = useItemized ? applyOverride("mortgageInterest", actualMortgageAuto) : 0;
  // 重算列舉合計 (扣除儲蓄投資後的房貸利息)
  const itemizedTotalActual = useItemized ?
    (donationGeneralCapped + donationUnlimitedCapped + insurancePersonalCapped + insuranceHealthCapped + medicalCapped + disasterCapped + actualMortgage)
    : 0;
  const generalDeductionActual = useItemized ? itemizedTotalActual : standardDeduction;

  const specialBeforeRent = salarySD + savings + disabilityDed + educationDed + preschoolDed + longTermCareDed;

  // === 5. 試算淨所得 (不含房租特扣) ===
  const netBeforeRent = Math.max(0, grossIncome - exemption - generalDeductionActual - specialBeforeRent);
  const taxResultBefore = applyBrackets(netBeforeRent, params);

  // 房租支出特扣: 若稅率 < 20% 才可扣
  let rentDeductActual = 0;
  if (year >= 114 && rentSupportCapped > 0 && taxResultBefore.rate < 0.20) {
    rentDeductActual = rentSupportCapped;
  }

  const specialTotal = specialBeforeRent + rentDeductActual;

  // === 6. 基本生活費差額 ===
  // 比較基準: 免稅額 + 一般扣除額 + 儲蓄+身障+教育+幼兒+長照+房租
  const blcompare = exemption + generalDeductionActual + savings + disabilityDed + educationDed + preschoolDed + longTermCareDed + rentDeductActual;
  const blTotal = filers.length * params.basicLivingExp;
  const blDiff = Math.max(0, blTotal - blcompare);

  // === 7. 淨所得 & 稅 ===
  const netIncome = Math.max(0, grossIncome - exemption - generalDeductionActual - specialTotal - blDiff);
  const taxResult = applyBrackets(netIncome, params);

  // === 7.5 股利可抵減稅額 ===
  // 規則 (所得稅法第 15 條第 4 項):
  //   合併計稅: 股利全額併入綜所,但可用「股利 × 8.5%」抵減稅額,每戶上限 80,000
  //   分開計稅: 股利不併入綜所,單獨用 28% 課稅 (適用高所得者,本系統暫不支援自動切換)
  //   ⚠ 只有 54/54C (公司、合作社、法人 87 年後盈餘) 享抵減,
  //   71D 小規模查定、71G 信託、71M 緩課、54Y 其他營利 — 不享抵減,須併入綜所一般課稅
  // 預設採用「合併計稅,享 8.5% 抵減」
  const dividendChoice = filing.dividendChoice || "combine"; // combine | separate
  let dividendCredit = 0;
  let dividendSeparateTax = 0;
  // dividend54Total / dividendOtherTotal 已在前面從 entries 累計
  // 若 entries 為空,只能假設整個 dividend 都是 54C 享抵減 (向下相容)
  const hasDividendEntries = (filing.incomeEntries || []).some(e => e.category === "dividend");
  const dividendCreditable = hasDividendEntries ? dividend54Total : dividend;
  const dividendNonCreditable = hasDividendEntries ? dividendOtherTotal : 0;
  if (dividendChoice === "combine") {
    dividendCredit = Math.min(Math.round(dividendCreditable * 0.085), 80000);
  } else if (dividendChoice === "separate") {
    // 分開計稅: 只能用 54/54C 部分分開,71D 等強制併入
    dividendSeparateTax = Math.round(dividendCreditable * 0.28);
  }

  // === 7.6 已扣繳稅額 / 重購自用住宅退稅 / 其他可扣抵 ===
  const taxCredits = filing.taxCredits || {};
  const prepaidTax = toNum(taxCredits.prepaidTax) + entriesPrepaidTax;  // 已預扣繳 (手動填的 + entries 加總)
  const repurchaseCredit = toNum(taxCredits.repurchaseCredit);// 重購自用住宅退稅
  const otherCredit = toNum(taxCredits.otherCredit);          // 其他抵減 (含投資抵減、自用住宅買賣退稅等)

  // === 7.7 應自繳稅額計算 ===
  // 法定步驟:
  //   (1) 綜所稅 = 淨額 × 稅率 − 累進差額
  //   (2) 減「投資抵減 / 大陸地區所得已納稅額 / 重購退稅 / 股利抵減」(但股利抵減上限 8 萬)
  //   (3) 減「已預扣繳稅額」= 應自繳/退稅
  const totalCreditsBeforePrepaid = dividendCredit + repurchaseCredit + otherCredit;
  // 注意: 股利抵減、重購退稅可以「退稅」,不應被 Math.max(0,...) 卡住
  const taxAfterCredits = taxResult.tax + dividendSeparateTax - totalCreditsBeforePrepaid;
  const finalDue = taxAfterCredits - prepaidTax; // 正數 = 應補繳;負數 = 可退稅

  // === 7.8 5 種計稅方式試算 (所得稅法第15條夫妻計稅選擇) ===
  // 僅在「夫妻合併申報」且雙方都有所得時才有意義
  const methods = computeAllTaxMethods({
    filers,
    taxpayerId: filing.taxpayerId,
    spouseId: filing.spouseId,
    memberIncome: (() => {
      // 把 memberIncome 跟 incomeFromEntries 合併 (entries 優先)
      // 確保 computeAllTaxMethods 跑 5 種稅法時也能用逐筆明細的數字
      const merged = {};
      filers.forEach(m => {
        const orig = filing.memberIncome?.[m.id] || {};
        const fromEnt = incomeFromEntries[m.id] || {};
        // 套用 declaredTaxableOverrides 的差額 (把 override 視為「其他所得」的調整)
        const rentalAdj = memberRentalAdjust[m.id] || 0;
        merged[m.id] = {
          salary: fromEnt.salary !== undefined ? fromEnt.salary : toNum(orig.salary),
          interest: fromEnt.interest !== undefined ? fromEnt.interest : toNum(orig.interest),
          dividend: fromEnt.dividend !== undefined ? fromEnt.dividend : toNum(orig.dividend),
          other: (fromEnt.other !== undefined ? fromEnt.other : toNum(orig.other))
                 + (fromEnt._rental_entries || 0)
                 + rentalAdj,  // 申報書對照表的覆寫差額 (視為其他所得)
        };
      });
      return merged;
    })(),
    householdProperties: (filing.properties || []),
    rentalRecords: filing.rentalRecords || [],
    contracts: filing.contracts || [],
    manualOverrides: filing.manualRentOverrides || {},
    params,
    year,
    // 把上面算好的扣除額/抵減傳進去,因為這些不受計稅方式影響
    exemption,
    exemptionByMember: filers.map(m => {
      let role = "dependent";
      if (m.id === filing.taxpayerId) role = "taxpayer";
      else if (m.id === filing.spouseId) role = "spouse";
      return { memberId: m.id, amount: canUseElderExemption(m, role, year) ? params.exemptionElder : params.exemption, role };
    }),
    generalDeduction: generalDeductionActual,
    disabilityDed,
    disabilityDedAuto,
    disabilityCount,
    educationDed,
    educationDedAuto,
    studentCount,
    preschoolDed,
    preschoolDedAuto,
    preschoolCount,
    longTermCareDed,
    longTermCareDedAuto,
    longTermCareCount,
    rentDeductActual,
    blDiff,
    savings,
    dividend54: dividendCreditable,  // 享 8.5% 抵減的部分 (54/54C)
    repurchaseCredit,
    otherCredit,
    prepaidTax,
  });

  // 選稅最低的
  const bestMethod = methods.reduce((best, m) =>
    (!best || m.finalDue < best.finalDue) ? m : best, null);

  // 預設使用最佳方法的結果作為主要顯示
  // taxMethod 可能是新版的 _A / _B 後綴 key,或舊版的 "combined" / "salarySepTaxpayer" 等 (向下相容: 加 _A)
  const useMethod = filing.taxMethod || "auto";
  const findMethod = (k) => methods.find(m => m.key === k)
    || methods.find(m => m.key === k + "_A")
    || methods.find(m => m.baseKey === k);
  const chosenMethod = useMethod === "auto"
    ? bestMethod
    : (findMethod(useMethod) || bestMethod);

  // === 8. 標準 vs 列舉比較 (給使用者參考) ===
  const altDeduction = useItemized ? standardDeduction : itemizedTotalActual;
  const altGeneral = altDeduction;
  const altNet = Math.max(0, grossIncome - exemption - altGeneral - specialTotal - blDiff);
  const altTaxRaw = applyBrackets(altNet, params).tax;
  // alt 也要扣抵
  const altTaxAfterCredits = altTaxRaw + dividendSeparateTax - totalCreditsBeforePrepaid;
  const altTax = altTaxAfterCredits - prepaidTax;
  const saving = altTax - finalDue; // 比較最終實繳

  // 申報戶合法性檢查
  const warnings = validateFiling(filing, members);

  return {
    year,
    params,
    filers,
    hasSpouse,
    warnings,
    // 所得
    salaryGross, interest, dividend, rentalTaxable, otherIncome, grossIncome,
    grossIncomeForDonation,  // 申報書版綜所總額 (扣完薪資特扣後),用於捐贈 20% 上限
    rentalDetail,
    // 扣除
    exemption,
    standardDeduction,
    itemizedTotal: itemizedTotalActual,
    useItemized,
    generalDeduction: generalDeductionActual,
    itemizedDetail: {
      donationGeneral: donationGeneralCapped,
      donationUnlimited: donationUnlimitedCapped,
      insurancePersonal: insurancePersonalCapped,
      insuranceHealth: insuranceHealthCapped,
      medical: medicalCapped,
      disaster: disasterCapped,
      mortgageInterest: actualMortgage,
    },
    // 系統自動算的可扣除值 (套上限後,沒被 override),給 UI 雙欄對比用
    itemizedAuto: {
      donationGeneral: donationGeneralCappedAuto,
      donationUnlimited: donationUnlimited,
      insurancePersonal: insurancePersonalCappedAuto,
      insuranceHealth: insuranceHealth,
      medical: medical,
      disaster: disaster,
      mortgageInterest: actualMortgageAuto,
    },
    // 特扣
    salarySD, savings, savingsAuto, disabilityDed, educationDed, preschoolDed, longTermCareDed, rentDeductActual,
    specialTotal,
    // 利息明細 (5A 適用儲蓄扣除,5B 不適用)
    interest5A,
    has5BEntries,
    hasInterestEntries,
    // 基本生活費
    blTotal, blcompare, blDiff,
    // 稅 — 採用 chosenMethod 的結果作為最終值
    netIncome,
    taxRate: chosenMethod && chosenMethod.sub.length === 1 ? chosenMethod.sub[0].taxRate : taxResult.rate,
    taxDeductValue: taxResult.deduct,
    tax: chosenMethod ? chosenMethod.taxRaw : taxResult.tax,
    // 抵減
    dividendChoice,
    dividendCredit,
    dividendSeparateTax,
    dividend54: dividendCreditable,        // 享 8.5% 抵減的部分 (54/54C)
    dividendOther: dividendNonCreditable,  // 不享抵減的營利所得 (71D/71G/71M/54Y)
    hasDividendEntries,                    // UI 提示用
    repurchaseCredit,
    otherCredit,
    totalCreditsBeforePrepaid,
    taxAfterCredits: chosenMethod ? chosenMethod.taxAfterCredits : taxAfterCredits,
    prepaidTax,
    finalDue: chosenMethod ? chosenMethod.finalDue : finalDue, // 正數 = 補繳;負數 = 退稅
    // 5 種計稅方式比較
    taxMethods: methods,
    bestMethod,
    chosenMethod,
    taxMethodUsed: useMethod,
    // 比較
    altDeduction: useItemized ? "standard" : "itemized",
    altTax,
    saving,
  };
}

// ============================================================
// 預設資料
// ============================================================
const SAMPLE_DATA = {
  members: [],
  filings: [],
  properties: [],
  rentalRecords: [], // 舊版相容: {id, propertyId, year, monthlyRent, months, type, includeInFiling, ...}
  contracts: [],     // 新版: {id, propertyId, tenantName, tenantPhone, startDate, endDate, monthlyRent, managementFee, deposit, landlordOwner, isPublicLandlord, publicLandlordName, publicLandlordAmount, publicLandlordPeriod, note}
  payerDirectory: {}, // 扣繳單位通訊錄: {taxId: name} (從每筆 entries 自動累積)
  meta: { lastSavedAt: null, version: 3 },
};

// 給定一個物件 + 年度,找出該年度的紀錄;若不存在則用物件預設值組成虛擬紀錄
// ============================================================
// 合約 → 年度租金聚合 (天數精準計算,避免重疊月份被算兩次)
// ============================================================
// 計算邏輯:
// 1. 每份合約算出該年度在每個月「實際佔用的天數」
// 2. 公益合約優先:該月公益佔幾天,該月可用天數扣多少
// 3. 一般合約只能用「該月剩餘天數」
// 4. 月租 × (該月實際天數 / 該月總天數) = 該月攤分金額
function aggregateContractsForYear(contracts, propertyId, year, manualOverrides) {
  const propContracts = (contracts || []).filter(c => c.propertyId === propertyId);
  const breakdown = [];
  let totalRent = 0;
  let totalEffectiveMonths = 0; // 以「等效月」表示 (天數 / 該月總天數)
  let publicRent = 0, generalRent = 0;
  let anyContractInYear = false;

  const isPublicOf = (c) => c.contractType === "public" || (!c.contractType && c.isPublicLandlord);

  // 第一階段: 每份合約算出每月的「原始佔用天數」
  const enriched = propContracts.map(c => {
    const start = parseRocDate(c.startDate);
    const end = parseRocDate(c.endDate);
    if (!start || !end) return null;
    const dayCounts = monthDaysInYear(start, end, year); // 長度 12 陣列
    return { contract: c, start, end, dayCounts, isPublic: isPublicOf(c) };
  }).filter(Boolean);

  // 第二階段: 公益優先,逐月扣除已被公益佔用的天數
  // 用一個「該月剩餘可用天數」追蹤,公益先取
  const remainingDays = new Array(12);
  for (let i = 0; i < 12; i++) remainingDays[i] = daysInMonth(year, i + 1);

  // 公益先處理 (兩份公益合約若同月重疊,先到先服務 — 按 startDate 排序)
  const publicEnriched = enriched.filter(e => e.isPublic)
    .sort((a, b) => String(a.contract.startDate).localeCompare(String(b.contract.startDate)));
  const generalEnriched = enriched.filter(e => !e.isPublic)
    .sort((a, b) => String(a.contract.startDate).localeCompare(String(b.contract.startDate)));

  const processContract = (e) => {
    const { contract: c, start, end, dayCounts, isPublic } = e;
    const monthly = toNum(c.monthlyRent);
    let effectiveMonths = 0;       // 累計等效月數
    let effectiveDaysMap = [];     // 各月實際採用天數,給 UI
    let rentSum = 0;
    const monthsCoveredRaw = [];   // 原始涵蓋月份 (給 hasOverlapWithPublic 判定)

    for (let m = 0; m < 12; m++) {
      const want = dayCounts[m];
      if (want === 0) continue;
      monthsCoveredRaw.push(m + 1);
      const totalDays = daysInMonth(year, m + 1);
      const available = remainingDays[m];
      const use = Math.min(want, available);
      if (use <= 0) continue;
      remainingDays[m] -= use;
      const ratio = use / totalDays;
      effectiveMonths += ratio;
      rentSum += monthly * ratio;
      effectiveDaysMap.push({ month: m + 1, days: use, totalDays, ratio });
    }

    if (effectiveMonths === 0) {
      breakdown.push({
        contractId: c.id,
        tenantName: c.tenantName,
        months: 0,
        monthly,
        rent: 0,
        isPublic,
        period: `${formatRocDate(start)} ~ ${formatRocDate(end)}`,
        overriddenByPublic: !isPublic,
        note: "全期間被公益合約覆蓋,僅作紀錄",
      });
      return;
    }

    anyContractInYear = true;
    // 四捨五入到整數元
    rentSum = Math.round(rentSum);
    totalRent += rentSum;
    totalEffectiveMonths += effectiveMonths;
    if (isPublic) publicRent += rentSum;
    else generalRent += rentSum;

    // 為了 UI 顯示用,以「等效月數」(四捨五入到 0.01) 表示
    const monthsDisplay = Math.round(effectiveMonths * 100) / 100;
    breakdown.push({
      contractId: c.id,
      tenantName: c.tenantName,
      months: monthsDisplay,
      monthly,
      rent: rentSum,
      isPublic,
      period: `${formatRocDate(start)} ~ ${formatRocDate(end)}`,
      effectiveDays: effectiveDaysMap,
      hasOverlapWithPublic: !isPublic && monthsCoveredRaw.some(m => {
        // 該月原本想用 dayCounts[m-1] 天,但實際採用少於該值
        const want = dayCounts[m - 1];
        const used = effectiveDaysMap.find(d => d.month === m)?.days || 0;
        return used < want;
      }),
    });
  };

  // 先處理公益,再處理一般
  publicEnriched.forEach(processContract);
  generalEnriched.forEach(processContract);

  if (enriched.length > 0) anyContractInYear = true;

  const overrideKey = `${propertyId}_${year}`;
  const override = (manualOverrides || {})[overrideKey] || {};
  const byContract = override.byContract || {};
  const excludedContracts = override.excludedContracts || {};  // {contractId: true} 表示該合約不計入

  // 把 byContract 套用到 breakdown 上 (每份合約的 appliedRent)
  breakdown.forEach(item => {
    const isExcluded = !!excludedContracts[item.contractId];
    const m = byContract[item.contractId];
    if (isExcluded) {
      // 使用者明確排除 → appliedRent = 0
      item.manualRent = m !== undefined && m !== "" && m !== null ? toNum(m) : null;
      item.appliedRent = 0;
      item.isAdjusted = true;
      item.isExcluded = true;
    } else if (m !== undefined && m !== "" && m !== null) {
      item.manualRent = toNum(m);
      item.appliedRent = toNum(m);
      item.isAdjusted = true;
      item.isExcluded = false;
    } else {
      item.manualRent = null;       // 沒手動調整
      item.appliedRent = item.rent; // 用合約原算的
      item.isAdjusted = false;
      item.isExcluded = false;
    }
  });

  // 老版本「整體手動覆寫」邏輯:仍可運作(優先 byContract,若沒則用 totalAnnualRent)
  let manualTotal = null;
  if (override.totalAnnualRent !== undefined) {
    manualTotal = toNum(override.totalAnnualRent);
  } else if (override.annualRent !== undefined) {
    manualTotal = toNum(override.annualRent);
  } else if (override.generalAnnualRent !== undefined || override.publicAnnualRent !== undefined) {
    manualTotal = toNum(override.generalAnnualRent || 0) + toNum(override.publicAnnualRent || 0);
  }

  // 若有逐合約調整,整個物件的 appliedAnnualRent = 各合約 appliedRent 加總
  const hasPerContractAdjust = breakdown.some(i => i.isAdjusted);

  // 計算「物件級套用」: 若用 byContract,則直接加總每合約 appliedRent
  let appliedPublicRent, appliedGeneralRent;
  if (hasPerContractAdjust) {
    appliedPublicRent = breakdown.filter(i => i.isPublic).reduce((s, i) => s + (i.appliedRent || 0), 0);
    appliedGeneralRent = breakdown.filter(i => !i.isPublic).reduce((s, i) => s + (i.appliedRent || 0), 0);
  } else if (manualTotal !== null) {
    appliedPublicRent = publicRent;
    appliedGeneralRent = Math.max(0, manualTotal - publicRent);
  } else {
    appliedPublicRent = publicRent;
    appliedGeneralRent = generalRent;
  }

  return {
    contracts: breakdown,
    totalMonths: Math.round(totalEffectiveMonths * 100) / 100,
    publicRent,
    generalRent,
    computedAnnualRent: totalRent,
    manualOverride: manualTotal !== null || hasPerContractAdjust,
    manualTotal,
    hasPerContractAdjust,
    manualIncludeInFiling: override.includeInFiling === true,  // 預設 false,需主動勾選才計入
    appliedPublicRent,
    appliedGeneralRent,
    appliedAnnualRent: appliedPublicRent + appliedGeneralRent,
    hasMixedType: publicRent > 0 && generalRent > 0,
    anyContractInYear,
  };
}

// ============================================================
// 取得某物件在某年度的計算用 records (可能 1~N 份,公益/一般分開)
// ============================================================
function getComputablesForProperty(property, year, contracts, rentalRecords, manualOverrides) {
  // 先檢查: 無合約 + 手動補列 (適用土地、停車位等)
  const overrideKey = `${property.id}_${year}`;
  const override = (manualOverrides || {})[overrideKey] || {};
  const hasAnyContract = contracts && contracts.some(c => c.propertyId === property.id);
  const aggCheck = hasAnyContract ? aggregateContractsForYear(contracts, property.id, year, manualOverrides) : null;
  const noContractInYear = !aggCheck || !aggCheck.anyContractInYear;

  if (noContractInYear && override.totalAnnualRent !== undefined && override.totalAnnualRent > 0) {
    const isPub = override.manualType === "public";
    const isLand = property.assetType === "land";
    return [{
      id: `manual_${property.id}_${year}`,
      name: `${property.name}${isLand ? " (土地·手動)" : " (手動補列)"}`,
      address: property.address,
      ownerId: property.ownerId,
      // 土地走土地稅務 (扣地價稅);公益不適用於土地;否則一般 43%
      type: isLand ? "land" : (isPub ? "public" : "general"),
      monthlyRent: Math.round(toNum(override.totalAnnualRent) / 12),
      months: 12,
      annualRentDirect: toNum(override.totalAnnualRent),
      landTax: toNum(property.landTax || 0),
      expenseRatio: 0.43,
      note: isLand
        ? `土地·手動補列 ${fmt(toNum(override.totalAnnualRent))} − 地價稅 ${fmt(toNum(property.landTax || 0))}`
        : `${isPub ? "公益" : "一般"}·手動補列 ${fmt(toNum(override.totalAnnualRent))}`,
      _fromContract: true,
    }];
  }

  // 優先: 合約資料
  if (contracts && contracts.some(c => c.propertyId === property.id)) {
    const agg = aggregateContractsForYear(contracts, property.id, year, manualOverrides);
    if (agg.anyContractInYear) {
      if (!agg.manualIncludeInFiling) return [];

      const out = [];

      // === 公益部分: 逐份公益合約獨立 (如有手動調整則用 appliedRent) ===
      const publicContractsForYear = agg.contracts.filter(c => c.isPublic);
      publicContractsForYear.forEach(c => {
        const annual = c.appliedRent !== undefined ? c.appliedRent : c.rent;
        out.push({
          id: `pub_${c.contractId}_${year}`,
          name: `${property.name} · ${c.tenantName} (公益)`,
          address: property.address,
          ownerId: property.ownerId,
          type: "public",
          monthlyRent: c.monthly,
          months: c.months,
          annualRentDirect: annual,
          expenseRatio: 0.43,
          note: `公益出租 · ${c.period} · ${Number.isInteger(c.months) ? c.months : c.months.toFixed(2)}個月${c.isAdjusted ? " · 手動" : ""}`,
          _fromContract: true,
        });
      });

      // === 一般部分 ===
      const isLandAsset = property.assetType === "land";
      // 優先: 逐合約手動調整
      if (agg.hasPerContractAdjust) {
        const generalContracts = agg.contracts.filter(c => !c.isPublic);
        generalContracts.forEach(c => {
          const annual = c.appliedRent !== undefined ? c.appliedRent : c.rent;
          out.push({
            id: `gen_${c.contractId}_${year}`,
            name: `${property.name} · ${c.tenantName}${isLandAsset ? " (土地)" : ""}`,
            address: property.address,
            ownerId: property.ownerId,
            type: isLandAsset ? "land" : "general",
            monthlyRent: c.monthly,
            months: c.months,
            annualRentDirect: annual,
            landTax: toNum(property.landTax || 0),
            expenseRatio: 0.43,
            note: isLandAsset
              ? `土地·${c.period}${c.isAdjusted ? " · 手動" : ""} · 地價稅 ${fmt(toNum(property.landTax || 0))}`
              : `一般出租 · ${c.period}${c.isAdjusted ? " · 手動" : ""}`,
            _fromContract: true,
          });
        });
      } else if (agg.manualTotal !== null) {
        // 舊版相容: 物件級手動覆寫
        if (agg.appliedGeneralRent > 0) {
          const generalContracts = agg.contracts.filter(c => !c.isPublic);
          const generalTotalMonths = generalContracts.reduce((s, c) => s + c.months, 0) || 12;
          out.push({
            id: `gen_manual_${property.id}_${year}`,
            name: `${property.name}${isLandAsset ? " (土地·手動)" : " (一般·手動)"}`,
            address: property.address,
            ownerId: property.ownerId,
            type: isLandAsset ? "land" : "general",
            monthlyRent: Math.round(agg.appliedGeneralRent / generalTotalMonths),
            months: generalTotalMonths,
            annualRentDirect: agg.appliedGeneralRent,
            landTax: toNum(property.landTax || 0),
            expenseRatio: 0.43,
            note: isLandAsset
              ? `土地·手動 = ${fmt(agg.manualTotal)} − 地價稅 ${fmt(toNum(property.landTax || 0))}`
              : `一般部分 = 手動總額 ${fmt(agg.manualTotal)} − 公益 ${fmt(agg.appliedPublicRent)}`,
            _fromContract: true,
          });
        }
      } else {
        // 自動: 逐份一般合約獨立
        const generalContracts = agg.contracts.filter(c => !c.isPublic);
        generalContracts.forEach(c => {
          out.push({
            id: `gen_${c.contractId}_${year}`,
            name: `${property.name} · ${c.tenantName}${isLandAsset ? " (土地)" : ""}`,
            address: property.address,
            ownerId: property.ownerId,
            type: isLandAsset ? "land" : "general",
            monthlyRent: c.monthly,
            months: c.months,
            annualRentDirect: c.rent,
            landTax: toNum(property.landTax || 0),
            expenseRatio: 0.43,
            note: isLandAsset
              ? `土地出租 · ${c.period} · 地價稅 ${fmt(toNum(property.landTax || 0))}`
              : `一般出租 · ${c.period} · ${Number.isInteger(c.months) ? c.months : c.months.toFixed(2)}個月`,
            _fromContract: true,
          });
        });
      }

      return out;
    }
  }

  // Fallback: 舊版 rentalRecords (一物件一年一筆)
  const rec = getRentalRecord(rentalRecords, property, year, contracts, manualOverrides);
  if (rec.includeInFiling && !rec.isVirtual) {
    return [recordToComputable(rec, property)];
  }
  return [];
}


// ============================================================
// 舊版 getRentalRecord (相容用,內部呼叫 contracts 邏輯)
// ============================================================
function getRentalRecord(rentalRecords, property, year, contracts, manualOverrides) {
  // 優先: 從合約清單推算
  if (contracts && contracts.some(c => c.propertyId === property.id)) {
    const agg = aggregateContractsForYear(contracts, property.id, year, manualOverrides);
    if (agg.anyContractInYear) {
      const overrideKey = `${property.id}_${year}`;
      const override = (manualOverrides || {})[overrideKey];
      // 把聚合結果包成 record 格式 (給 UI 表格顯示用,稅務計算用 getComputablesForProperty)
      const type = agg.publicRent > 0 && agg.generalRent === 0 ? "public" : "general";
      const annualRent = agg.appliedAnnualRent;
      const months = agg.totalMonths || 12;
      const monthlyRent = months > 0 ? Math.round(annualRent / months) : 0;
      return {
        id: `contract_${property.id}_${year}`,
        propertyId: property.id,
        year,
        monthlyRent,
        months,
        type,
        expenseRatio: 0.43,
        annualRentDirect: annualRent,
        taxFreeReason: "",
        note: `${agg.contracts.length} 份合約攤分${agg.manualOverride ? " (手動覆寫)" : ""}${agg.hasMixedType ? " ⚠ 公益+一般並存" : ""}`,
        includeInFiling: override && override.includeInFiling === false ? false : true,
        isVirtual: false,
        fromContract: true,
        contractAgg: agg,
      };
    }
  }
  // Fallback: 舊版 rentalRecords
  const found = (rentalRecords || []).find(r => r.propertyId === property.id && r.year === year);
  if (found) return found;
  return {
    id: null,
    propertyId: property.id,
    year,
    monthlyRent: 0,
    months: 0,
    type: property.type || "general",
    expenseRatio: property.expenseRatio || 0.43,
    taxFreeReason: "",
    note: "(尚未建立此年度紀錄)",
    includeInFiling: false,
    isVirtual: true,
  };
}

// 把紀錄轉換為 computeRentalIncome 可用的格式
function recordToComputable(rec, property) {
  return {
    id: rec.id || property.id,
    name: property.name,
    address: property.address,
    ownerId: property.ownerId,
    type: rec.type,
    monthlyRent: rec.monthlyRent,
    months: rec.months,
    annualRentDirect: rec.annualRentDirect, // 從合約來的直接年收入
    expenseRatio: rec.expenseRatio,
    taxFreeReason: rec.taxFreeReason,
    note: rec.note,
  };
}

// ============================================================
// 持久化 (localStorage)
// ============================================================
const STORAGE_KEY = "tw_tax_app_v1";
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return SAMPLE_DATA;
    const parsed = JSON.parse(raw);
    const merged = { ...SAMPLE_DATA, ...parsed };
    return migrateData(merged);
  } catch (e) { return SAMPLE_DATA; }
}

// 版本升級: v1 → v2 (加入 rentalRecords)
function migrateData(data) {
  const version = data.meta?.version || 1;
  // v1 → v2: 從舊 properties 自動產生 rentalRecords
  if (version < 2) {
    if (!data.rentalRecords) data.rentalRecords = [];
    const existsForPropYear = new Set(data.rentalRecords.map(r => `${r.propertyId}_${r.year}`));
    const allYears = [...new Set((data.filings || []).map(f => f.year))];
    (data.properties || []).forEach(p => {
      allYears.forEach(y => {
        const key = `${p.id}_${y}`;
        if (!existsForPropYear.has(key)) {
          data.rentalRecords.push({
            id: uid(),
            propertyId: p.id,
            year: y,
            monthlyRent: p.monthlyRent || 0,
            months: p.months || 12,
            type: p.type || "general",
            expenseRatio: p.expenseRatio || 0.43,
            taxFreeReason: p.taxFreeReason || "",
            note: "(舊資料自動匯入)",
            includeInFiling: true,
          });
        }
      });
    });
    data.meta = { ...(data.meta || {}), version: 2 };
  }
  // v2 → v3: 加 contracts 空陣列 (舊資料保留 rentalRecords 作為 fallback)
  if ((data.meta?.version || 1) < 3) {
    if (!data.contracts) data.contracts = [];
    data.meta = { ...(data.meta || {}), version: 3 };
  }
  return data;
}

function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...data, meta: { ...data.meta, lastSavedAt: new Date().toISOString() } }));
  } catch (e) { console.error("save fail", e); }
}

// Dashboard 頁
// 包裝 computeTaxForFiling: 自動填入該申報戶所屬物件 + rentalRecords
function computeFilingWithData(filing, data, year) {
  const filerIds = [filing.taxpayerId, filing.spouseId, ...(filing.dependentIds || [])].filter(Boolean);
  const householdProps = (data.properties || []).filter(p => filerIds.includes(p.ownerId));
  return computeTaxForFiling(
    { ...filing, properties: householdProps, rentalRecords: data.rentalRecords || [], contracts: data.contracts || [], manualRentOverrides: filing.manualRentOverrides || {} },
    data.members,
    year
  );
}

// ============================================================
function Dashboard({ data, year, setPage }) {
  // === 計算所有年度的所有申報戶結果 (給後面各區塊用) ===
  const allYearResults = {};  // {year: [{filing, result}]}
  AVAILABLE_YEARS.forEach(y => {
    const fs = data.filings.filter(f => f.year === y);
    allYearResults[y] = fs.map(f => ({
      filing: f,
      result: computeFilingWithData(f, data, y),
    }));
  });

  // === 第一部分:每個申報戶累積繳稅 ===
  // 規則:把不同年度但「同一申報戶」的累積在一起 (用 taxpayerId + spouseId 為 key)
  const householdGroups = {};  // {key: {label, members, byYear: {y: {fd, actual}}, totalActual, totalSys}}
  AVAILABLE_YEARS.forEach(y => {
    allYearResults[y].forEach(({ filing, result }) => {
      // 用「主納稅人 + 配偶」當識別 key
      const ids = [filing.taxpayerId, filing.spouseId].filter(Boolean).sort();
      const key = ids.join("_");
      if (!householdGroups[key]) {
        const members = ids.map(id => data.members.find(m => m.id === id)).filter(Boolean);
        householdGroups[key] = {
          key,
          label: members.map(m => m.name).join(" & "),
          members,
          byYear: {},
          totalActual: 0,
          totalSys: 0,
          totalRefund: 0,
          totalPaid: 0,
        };
      }
      const grp = householdGroups[key];
      const sysFd = result?.finalDue || 0;
      const actualAmt = filing.actualSettlement?.actualAmount;
      const hasActual = actualAmt !== undefined && actualAmt !== "" && actualAmt !== null;
      const fd = hasActual ? toNum(actualAmt) : sysFd;
      // 加總後續調整
      const adjustments = filing.adjustments || [];
      const adjTotal = adjustments.reduce((s, a) => {
        const v = toNum(a.amount);
        return a.type === "refund_received" ? s - v : s + v;
      }, 0);
      const finalCash = fd + adjTotal;  // 該年度實際淨支出 (正=補繳, 負=退稅)

      grp.byYear[y] = { fd, hasActual, finalCash, adjTotal, filing, result };
      grp.totalActual += finalCash;
      grp.totalSys += sysFd;
      if (finalCash > 0) grp.totalPaid += finalCash;
      else grp.totalRefund += -finalCash;
    });
  });
  const householdList = Object.values(householdGroups).sort((a, b) => b.totalPaid - a.totalPaid);

  // === 第三部分用:每年度每申報戶的「所得類別 / 捐贈 / 租金」 ===
  // 列出每年度的申報戶,顯示這些欄位
  const yearlyBreakdown = [];
  AVAILABLE_YEARS.forEach(y => {
    allYearResults[y].forEach(({ filing, result }) => {
      if (!result) return;
      const it = filing.itemizedDeductions || {};
      yearlyBreakdown.push({
        year: y,
        filing,
        result,
        salaryGross: result.salaryGross || 0,
        interest: result.interest || 0,
        dividend: result.dividend || 0,
        rentalTaxable: result.rentalTaxable || 0,
        otherIncome: result.otherIncome || 0,
        donationTotal: toNum(it.donationGeneral) + toNum(it.donationUnlimited),
        finalDue: result.finalDue || 0,
      });
    });
  });

  // === 第四部分用:成員 × 項目 × 年度 矩陣 ===
  // 對每個成員,計算他在各年度的:薪資、利息、股利、租金、其他、捐贈、應補繳
  // 一個成員可能在不同年度屬於不同 filing,把每年度的所有 filing 中該成員相關的金額累加
  const memberYearlyMatrix = {};  // {memberId: {memberName, byYear: {y: {salary,interest,...,donation,finalDue,inFiling}}}}
  AVAILABLE_YEARS.forEach(y => {
    allYearResults[y].forEach(({ filing, result }) => {
      if (!result) return;
      // 該 filing 涉及哪些成員 (本人+配偶+扶養親屬)
      const filerIds = [filing.taxpayerId, filing.spouseId, ...(filing.dependentIds || [])].filter(Boolean);
      filerIds.forEach(mid => {
        const member = data.members.find(m => m.id === mid);
        if (!member) return;
        if (!memberYearlyMatrix[mid]) {
          memberYearlyMatrix[mid] = { memberName: member.name, byYear: {} };
        }
        const cell = memberYearlyMatrix[mid].byYear[y] || {
          salary: 0, interest: 0, dividend: 0, rentalTaxable: 0, other: 0,
          donation: 0, finalDue: 0, filingId: null,
        };
        // 從 incomeEntries 累加該成員所得 (按 ownerId)
        const entries = (filing.incomeEntries || []).filter(e => e.ownerId === mid);
        entries.forEach(e => {
          const net = computeEntryNet(e);
          if (e.category === "salary") cell.salary += toNum(e.gross);
          else if (e.category === "interest") cell.interest += net;
          else if (e.category === "dividend") cell.dividend += net;
          else if (e.category === "rental") cell.rentalTaxable += net;
          else cell.other += net;
        });
        // 加上該成員的租賃(從合約推算)
        const myProps = (filing.properties || []).filter(p => p.ownerId === mid);
        if (myProps.length > 0) {
          const myComputable = myProps.flatMap(p =>
            getComputablesForProperty(p, y, filing.contracts, filing.rentalRecords || [], filing.manualRentOverrides));
          const r = computeRentalIncome(myComputable, TAX_PARAMS[y]);
          cell.rentalTaxable += r.taxable;
        }
        // 捐贈 (依比例分:本案夫妻合併時,本人/配偶各記一半;或直接歸到主納稅人)
        // 簡化:捐贈整筆歸主納稅人 (現實中也是這樣記錄)
        if (mid === filing.taxpayerId) {
          const it = filing.itemizedDeductions || {};
          cell.donation += toNum(it.donationGeneral) + toNum(it.donationUnlimited);
          // 應補繳也歸主納稅人
          const sysFd = result.finalDue || 0;
          const actual = filing.actualSettlement?.actualAmount;
          const fd = (actual !== undefined && actual !== "" && actual !== null) ? toNum(actual) : sysFd;
          cell.finalDue += fd;
        }
        cell.filingId = filing.id;
        memberYearlyMatrix[mid].byYear[y] = cell;
      });
    });
  });
  const memberMatrixList = Object.entries(memberYearlyMatrix)
    .map(([mid, info]) => ({ memberId: mid, ...info }))
    .sort((a, b) => {
      // 按 members 順序排
      const ia = data.members.findIndex(m => m.id === a.memberId);
      const ib = data.members.findIndex(m => m.id === b.memberId);
      return ia - ib;
    });

  // === 第五部分用:租賃合約年度比較 (歸戶屋主 + 物件) ===
  // 找出所有 5 年內被申報過的物件
  const propertiesUsedAcrossYears = new Set();
  AVAILABLE_YEARS.forEach(y => {
    allYearResults[y].forEach(({ filing, result }) => {
      if (!result) return;
      // 從 filing.properties (含 owner) 取
      const filerIds = [filing.taxpayerId, filing.spouseId, ...(filing.dependentIds || [])].filter(Boolean);
      (data.properties || []).filter(p => filerIds.includes(p.ownerId))
        .forEach(p => propertiesUsedAcrossYears.add(p.id));
    });
  });
  const rentalCompareRows = Array.from(propertiesUsedAcrossYears).map(pId => {
    const p = data.properties.find(pp => pp.id === pId);
    if (!p) return null;
    const owner = data.members.find(m => m.id === p.ownerId);
    const byYear = {};
    AVAILABLE_YEARS.forEach(y => {
      const agg = aggregateContractsForYear(data.contracts, p.id, y, {});
      // 找出該物件在該年度對應的 filing,看是否被計入
      const filingForYear = data.filings.find(f =>
        f.year === y &&
        [f.taxpayerId, f.spouseId, ...(f.dependentIds || [])].includes(p.ownerId)
      );
      const overrides = filingForYear?.manualRentOverrides || {};
      const isIncluded = overrides[`${p.id}_${y}`]?.includeInFiling === true;

      // 算實際採用的租金 (考慮手動調整 + 排除合約)
      const computables = getComputablesForProperty(p, y, data.contracts, [], overrides);
      const annualRent = computables.reduce((s, c) => s + (c.annualRentDirect || c.monthlyRent * c.months || 0), 0);
      const monthsCount = agg.contracts ? agg.contracts.filter(c => c.months > 0).length : 0;
      const contractMonths = agg.totalMonths || 0;
      const types = new Set(agg.contracts?.filter(c => c.months > 0).map(c => c.isPublic ? "公益" : "一般"));

      byYear[y] = {
        annualRent: isIncluded ? annualRent : 0,
        actualRent: agg.computedAnnualRent || 0,
        included: isIncluded,
        contractsCount: monthsCount,
        months: contractMonths,
        typeLabel: Array.from(types).join("+") || "—",
      };
    });
    return { property: p, owner, byYear };
  }).filter(Boolean);

  return (
    <div className="fade-in">
      <PageHeader
        ornament="§ DASHBOARD"
        title="家族稅務總覽"
        subtitle="按申報戶 / 年度 / 物件多維檢視"
        right={

                  <td className="text-right px-3 py-3 num text-sm" style={{ color: "var(--green)" }}>

                  {AVAILABLE_YEARS.map(y => {
                    const total = householdList.reduce((s, g) => s + (g.byYear[y]?.finalCash || 0), 0);

                      <td key={y} className="text-right px-3 py-3 num text-xs font-medium" style={{ color: total > 0 ? "var(--ink)" : total < 0 ? "var(--green)" : "var(--ink-mute)" }}>

                    {fmt(householdList.reduce((s, g) => s + g.totalPaid, 0))}
                  </td>
                  <td className="text-right px-3 py-3 num font-medium" style={{ color: "var(--green)" }}>

      <div className="card mb-6">
        <div className="px-5 py-3" style={{ borderBottom: "1px solid var(--line)", background: "#fafaf6" }}>
          <div className="ornament">PART 2 · 各年度申報戶明細</div>
          <div className="font-serif text-base mt-1">📑 按年度展開查看</div>
        </div>
        <div className="p-3 space-y-2">
          {AVAILABLE_YEARS.map(y => {
            const filings = allYearResults[y];
            if (filings.length === 0) return null;
            return (
              <details key={y} className="rounded" style={{ border: "1px solid var(--line)" }}>
                <summary className="px-4 py-2 cursor-pointer flex items-center justify-between hover:bg-gray-50">
                  <div className="flex items-center gap-3">
                    <span className="chevron text-xs" style={{ color: "var(--ink-mute)" }}>▸</span>
                    <span className="font-serif font-medium">{y} 年度</span>

                  <div className="flex items-center gap-3 text-xs num" style={{ color: "var(--ink-soft)" }}>
                    <span>合計補繳 <b>{fmt(filings.reduce((s, { filing, result }) => {
                      const sysFd = result?.finalDue || 0;
                      const actual = filing.actualSettlement?.actualAmount;
                      const fd = (actual !== undefined && actual !== "") ? toNum(actual) : sysFd;
                      return s + Math.max(0, fd);
                    }, 0))}</b></span>

                      <tr style={{ background: "#fafaf6", borderBottom: "1px solid var(--line)" }}>

                        <th className="text-right px-3 py-2 font-medium" style={{ color: "var(--ink-mute)" }}>淨所得</th>
                        <th className="text-center px-3 py-2 font-medium" style={{ color: "var(--ink-mute)" }}>稅率</th>

                    </thead>
                    <tbody>
                      {filings.map(({ filing, result }) => {
                        const sysFd = result?.finalDue || 0;
                        const actual = filing.actualSettlement?.actualAmount;
                        const hasActual = actual !== undefined && actual !== "" && actual !== null;
                        const fd = hasActual ? toNum(actual) : sysFd;
                        // 後續政府調整 (補繳/罰金/利息正 / 退稅負)
                        const adjustments = filing.adjustments || [];
                        const adjTotal = adjustments.reduce((s, a) => {
                          const v = toNum(a.amount);
                          return a.type === "refund_received" ? s - v : s + v;
                        }, 0);

                          <tr key={filing.id} className="table-row" style={{ borderBottom: "1px solid var(--line-soft)" }}>
